# Site settings
title: Prof. José Dihego
locale: "en-US"
subtitle: 真実は勝つ
email: josedihego@gmail.com
url: "https://josedihego.net"
description: >- # this means to ignore newlines until "baseurl:"
 Full Professor (Professor Titular <img src='/assets/images/br-flag.svg' alt='Brazilian flag' style='width:20px;height:14px;vertical-align:middle;border-radius:2px;'/>) at Federal Institute of Education, Science and Technology of Bahia - IFBA (since 2010). Education: Graduated (2008), Master (2010) and Doctorate (2016) in Computer Science, all three at CIn-UFPE. Interested in Formal Methods, Programming Languages ​​and Mobile Development. 
twitter_username: 
github_username: josedihego
og_image: "/assets/images/og-card.jpg"
minimal_mistakes_skin: default
#minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

search: true

# Theme script first, then hold its init until web fonts load (see assets/js/font-ready.js)
footer_scripts:
  - /assets/js/main.min.js
  - /assets/js/font-ready.js

lunr:
  search_within_pages: true

# Build settings
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter_opts:
    block:
      line_numbers: false
remote_theme: mmistakes/minimal-mistakes@4.28.1
# Outputting
permalink: /:categories/:title/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache



