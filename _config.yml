defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages: Portuguese by default (menu, sidebar bio and theme texts follow `locale`).
  # English pages set `locale: en-US` and `author: en`; pages with both versions set `translation:`.
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      locale: "pt-BR"
      author: pt

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

collections:
  news:
    output: true
    permalink: /news/:path/
    
header:
