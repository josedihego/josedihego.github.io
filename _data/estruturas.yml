      experimento:
        arquivo: "aula31_experimento.c"
        pergunta: "Em grafos esparsos, quantas operações fazem Dijkstra com vetor, Dijkstra com heap e Bellman-Ford?"
        conclusao: "As contagens batem: \\(V^2 + E\\) e \\((V-1)E\\) exatos, e \\(\\Theta(V\\lg V)\\) com heap. Em grafos esparsos, o heap é 130 vezes mais barato que o vetor para \\(V = 4.000\\).\nEm grafos densos (\\(E \\approx V^2\\)), o vetor volta a ser competitivo: a melhor estrutura depende da densidade do grafo."
      conexoes:
        - area: "Navegação (GPS)"
          texto: "Google Maps e Waze usam Dijkstra com acelerações (A*, hierarquias de contração) em grafos de bilhões de arestas, com pesos que mudam com o trânsito."
        - area: "Roteamento na internet"
          texto: "OSPF e IS-IS rodam Dijkstra em cada roteador; RIP e BGP são variações distribuídas do Bellman-Ford (vetor de distâncias)."
        - area: "Finanças"
          texto: "Com pesos \\(-\\log(\\text{câmbio})\\), um ciclo negativo é uma oportunidade de arbitragem entre moedas: Bellman-Ford a detecta."
        - area: "Logística"
          texto: "Roteirização de entregas e planejamento de rotas de transporte público começam com caminhos mínimos entre todos os pontos de interesse."
