    - n: 28
      tema: "Grafos e busca em largura"
      tipo: "aula"
      cormen: "Cormen, seções 22.1 e 22.2"
      slides: "aula28.pdf"
      objetivos:
        - "Representar grafos por listas de adjacência e por matriz de adjacência"
        - "Executar a busca em largura e obter distâncias e a árvore de caminhos mínimos"
        - "Provar que a BFS custa \\(O(V + E)\\)"
        - "Medir o custo linear e o “mundo pequeno de grafos aleatórios"
      codigo:
        - arquivo: "aula28_bfs.c"
          titulo: "Busca em largura em C"
      experimento:
        arquivo: "aula28_experimento.c"
        pergunta: "A BFS faz exatamente V + 2E operações? Qual a distância média num grafo aleatório com grau médio 10?"
        conclusao: "A BFS faz exatamente \\(V + 2E\\) operações: linear. E grafos aleatórios são “pequenos”: com dois milhões de vértices e grau médio 10, a distância média é 6,4, crescendo como \\(\\ln V\\).\nÉ o fenômeno dos seis graus de separação, medido por BFS em redes sociais reais."
      conexoes:
        - area: "Redes sociais"
          texto: "O Facebook mediu, com BFS em 721 milhões de usuários, uma distância média de 4,74; “pessoas que você talvez conheça são vértices à distância 2."
        - area: "Web e buscadores"
          texto: "Rastreadores (crawlers) percorrem a web em largura a partir de páginas-semente: a BFS encontra primeiro as páginas mais próximas e relevantes."
        - area: "Redes de computadores"
          texto: "Broadcast e descoberta de vizinhos inundam a rede camada por camada; o traceroute revela as camadas da BFS da internet."
        - area: "Jogos e robótica"
          texto: "Em mapas em grade sem pesos, a BFS dá o menor caminho de um personagem ou robô; o cubo de Rubik foi resolvido (“número de Deus = 20) com buscas em largura."
