# Gerado por _tools/estruturas/gerar.py a partir de plano.py – não edite à mão
- bloco: 0
  rotulo: "Anexo"
  opcional: false
  tag: "Anexo"
  titulo: "Base Prática em C"
  resumo: "Cinco módulos de apoio, antes do bloco 1, com o C que as estruturas de dados exigem além do básico: memória e alocação dinâmica, ponteiros (simples, duplos, para funções e para structs), structs, funções genéricas e arquivos."
  aulas:
    - n: "B1"
      tema: "Memória: pilha, heap e alocação dinâmica"
      tipo: "aula"
      cormen: "Kernighan e Ritchie, C: a linguagem de programação, seções 5.4 e 8.7; Cormen et al., seção 10.3"
      slides: "base1.pdf"
      objetivos:
        - "Distinguir a pilha (variáveis locais) do heap (alocação dinâmica)"
        - "Usar malloc, calloc, realloc e free corretamente"
        - "Reconhecer vazamentos, ponteiros soltos e liberações duplas"
        - "Medir quanto um malloc pequeno custa em bytes e em tempo"
      codigo:
        - arquivo: "base1_memoria.c"
          titulo: "Alocação dinâmica em C"
      experimento:
        arquivo: "base1_experimento.c"
        pergunta: "Quantos bytes de heap e quantos nanossegundos custa cada malloc de 16 bytes?"
        conclusao: "Cada malloc de 16 bytes ocupa 32 bytes e custa dezenas de nanossegundos. Uma lista ligada de inteiros gasta muito mais memória e tempo que um vetor com os mesmos dados.\nÉ por isso que estruturas de alto desempenho alocam em blocos (pools) e por isso a aula 16 mostra listas guardadas em vetores."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "malloc pede páginas ao kernel com brk e mmap; a memória virtual e a paginação ficam por trás de cada ponteiro."
        - area: "Segurança"
          texto: "Estouros de buffer e uso após free são as falhas mais exploradas da história; linguagens como Rust impedem esses erros já na compilação."
        - area: "Linguagens com coleta de lixo"
          texto: "Java, Python e Go liberam a memória sozinhas (coletor de lixo); C dá controle total, e a responsabilidade junto."
        - area: "Sistemas embarcados"
          texto: "Em microcontroladores com poucos KB, o heap fragmenta: por isso o padrão MISRA C proíbe malloc depois da inicialização."
    - n: "B2"
      tema: "Ponteiros: endereços, aritmética e ponteiro para ponteiro"
      tipo: "aula"
      cormen: "Kernighan e Ritchie, C: a linguagem de programação, capítulo 5; Cormen et al., seção 10.3"
      slides: "base2.pdf"
      objetivos:
        - "Usar & e * e entender o que um ponteiro guarda"
        - "Relacionar vetores e ponteiros pela aritmética de ponteiros"
        - "Passar parâmetros por referência e alterar um ponteiro dentro de uma função (int **)"
        - "Alocar matrizes dinâmicas e medir o efeito da ordem de percurso"
      codigo:
        - arquivo: "base2_ponteiros.c"
          titulo: "Ponteiros em C"
      experimento:
        arquivo: "base2_experimento.c"
        pergunta: "Percorrer uma matriz por linhas e por colunas custa o mesmo tempo por elemento?"
        conclusao: "A mesma conta, na ordem errada, fica 30 vezes mais lenta para \\(n = 4096\\). Ponteiros dão acesso direto à memória, e a memória tem geografia: vizinhos são baratos, saltos são caros.\nNas próximas aulas, a mesma lição aparece em listas ligadas (aula 14) e em grafos (aula 29)."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "O kernel manipula páginas, processos e dispositivos por ponteiros; um ponteiro inválido no kernel derruba a máquina inteira."
        - area: "Compiladores"
          texto: "Otimizadores trocam a ordem de laços (loop interchange) para percorrer matrizes por linhas; a análise de aliasing decide se dois ponteiros podem se sobrepor."
        - area: "Hardware e GPUs"
          texto: "Bibliotecas de álgebra linear (BLAS) e GPUs dividem matrizes em blocos que cabem no cache: o mesmo efeito do experimento, explorado ao máximo."
        - area: "Bancos de dados"
          texto: "Bancos orientados a linhas (OLTP) e a colunas (OLAP, como DuckDB) são as duas ordens do experimento: cada um vence num tipo de consulta."
    - n: "B3"
      tema: "Structs: registros, ponteiros para structs e nós"
      tipo: "aula"
      cormen: "Kernighan e Ritchie, C: a linguagem de programação, capítulo 6; Cormen et al., seção 10.3"
      slides: "base3.pdf"
      objetivos:
        - "Declarar structs com typedef e acessar campos com . e ->"
        - "Construir vetores de structs e structs autorreferentes (nós)"
        - "Entender alinhamento e preenchimento (sizeof, offsetof)"
        - "Medir vetor de structs (AoS) contra struct de vetores (SoA)"
      codigo:
        - arquivo: "base3_structs.c"
          titulo: "Structs em C"
      experimento:
        arquivo: "base3_experimento.c"
        pergunta: "Somar um único campo de n registros custa o mesmo num vetor de structs (AoS) e num vetor só com aquele campo (SoA)?"
        conclusao: "A organização dos dados na memória muda o desempenho em 5 vezes, com o mesmo algoritmo. Agrupar em structs é o natural para programar; separar em vetores é o natural para o hardware.\nBancos colunares, motores de jogos e bibliotecas de ciência de dados escolhem SoA pelo mesmo motivo."
      conexoes:
        - area: "Redes"
          texto: "Cabeçalhos IP, TCP e Ethernet são structs com campos em posições fixas; o preenchimento errado corrompe pacotes (__attribute__((packed)))."
        - area: "Sistemas de arquivos"
          texto: "O inode do Linux e as entradas de diretório são structs gravadas no disco byte a byte."
        - area: "Motores de jogos"
          texto: "Arquiteturas entity component system guardam cada componente (posição, velocidade) num vetor próprio: SoA para atualizar milhões de objetos por quadro."
        - area: "Ciência de dados"
          texto: "NumPy, pandas e Apache Arrow guardam cada coluna num vetor contíguo: é o SoA do experimento, e a razão de serem tão rápidos."
    - n: "B4"
      tema: "Funções: recursão, ponteiros para funções e código genérico"
      tipo: "aula"
      cormen: "Kernighan e Ritchie, C: a linguagem de programação, seções 4.10, 5.11 e B.5"
      slides: "base4.pdf"
      objetivos:
        - "Entender a pilha de chamadas e o custo de memória da recursão"
        - "Declarar e usar ponteiros para funções"
        - "Escrever código genérico com void * e qsort"
        - "Medir os bytes de pilha por chamada e as comparações do qsort"
      codigo:
        - arquivo: "base4_funcoes.c"
          titulo: "Funções e ponteiros para funções"
      experimento:
        arquivo: "base4_experimento.c"
        pergunta: "Quantos bytes de pilha cada chamada recursiva usa? Quantas vezes o qsort chama o comparador?"
        conclusao: "A pilha cresce exatamente em linha reta com a profundidade (um quadro de tamanho fixo por chamada), e o qsort chama o comparador \\(n\\lg n - 1{,}26\\,n\\) vezes: a fórmula do merge sort.\nMedir revela o que a biblioteca faz por dentro: o nome diz “quick”, mas o comportamento é de merge sort."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "Tratadores de sinais e de interrupções, pthread_create e os drivers de dispositivo (struct file_operations) são tabelas de ponteiros para funções."
        - area: "Interfaces gráficas"
          texto: "Botões e eventos chamam funções registradas (callbacks): GTK, o DOM do navegador e o Android funcionam assim."
        - area: "Programação orientada a objetos"
          texto: "Métodos virtuais do C++ são ponteiros para funções numa tabela (vtable); o mesmo padrão aparece no kernel escrito em C."
        - area: "Inteligência artificial"
          texto: "Funções de ativação, de perda e otimizadores são passados como parâmetros: um treinador genérico recebe “qual função usar."
    - n: "B5"
      tema: "Arquivos, argumentos e erros"
      tipo: "aula"
      cormen: "Kernighan e Ritchie, C: a linguagem de programação, capítulo 7 e seção 5.10"
      slides: "base5.pdf"
      objetivos:
        - "Ler e escrever arquivos texto e binários"
        - "Receber parâmetros pela linha de comando (argc, argv)"
        - "Tratar erros com valores de retorno, perror e assert"
        - "Medir o tamanho e o tempo de arquivos texto contra binários"
      codigo:
        - arquivo: "base5_arquivos.c"
          titulo: "Arquivos e erros em C"
      experimento:
        arquivo: "base5_experimento.c"
        pergunta: "Quantos bytes e quantos nanossegundos custa cada número gravado e relido em texto e em binário?"
        conclusao: "Os dois formatos são lineares, mas com constantes muito diferentes: o texto é 72% maior e 35 vezes mais lento. O binário é exatamente \\(4n\\) bytes.\nPor isso bancos de dados, imagens e modelos de IA são guardados em binário, e dados para trocar com pessoas e outras ferramentas, em texto."
      conexoes:
        - area: "Bancos de dados"
          texto: "Tabelas e índices ficam em arquivos binários de páginas de tamanho fixo (4 a 16 KB); fseek para a página \\(k\\) é k * tamanho."
        - area: "Redes"
          texto: "Protocolos binários (TCP/IP, gRPC/Protobuf) são compactos e rápidos; protocolos de texto (HTTP/1.1, JSON) são legíveis. A escolha é a mesma do experimento."
        - area: "Ciência de dados"
          texto: "CSV é universal, mas Parquet e Arrow (binários e colunares) são até dezenas de vezes menores e mais rápidos para grandes volumes."
        - area: "Ferramentas de linha de comando"
          texto: "grep, sort e gcc leem argv, leem stdin, escrevem stdout e devolvem um código de saída: é o que permite encadeá-los com |."
- bloco: 1
  rotulo: "Bloco 1"
  opcional: false
  tag: ""
  titulo: "Fundamentos, ordenação e custo"
  resumo: "Análise de algoritmos, ordenação por inserção, merge sort, notação assintótica, recorrências, dividir e conquistar e heaps. Termina com o Projeto 1."
  aulas:
    - n: 1
      tema: "Algoritmos, eficiência e o método experimental"
      tipo: "aula"
      cormen: "Cormen, capítulo 1"
      slides: "aula01.pdf"
      objetivos:
        - "Definir algoritmo, instância e corretude"
        - "Explicar por que eficiência importa mais que hardware"
        - "Medir tempo de execução em C de forma confiável"
        - "Usar a razão de dobra para reconhecer crescimento linear e quadrático"
      codigo:
        - arquivo: "aula01_cronometro.c"
          titulo: "Cronômetro e dois algoritmos"
      experimento:
        arquivo: "aula01_experimento.c"
        pergunta: "Ao dobrar n, o tempo de um algoritmo linear dobra e o de um quadrático quadruplica?"
        conclusao: "Os dois tempos seguem a forma prevista: a curva do quadrático é uma parábola e a do linear, uma reta.\nPara \\(n = 32.000\\), o algoritmo quadrático já gasta cerca de 100 vezes mais que o linear, e a distância cresce com \\(n\\).\nA forma da curva é uma propriedade do algoritmo; a constante é da máquina."
      conexoes:
        - area: "Inteligência artificial"
          texto: "Treinar um modelo de linguagem custa da ordem de \\(6 \\times\\) parâmetros \\(\\times\\) tokens operações: a análise de custo decide quais modelos são viáveis."
        - area: "Criptografia"
          texto: "A segurança do RSA depende de não existir algoritmo eficiente conhecido para fatorar inteiros grandes: a ineficiência vira proteção."
        - area: "Computação verde"
          texto: "Data centers consomem cerca de 1–2% da energia elétrica mundial. Trocar \\(n^2\\) por \\(n\\lg n\\) economiza energia, não só tempo."
        - area: "Engenharia de desempenho"
          texto: "Ferramentas como perf, gprof e testes de regressão de desempenho em integração contínua aplicam o método desta aula na indústria."
    - n: 2
      tema: "Ordenação por inserção e invariantes de laço"
      tipo: "aula"
      cormen: "Cormen, seção 2.1"
      slides: "aula02.pdf"
      objetivos:
        - "Executar a ordenação por inserção à mão, passo a passo"
        - "Provar a corretude com um invariante de laço: inicialização, manutenção e término"
        - "Traduzir o pseudocódigo (índices \\(1..n\\)) para C (índices \\(0..n-1\\))"
        - "Medir comparações e confrontar com \\(n-1\\), \\(n^2/4\\) e \\(n(n-1)/2\\)"
      codigo:
        - arquivo: "aula02_insercao.c"
          titulo: "Ordenação por inserção em C"
      experimento:
        arquivo: "aula02_experimento.c"
        pergunta: "Quantas comparações a ordenação por inserção faz em entradas ordenadas, aleatórias e invertidas?"
        conclusao: "As três previsões se confirmam: exatamente \\(n-1\\) e \\(n(n-1)/2\\) nos casos extremos, e \\(n^2/4\\) com desvio abaixo de 3% no caso aleatório.\nA ordenação por inserção é linear em dados ordenados e quadrática em dados aleatórios: o tipo de entrada importa tanto quanto o tamanho."
      conexoes:
        - area: "Bibliotecas de linguagens"
          texto: "O Timsort (sorted do Python, Arrays.sort de objetos no Java) ordena trechos curtos com inserção binária: para \\(n\\) pequeno, ela vence algoritmos \\(n\\lg n\\)."
        - area: "Sistemas embarcados"
          texto: "No lugar, sem recursão e com código minúsculo: cabe em microcontroladores com poucos KB de RAM, onde malloc e pilha profunda são luxo."
        - area: "Fluxos de dados"
          texto: "É um algoritmo online: ordena à medida que os dados chegam. Manter um placar ao vivo ou as \\(k\\) maiores leituras de um sensor é uma inserção por evento."
        - area: "Verificação formal"
          texto: "Invariantes de laço são a base de ferramentas como Dafny, Frama-C (ACSL) e Why3, que provam código real. Sem o invariante, o provador não consegue."
    - n: 3
      tema: "Análise de algoritmos: o modelo RAM e os casos"
      tipo: "aula"
      cormen: "Cormen, seção 2.2"
      slides: "aula03.pdf"
      objetivos:
        - "Descrever o modelo RAM e o que ele ignora"
        - "Calcular \\(T(n)\\) da inserção somando custo \\(\\times\\) vezes de cada linha"
        - "Distinguir melhor caso, pior caso e caso médio"
        - "Prever e medir o caso médio exato: \\(n(n-1)/4 + n - H_n\\)"
      codigo:
        - arquivo: "aula03_custo_por_linha.c"
          titulo: "Contando cada linha"
      experimento:
        arquivo: "aula03_experimento.c"
        pergunta: "A média de comparações da inserção em permutações aleatórias bate com n(n−1)/4 + n − H_n?"
        conclusao: "A fórmula do caso médio é confirmada: a média medida fica a menos de 1% de \\(n(n-1)/4 + n - H_n\\), praticamente a metade do pior caso.\nO histograma mostra que execuções muito diferentes da média são raras. Caso médio quadrático: para dados aleatórios, a inserção não escapa de \\(\\Theta(n^2)\\)."
      conexoes:
        - area: "Sistemas de tempo real"
          texto: "Freio ABS e marca-passo não podem atrasar: a análise de pior caso de tempo de execução (WCET) garante que todo prazo seja cumprido."
        - area: "Segurança"
          texto: "Ataques de complexidade enviam a entrada do pior caso de propósito: expressões regulares catastróficas (ReDoS) e colisões em tabelas hash derrubam servidores."
        - area: "Compiladores"
          texto: "Otimizadores usam modelos de custo por instrução, como a tabela desta aula, para decidir desenrolar laços, embutir funções ou vetorizar."
        - area: "Serviços web"
          texto: "Média engana: plataformas monitoram a cauda (latência p99, p99,9), porque com milhões de requisições o pior caso acontece a cada segundo."
    - n: 4
      tema: "Dividir e conquistar: merge sort"
      tipo: "aula"
      cormen: "Cormen, seção 2.3"
      slides: "aula04.pdf"
      objetivos:
        - "Aplicar o paradigma dividir, conquistar e combinar"
        - "Executar Merge e provar sua corretude por invariante"
        - "Escrever a recorrência do merge sort e resolvê-la pela árvore de recursão"
        - "Medir \\(n\\lg n\\) e achar o ponto em que a inserção deixa de valer a pena"
      codigo:
        - arquivo: "aula04_merge_sort.c"
          titulo: "Merge sort em C"
      experimento:
        arquivo: "aula04_experimento.c"
        pergunta: "O merge sort faz cerca de n lg n comparações? Para que n ele passa a vencer a inserção?"
        conclusao: "O merge sort faz \\(n\\lg n - 1{,}26\\,n\\) comparações, com desvio menor que 1%.\nMas a ordem de crescimento não diz tudo: para \\(n\\) até algumas centenas, a inserção é mais rápida.\nAlgoritmos híbridos (Timsort, introsort) usam inserção abaixo de um limiar e dividir e conquistar acima dele."
      conexoes:
        - area: "Bancos de dados"
          texto: "O sort-merge join ordena duas tabelas pela chave e as intercala. A ordenação externa ordena arquivos maiores que a RAM em blocos e depois os intercala."
        - area: "Armazenamento (LSM-trees)"
          texto: "RocksDB, Cassandra e LevelDB escrevem em blocos ordenados e os compactam por intercalação: o Merge em escala de terabytes."
        - area: "Big Data"
          texto: "MapReduce e Spark dividem os dados entre máquinas, processam em paralelo e combinam os resultados: o mesmo paradigma, num cluster."
        - area: "Computação paralela"
          texto: "As duas metades são independentes: o merge sort paraleliza naturalmente em CPUs com vários núcleos e em GPUs."
    - n: 5
      tema: "Notação assintótica: \\(O\\), \\(\\Omega\\) e \\(\\Theta\\)"
      tipo: "aula"
      cormen: "Cormen, capítulo 3"
      slides: "aula05.pdf"
      objetivos:
        - "Definir \\(\\Theta\\), \\(O\\), \\(\\Omega\\), \\(o\\) e \\(\\omega\\) e interpretá-las graficamente"
        - "Provar relações assintóticas exibindo constantes \\(c\\) e \\(n_0\\)"
        - "Ordenar funções comuns pela taxa de crescimento"
        - "Estimar a ordem de crescimento a partir de medições (log-log e razão de dobra)"
      codigo:
        - arquivo: "aula05_crescimento.c"
          titulo: "Quanto cabe em 1 segundo"
      experimento:
        arquivo: "aula05_experimento.c"
        pergunta: "Medindo operações de quatro algoritmos, conseguimos identificar lg n, n, n lg n e n²?"
        conclusao: "As contagens batem exatamente com \\(n(n-1)/2\\), \\(n\\lg n\\), \\(n\\) e \\(\\lg n\\).\nEm escala log-log, a ordem de crescimento aparece como inclinação. Para estimar \\(k\\) a partir de duas medições:\n\\(k \\approx \\lg\\big(T(2n)/T(n)\\big)\\), a razão de dobra da aula 1."
      conexoes:
        - area: "Ciência de dados"
          texto: "O \\(k\\)-means custa \\(O(n\\,k\\,d\\,i)\\); um algoritmo \\(O(n^2)\\) inviabiliza bases com milhões de linhas. A notação assintótica decide o que escala."
        - area: "Teoria da complexidade"
          texto: "P contra NP pergunta se problemas verificáveis em tempo polinomial também são resolvíveis em tempo polinomial: um dos sete problemas do milênio."
        - area: "Bioinformática"
          texto: "Alinhar duas sequências custa \\(\\Theta(mn)\\): para genomas de bilhões de bases, isso força heurísticas como BLAST."
        - area: "Contratos de serviço (SLA)"
          texto: "Garantir resposta em 100 ms para qualquer carga exige saber como o tempo cresce com os dados; a ordem de crescimento entra no planejamento de capacidade."
    - n: 6
      tema: "Recorrências: árvore de recursão e teorema mestre"
      tipo: "aula"
      cormen: "Cormen, seções 4.3 a 4.5"
      slides: "aula06.pdf"
      objetivos:
        - "Modelar algoritmos recursivos por recorrências"
        - "Resolver recorrências pela árvore de recursão e confirmar por substituição"
        - "Aplicar os três casos do teorema mestre"
        - "Conferir numericamente as previsões do teorema"
      codigo:
        - arquivo: "aula06_recorrencias.c"
          titulo: "Calculando recorrências"
      experimento:
        arquivo: "aula06_experimento.c"
        pergunta: "Os valores exatos de quatro recorrências seguem as soluções do teorema mestre?"
        conclusao: "As soluções exatas coincidem com os valores calculados, e a de Strassen converge para \\(\\frac73\\,n^{\\lg 7}\\).\nO teorema mestre acerta a ordem de crescimento; para a constante, é preciso resolver a recorrência com mais cuidado (substituição ou árvore completa)."
      conexoes:
        - area: "Processamento de sinais"
          texto: "A FFT satisfaz \\(T(n) = 2T(n/2) + \\Theta(n)\\): \\(n\\lg n\\) em vez de \\(n^2\\) viabiliza áudio digital, 4G/5G, ressonância magnética e compressão JPEG/MP3."
        - area: "Álgebra linear e IA"
          texto: "Strassen (\\(n^{2,81}\\)) e sucessores mostram que multiplicar matrizes, o núcleo das redes neurais, pode custar menos que \\(n^3\\)."
        - area: "Computação paralela"
          texto: "Algoritmos paralelos são analisados por duas recorrências: trabalho total e span (caminho crítico). O paralelismo é a razão entre elas."
        - area: "Linguagens e sistemas"
          texto: "A profundidade da recursão é a altura da árvore: com \\(\\lg n\\) níveis, a pilha de chamadas fica pequena; com \\(n\\) níveis, ocorre estouro de pilha."
    - n: 7
      tema: "Subarranjo máximo: três algoritmos, três ordens"
      tipo: "aula"
      cormen: "Cormen, seção 4.1"
      slides: "aula07.pdf"
      objetivos:
        - "Reduzir o problema de compra e venda de ações ao subarranjo máximo"
        - "Resolver por força bruta, por divisão e conquista e pelo algoritmo linear"
        - "Analisar o algoritmo de divisão e conquista pela recorrência \\(2T(n/2) + \\Theta(n)\\)"
        - "Medir \\(n^2/2\\), \\(n\\lg n\\) e \\(n\\) operações"
      codigo:
        - arquivo: "aula07_subarranjo.c"
          titulo: "Subarranjo máximo por divisão e conquista"
      experimento:
        arquivo: "aula07_experimento.c"
        pergunta: "Quantas somas fazem a força bruta, a divisão e conquista e o algoritmo de Kadane?"
        conclusao: "As contagens são exatamente \\(n(n+1)/2\\), \\(n\\lg n\\) e \\(n\\), e as três respostas coincidem em todos os testes.\nDivisão e conquista melhora muito a força bruta, mas uma ideia melhor (programação dinâmica, aula 33) chega a \\(\\Theta(n)\\):\nnenhum paradigma é a última palavra."
      conexoes:
        - area: "Finanças"
          texto: "Melhor janela de compra e venda, maior sequência de lucro ou de perda (drawdown) numa carteira: o problema desta aula com dados reais."
        - area: "Bioinformática"
          texto: "Atribuindo pesos a aminoácidos ou nucleotídeos, o segmento de soma máxima localiza regiões transmembranares em proteínas e ilhas CpG no DNA."
        - area: "Visão computacional"
          texto: "A versão 2D, o retângulo de soma máxima, encontra a região mais clara ou mais “ativa de uma imagem em \\(O(n^3)\\), com Kadane nas colunas."
        - area: "Monitoramento"
          texto: "Em séries temporais (CPU, batimentos, tráfego), subtrair a média e achar o subarranjo máximo localiza a janela de maior anomalia."
    - n: 8
      tema: "Heaps e heapsort"
      tipo: "aula"
      cormen: "Cormen, capítulo 6 (seções 6.1 a 6.4)"
      slides: "aula08.pdf"
      objetivos:
        - "Representar uma árvore binária quase completa em um vetor"
        - "Manter a propriedade de heap com Max-Heapify"
        - "Mostrar que Build-Max-Heap é \\(O(n)\\), não \\(O(n\\lg n)\\)"
        - "Medir comparações: \\(\\approx 2n\\) na construção, \\(\\approx 2n\\lg n\\) no heapsort"
      codigo:
        - arquivo: "aula08_heapsort.c"
          titulo: "Heapsort em C"
      experimento:
        arquivo: "aula08_experimento.c"
        pergunta: "Construir um heap faz O(n) comparações e o heapsort faz cerca de 2 n lg n?"
        conclusao: "A construção é linear (cerca de \\(1{,}9\\,n\\) comparações), confirmando que a análise ingênua \\(O(n\\lg n)\\) era pessimista.\nO heapsort completo fica perto de \\(1{,}8\\,n\\lg n\\): o dobro de comparações do merge sort, mas no lugar, sem memória extra."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "Temporizadores do kernel, filas de prioridade de processos e o temporizador do runtime de Go usam heaps para achar o próximo evento em \\(O(\\lg n)\\)."
        - area: "Simulação de redes"
          texto: "Simuladores de eventos discretos (ns-3, OMNeT++) mantêm uma fila de eventos ordenada por tempo: extrair o próximo é Extract-Min."
        - area: "Sistemas embarcados"
          texto: "Heapsort garante \\(O(n\\lg n)\\) sem memória extra nem recursão profunda; o std::sort do C++ (introsort) recorre a ele quando o quicksort degenera."
        - area: "Jogos e mapas"
          texto: "Dijkstra e A*, usados em GPS e na movimentação de personagens, dependem de uma fila de prioridade em heap (aulas 17 e 31)."
    - n: 9
      tema: "Projeto 1: laboratório de ordenação"
      tipo: "projeto"
      descricao: "Apresentação dos projetos do Bloco 1. Cada equipe implementa, instrumenta e compara algoritmos de ordenação, e confronta as medições com a teoria."
      entregas:
        - "Implementação em C de inserção, merge sort, heapsort e um híbrido (inserção abaixo de um limiar \\(k\\))"
        - "Experimento com \\(n\\) até \\(10^6\\) em quatro tipos de entrada: aleatória, ordenada, invertida e quase ordenada (1% fora do lugar)"
        - "Gráficos de comparações e de tempo com as curvas teóricas ajustadas e a razão medido/teórico"
        - "O melhor limiar \\(k\\) do híbrido na máquina da equipe, com justificativa"
        - "Apresentação de 10 minutos: hipótese, método, resultados, o que não bateu com a teoria e por quê"
- bloco: 2
  rotulo: "Bloco 2"
  opcional: false
  tag: ""
  titulo: "Dicionários e estruturas lineares"
  resumo: "Dicionários, pilhas, filas, vetores dinâmicos e listas: simplesmente e duplamente ligadas, circulares, com sentinela e em vetores; filas de prioridade. Termina com o Projeto 2."
  aulas:
    - n: 10
      tema: "Dicionários e conjuntos dinâmicos"
      tipo: "aula"
      cormen: "Cormen, introdução da parte III e seção 10.1"
      slides: "aula10.pdf"
      objetivos:
        - "Definir conjunto dinâmico e as operações de dicionário"
        - "Separar consultas (busca, mínimo, máximo, sucessor) de modificações (inserção, remoção)"
        - "Implementar um dicionário em vetor ordenado com busca binária"
        - "Medir o custo de inserir e de buscar em vetor ordenado e desordenado"
      codigo:
        - arquivo: "aula10_dicionario.c"
          titulo: "Dicionário em vetor ordenado"
      experimento:
        arquivo: "aula10_experimento.c"
        pergunta: "Quanto custam n inserções e n buscas num dicionário em vetor ordenado e em vetor desordenado?"
        conclusao: "As três previsões se confirmam: \\(n^2/4\\) deslocamentos e \\(n\\lg n\\) comparações no vetor ordenado, \\(n(n+1)/2\\) comparações no desordenado.\nVetores obrigam a escolher entre inserir rápido e buscar rápido. O resto do curso mostra estruturas que fazem as duas coisas em \\(O(1)\\) ou \\(O(\\lg n)\\)."
      conexoes:
        - area: "Bancos de dados"
          texto: "Uma tabela é um conjunto dinâmico de registros; índices são dicionários sobre uma coluna, e o otimizador escolhe entre varrer e buscar conforme o custo."
        - area: "Linguagens"
          texto: "dict e set do Python, Map do JavaScript, std::map e std::unordered_map do C++: o mesmo tipo abstrato com implementações diferentes."
        - area: "Compiladores"
          texto: "A tabela de símbolos é um dicionário de identificadores; escopos aninhados viram uma pilha de dicionários (aula 11)."
        - area: "Redes"
          texto: "Tabelas ARP, de rotas e de conexões são dicionários consultados milhões de vezes por segundo: a implementação define a latência."
    - n: 11
      tema: "Pilhas"
      tipo: "aula"
      cormen: "Cormen, seção 10.1"
      slides: "aula11.pdf"
      objetivos:
        - "Implementar pilhas em vetor (com transbordamento) e em lista ligada"
        - "Analisar Push e Pop em \\(O(1)\\)"
        - "Avaliar expressões pós-fixas com uma pilha"
        - "Medir o custo por operação das duas implementações"
      codigo:
        - arquivo: "aula11_pilha.c"
          titulo: "Pilhas e expressões pós-fixas em C"
      experimento:
        arquivo: "aula11_experimento.c"
        pergunta: "Quanto custa, em nanossegundos, cada operação de pilha em vetor e em lista ligada?"
        conclusao: "As duas implementações têm custo constante por operação, como prevê a análise, mas a lista ligada é cerca de 25 vezes mais cara: malloc, free e saltos pela memória.\nA notação \\(O\\) esconde constantes; quando a capacidade é previsível, o vetor (ou o vetor dinâmico da aula 13) é a melhor pilha."
      conexoes:
        - area: "Compiladores"
          texto: "Analisadores sintáticos casam parênteses e blocos com pilhas; a máquina virtual da JVM e a do Python são máquinas de pilha: iadd desempilha dois e empilha a soma."
        - area: "Navegadores e editores"
          texto: "Voltar e avançar, desfazer e refazer: duas pilhas. Calculadoras HP usavam notação pós-fixa por ser mais rápida de digitar e de avaliar."
        - area: "Sistemas operacionais"
          texto: "Cada thread tem sua pilha de chamadas; o estouro dela (stack overflow) é o transbordamento desta aula, em hardware."
        - area: "Inteligência artificial"
          texto: "Busca em profundidade com backtracking (labirintos, sudoku, provadores de teoremas) guarda as alternativas pendentes numa pilha (aula 29)."
    - n: 12
      tema: "Filas"
      tipo: "aula"
      cormen: "Cormen, seção 10.1"
      slides: "aula12.pdf"
      objetivos:
        - "Implementar filas em vetor circular e em lista ligada"
        - "Distinguir fila cheia de fila vazia"
        - "Conhecer deques (filas de duas pontas)"
        - "Simular uma fila de atendimento e conferir com a teoria das filas"
      codigo:
        - arquivo: "aula12_fila.c"
          titulo: "Filas em C"
      experimento:
        arquivo: "aula12_experimento.c"
        pergunta: "Na simulação de uma fila M/M/1, o tempo médio de espera segue ρ/(1−ρ)?"
        conclusao: "A simulação reproduz \\(\\rho/(1-\\rho)\\) com erro de poucos por cento. A fila FIFO, uma estrutura simples, é o coração de toda simulação de atendimento.\nA lição prática: um sistema com 85% de ocupação já tem esperas longas; perto de 100%, elas explodem."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "Processos prontos esperam numa fila; o escalonamento round robin é uma fila circular. Buffers de teclado, disco e impressão são filas."
        - area: "Redes"
          texto: "Roteadores guardam pacotes em filas de saída; a teoria das filas desta aula explica o atraso e a perda quando o enlace fica congestionado."
        - area: "Computação em nuvem"
          texto: "Filas de mensagens (RabbitMQ, Kafka, SQS) desacoplam serviços: quem produz enfileira, quem consome desenfileira no seu ritmo."
        - area: "Algoritmos de grafos"
          texto: "A busca em largura (aula 28) explora um grafo camada por camada usando exatamente uma fila FIFO."
    - n: 13
      tema: "Vetores dinâmicos e análise amortizada"
      tipo: "aula"
      cormen: "Cormen, seções 17.1 e 17.4"
      slides: "aula13.pdf"
      objetivos:
        - "Fazer um vetor crescer e encolher conforme o uso"
        - "Calcular o custo amortizado pelo método agregado"
        - "Entender por que encolher só com \\(1/4\\) de ocupação"
        - "Medir \\(2n\\) cópias contra \\(n^2/2000\\) para duas estratégias de crescimento"
      codigo:
        - arquivo: "aula13_vetor_dinamico.c"
          titulo: "Vetor dinâmico em C"
      experimento:
        arquivo: "aula13_experimento.c"
        pergunta: "Quantas cópias custam n inserções num vetor que dobra e num que cresce 1000 posições por vez?"
        conclusao: "Dobrar custa \\(\\approx 2n\\) cópias: \\textbf{amortizado \\(O(1)\\)} por inserção. Somar uma constante custa \\(\\approx n^2/2000\\): quadrático, por maior que seja a constante.\nPor isso std::vector, ArrayList e as listas do Python crescem por um fator (1,5 ou 2), nunca por uma quantidade fixa."
      conexoes:
        - area: "Linguagens"
          texto: "A lista do Python cresce cerca de 12%, o vector do C++ (GCC) dobra e o ArrayList do Java cresce 50%: fatores diferentes, todos amortizados \\(O(1)\\)."
        - area: "Bancos de dados"
          texto: "Tabelas hash de bancos e caches (Redis) dobram de tamanho e reinserem tudo, às vezes aos poucos (rehash incremental) para não travar o serviço."
        - area: "Redes"
          texto: "O TCP aumenta a janela de envio por fator e a reduz pela metade em congestionamento: crescimento multiplicativo, como o vetor dinâmico."
        - area: "Sistemas embarcados"
          texto: "Em tempo real, um pico de \\(\\Theta(n)\\) numa cópia pode estourar um prazo: lá se prefere capacidade fixa ou crescimento sem cópia (listas de blocos)."
    - n: 14
      tema: "Listas simplesmente ligadas"
      tipo: "aula"
      cormen: "Cormen, seção 10.2"
      slides: "aula14.pdf"
      objetivos:
        - "Representar uma sequência com nós e ponteiros"
        - "Inserir no início e no fim, buscar e remover"
        - "Inverter uma lista sem memória extra"
        - "Medir a vantagem da lista na inserção e o custo do cache no percurso"
      codigo:
        - arquivo: "aula14_lista_simples.c"
          titulo: "Lista simplesmente ligada em C"
      experimento:
        arquivo: "aula14_experimento.c"
        pergunta: "Quanto custa inserir no início de um vetor? E percorrer uma lista ligada cujos nós estão espalhados pela memória?"
        conclusao: "Inserir no início confirma a teoria: \\(n(n-1)/2\\) movimentos no vetor, nenhum na lista.\nNo percurso, os dois são \\(\\Theta(n)\\), mas a lista espalhada fica até 200 vezes mais lenta que o vetor quando sai do cache. O modelo RAM não vê a hierarquia de memória; a medição vê."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "Filas de processos, listas de arquivos abertos e de páginas livres são listas ligadas dentro do kernel; a inserção \\(O(1)\\) é essencial."
        - area: "Alocação de memória"
          texto: "malloc encadeia os blocos livres numa lista; programas em C que vazam memória costumam “perder a cabeça de uma lista."
        - area: "Arquitetura de computadores"
          texto: "O experimento mostra a hierarquia de memória: L1 (\\(\\approx\\)1 ns), L2, L3 e RAM (\\(\\approx\\)100 ns). Estruturas cache-friendly vencem na prática."
        - area: "Linguagens funcionais"
          texto: "Em Lisp, Haskell e Erlang a lista ligada é a estrutura básica: inserir na cabeça cria uma lista nova compartilhando o resto, sem copiar nada."
    - n: 15
      tema: "Listas duplamente ligadas e listas circulares"
      tipo: "aula"
      cormen: "Cormen, seção 10.2"
      slides: "aula15.pdf"
      objetivos:
        - "Implementar a lista duplamente ligada e seus casos especiais sem sentinela"
        - "Remover um nó dado em \\(O(1)\\)"
        - "Fechar a lista num círculo e percorrê-la sem fim"
        - "Resolver o problema de Josefo e comparar lista circular com vetor"
      codigo:
        - arquivo: "aula15_dupla_circular.c"
          titulo: "Lista dupla e circular em C"
      experimento:
        arquivo: "aula15_experimento.c"
        pergunta: "Quantos passos a lista circular e quantos deslocamentos o vetor gastam para resolver o problema de Josefo?"
        conclusao: "A lista circular resolve Josefo em exatamente \\((n-1)(k-1)\\) passos; o vetor, em \\(\\approx 0{,}3\\,n^2\\) deslocamentos: 4.800 vezes mais trabalho para \\(n = 32.000\\).\nQuando a operação dominante é remover no meio, a lista ligada vence; quando é acessar por posição, o vetor vence."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "O kernel Linux usa listas duplas circulares (list_head) em toda parte; o escalonador round robin percorre uma lista circular de processos."
        - area: "Navegadores"
          texto: "O histórico com voltar e avançar e as abas em ordem são listas duplas: sair de uma aba no meio é remover um nó em \\(O(1)\\)."
        - area: "Caches LRU"
          texto: "Um cache LRU combina uma tabela hash com uma lista dupla: o item usado vai para a frente, o mais antigo sai do fim, tudo em \\(O(1)\\)."
        - area: "Jogos"
          texto: "Turnos de jogadores, animações em laço e trilhas de áudio em repetição são percorridos como listas circulares."
    - n: 16
      tema: "Sentinelas e listas sem ponteiros"
      tipo: "aula"
      cormen: "Cormen, seções 10.2 e 10.3"
      slides: "aula16.pdf"
      objetivos:
        - "Usar uma sentinela para eliminar os casos especiais das listas"
        - "Implementar a lista circular duplamente ligada com sentinela do livro"
        - "Representar listas com vetores e gerenciar posições livres"
        - "Medir quantos testes a sentinela economiza numa busca"
      codigo:
        - arquivo: "aula16_lista_sentinela.c"
          titulo: "Lista com sentinela em C"
        - arquivo: "aula16_lista_vetor.c"
          titulo: "Lista em vetores com lista livre"
      experimento:
        arquivo: "aula16_experimento.c"
        pergunta: "Quantos testes uma busca sem sucesso faz com e sem sentinela? E quanto tempo?"
        conclusao: "A sentinela corta os testes exatamente pela metade (\\(n + 1\\) contra \\(2n + 1\\)) e economiza cerca de 10% do tempo. Mais importante: elimina os casos especiais de lista vazia, cabeça e cauda, que são a fonte da maioria dos erros com listas.\nNa representação em vetores, a lista livre faz o papel do malloc: alocar e liberar em \\(O(1)\\)."
      conexoes:
        - area: "Kernel Linux"
          texto: "Toda lista do kernel (list_head) é circular, dupla e com sentinela: a “cabeça é um nó sem dados, exatamente \\(L.\\mathit{nil}\\)."
        - area: "Alocadores de memória"
          texto: "malloc mantém listas livres de blocos por tamanho; alocadores de pool (jogos, servidores) usam a pilha livre da Figura 10.7."
        - area: "Sistemas de arquivos"
          texto: "O FAT do MS-DOS e de pendrives é uma lista em vetor: cada posição diz o próximo bloco do arquivo; os blocos livres formam outra lista."
        - area: "Bancos de dados"
          texto: "Páginas livres de um arquivo de banco são encadeadas numa lista livre guardada no próprio arquivo, com índices no lugar de ponteiros."
    - n: 17
      tema: "Filas de prioridade"
      tipo: "aula"
      cormen: "Cormen, seção 6.5"
      slides: "aula17.pdf"
      objetivos:
        - "Definir as operações de uma fila de prioridade"
        - "Implementar inserção, extração do máximo e aumento de chave num heap"
        - "Comparar heap, vetor ordenado e vetor desordenado como filas de prioridade"
        - "Medir \\(\\Theta(n\\lg n)\\) contra \\(\\Theta(n^2)\\) em \\(n\\) inserções e \\(n\\) extrações"
      codigo:
        - arquivo: "aula17_fila_prioridade.c"
          titulo: "Fila de prioridade em C"
      experimento:
        arquivo: "aula17_experimento.c"
        pergunta: "Para n inserções seguidas de n extrações, quantas comparações fazem heap, vetor ordenado e vetor desordenado?"
        conclusao: "O vetor desordenado faz exatamente \\(n(n-1)/2\\) comparações e o ordenado, \\(n^2/4\\); o heap fica em \\(\\approx 1{,}8\\,n\\lg n\\).\nPara \\(n = 16.000\\), o heap é 150 vezes mais barato que o vetor ordenado. A estrutura certa muda a ordem de crescimento."
      conexoes:
        - area: "Sistemas operacionais"
          texto: "Escalonadores escolhem o próximo processo pela prioridade; temporizadores do kernel disparam o evento mais próximo: Extract-Min num heap."
        - area: "Redes de computadores"
          texto: "Roteadores com QoS servem primeiro os pacotes de voz e vídeo; o roteamento OSPF roda Dijkstra com fila de prioridade em cada roteador."
        - area: "Simulação de eventos"
          texto: "Simuladores (filas de banco, tráfego, epidemias) processam eventos em ordem de tempo: o próximo evento sai de uma fila de mínimo."
        - area: "Compressão de dados"
          texto: "O código de Huffman (aula 34) junta repetidamente os dois símbolos menos frequentes, retirados de uma fila de prioridade."
    - n: 18
      tema: "Projeto 2: simulador de escalonamento de processos"
      tipo: "projeto"
      descricao: "Apresentação dos projetos do Bloco 2. Cada equipe constrói um simulador de escalonamento de CPU com as estruturas do bloco e compara políticas com experimentos."
      entregas:
        - "Simulador em C: processos chegam com tempo de execução e prioridade; fila circular (FIFO e round robin), lista duplamente ligada com sentinela (processos bloqueados), pilha (chamadas de cada processo) e fila de prioridade em heap (menor trabalho primeiro)"
        - "Três políticas: FIFO, menor trabalho primeiro (heap) e round robin (fila circular)"
        - "Experimento: tempo médio de espera e vazão para 1.000 a 1.000.000 de processos, com o custo das operações confrontado com a teoria"
        - "Relatório: qual política vence em cada carga e quanto custa cada estrutura (gráficos com curvas teóricas)"
        - "Apresentação de 10 minutos com demonstração ao vivo"
- bloco: 3
  rotulo: "Bloco 3"
  opcional: false
  tag: ""
  titulo: "Tabelas hash e árvores"
  resumo: "Tabelas hash (encadeamento, funções hash, endereçamento aberto), árvores binárias de busca, AVL, rubro-negras e árvores B. Termina com o Projeto 3."
  aulas:
    - n: 19
      tema: "Tabelas hash com encadeamento"
      tipo: "aula"
      cormen: "Cormen, seções 11.1 e 11.2"
      slides: "aula19.pdf"
      objetivos:
        - "Explicar endereçamento direto e por que ele não escala"
        - "Resolver colisões por encadeamento"
        - "Analisar a busca em função do fator de carga \\(\\alpha = n/m\\)"
        - "Medir \\(\\alpha\\) e \\(1 + \\alpha/2\\) elementos examinados por busca"
      codigo:
        - arquivo: "aula19_hash_encadeamento.c"
          titulo: "Frequência de palavras com hash"
      experimento:
        arquivo: "aula19_experimento.c"
        pergunta: "Quantos elementos uma busca examina, com e sem sucesso, em função do fator de carga α?"
        conclusao: "Os teoremas 11.1 e 11.2 se confirmam com desvio menor que 1%: \\(\\alpha\\) elementos sem sucesso, \\(1 + \\alpha/2\\) com sucesso.\nO custo depende de \\(\\alpha\\), \\textbf{não de \\(n\\)}: com \\(\\alpha\\) fixo, uma tabela com um bilhão de chaves busca tão rápido quanto uma com mil."
      conexoes:
        - area: "Bancos de dados"
          texto: "Índices hash respondem WHERE id = ? em \\(O(1)\\); o hash join monta uma tabela hash com a menor relação e varre a maior."
        - area: "Compiladores e linguagens"
          texto: "A tabela de símbolos guarda identificadores numa tabela hash; dicionários do Python, objetos do JavaScript e HashMap do Java também."
        - area: "Cache distribuído"
          texto: "Memcached e Redis distribuem chaves entre servidores com hash; o hashing consistente minimiza as chaves movidas quando um servidor entra ou sai."
        - area: "Redes"
          texto: "Switches mantêm a tabela de endereços MAC em hash; roteadores e firewalls classificam fluxos (5-tupla) por hash para decidir em nanossegundos."
    - n: 20
      tema: "Funções hash e hashing universal"
      tipo: "aula"
      cormen: "Cormen, seção 11.3"
      slides: "aula20.pdf"
      objetivos:
        - "Construir funções hash pelos métodos da divisão e da multiplicação"
        - "Reconhecer escolhas ruins de \\(m\\) (potências de 2 com chaves estruturadas)"
        - "Definir hashing universal e o que ele garante"
        - "Medir o efeito da função hash em chaves com padrão"
      codigo:
        - arquivo: "aula20_funcoes_hash.c"
          titulo: "Comparando funções hash"
      experimento:
        arquivo: "aula20_experimento.c"
        pergunta: "Com chaves múltiplas de 64 e fator de carga 1, quanto custa uma busca com cada função hash?"
        conclusao: "A escolha da função muda o custo em mais de 30 vezes com as mesmas chaves: dividir por potência de 2 dá exatamente 32,5; dividir por um primo dá 1.\nO hashing universal fica em 1,5 em média, como garante o teorema, sem depender das chaves. Uma função isolada sorteada, porém, pode ter azar: a garantia é sobre a média da família."
      conexoes:
        - area: "Segurança"
          texto: "Em 2011, ataques de hash flooding derrubaram servidores web enviando parâmetros que colidiam; Python, Ruby e Java passaram a sortear a função (SipHash)."
