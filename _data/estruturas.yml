        - "Medir \\(2^n\\) chamadas contra \\(n(n+1)/2\\)"
      codigo:
        - arquivo: "aula33_programacao_dinamica.c"
          titulo: "Corte de hastes e LCS em C"
      experimento:
        arquivo: "aula33_experimento.c"
        pergunta: "Quantas chamadas faz o corte de hastes recursivo ingênuo e quantas faz a versão memoizada?"
        conclusao: "As contagens são exatamente \\(2^n\\) e \\(n(n+1)/2 + 1\\). Guardar as respostas dos subproblemas transforma um algoritmo exponencial em quadrático, com o mesmo resultado.\nA programação dinâmica troca memória por tempo: uma tabela de \\(n + 1\\) posições economiza bilhões de chamadas."
      conexoes:
        - area: "Bioinformática"
          texto: "Alinhar sequências de DNA e proteínas (Needleman–Wunsch, Smith–Waterman) é uma LCS com pesos: a base do BLAST e da comparação de genomas."
        - area: "Controle de versão"
          texto: "diff e git diff calculam a menor sequência de edições entre dois arquivos, uma variação da LCS."
        - area: "Linguagem natural"
          texto: "Corretores ortográficos (distância de edição), reconhecimento de voz (Viterbi) e análise sintática (CYK) são programação dinâmica."
        - area: "Finanças e IA"
          texto: "Precificação de opções em árvores binomiais e aprendizado por reforço (equação de Bellman) resolvem subproblemas de baixo para cima."
    - n: 34
      tema: "Algoritmos gulosos: seleção de atividades e Huffman"
      tipo: "aula"
      cormen: "Cormen, seções 16.1 a 16.3"
      slides: "aula34.pdf"
      objetivos:
        - "Reconhecer a propriedade da escolha gulosa e a subestrutura ótima"
        - "Resolver a seleção de atividades escolhendo sempre a que termina primeiro"
        - "Construir códigos de Huffman com fila de prioridade"
        - "Medir o comprimento médio de Huffman contra a entropia de Shannon"
      codigo:
        - arquivo: "aula34_huffman.c"
          titulo: "Códigos de Huffman em C"
      experimento:
        arquivo: "aula34_experimento.c"
        pergunta: "O comprimento médio do código de Huffman fica entre a entropia H e H + 1? Quanto ele ganha do código fixo?"
        conclusao: "Em todos os alfabetos, \\(H \\le L < H + 1\\), e na prática \\(L - H < 0{,}1\\) bit: Huffman fica praticamente no limite teórico da compressão sem perdas símbolo a símbolo.\nUm algoritmo guloso de cinco linhas atinge o ótimo, e a teoria da informação diz que ninguém pode fazer melhor."
      conexoes:
        - area: "Compressão"
          texto: "DEFLATE (ZIP, gzip, PNG), JPEG e MP3 usam códigos de Huffman na etapa final; formatos modernos usam codificação aritmética, que chega ainda mais perto de \\(H\\)."
        - area: "Redes"
          texto: "O HTTP/2 comprime cabeçalhos com HPACK, que usa uma tabela de Huffman fixa: cada requisição web economiza bytes."
        - area: "Agendamento"
          texto: "Escalonar tarefas por prazo (earliest deadline first) e alocar salas, frequências de rádio ou pistas de pouso são problemas gulosos parentes da seleção de atividades."
        - area: "Aprendizado de máquina"
          texto: "Árvores de decisão escolhem gulosamente o atributo de maior ganho de informação (entropia!); o hierarchical softmax usa árvores de Huffman."
    - n: 35
      tema: "Casamento de cadeias: o algoritmo de Knuth-Morris-Pratt"
      tipo: "aula"
      cormen: "Cormen, seções 32.1 e 32.4"
      slides: "aula35.pdf"
      objetivos:
        - "Definir o problema de casamento de cadeias e o algoritmo ingênuo"
        - "Calcular a função de prefixo \\(\\pi\\) de um padrão"
        - "Executar o KMP e mostrar que ele é \\(\\Theta(n + m)\\)"
        - "Medir o pior caso do ingênuo contra o KMP"
      codigo:
        - arquivo: "aula35_kmp.c"
          titulo: "Knuth-Morris-Pratt em C"
      experimento:
        arquivo: "aula35_experimento.c"
        pergunta: "Com texto aⁿ e padrão a⁹⁹b, quantas comparações fazem o algoritmo ingênuo e o KMP?"
        conclusao: "O ingênuo faz exatamente \\((n - m + 1)m\\) comparações no pior caso; o KMP fica abaixo de \\(3n\\), \\textbf{independente de \\(m\\)}.\nA função de prefixo é uma pequena tabela que evita reler o texto: mais uma vez, pré-processar troca memória por tempo."
      conexoes:
        - area: "Busca em texto"
          texto: "grep, o “localizar dos editores e navegadores e as bibliotecas de strings usam KMP, Boyer-Moore ou variações para buscar em gigabytes."
        - area: "Segurança"
          texto: "Antivírus e sistemas de detecção de intrusão (Snort, Suricata) procuram milhares de assinaturas ao mesmo tempo com Aho-Corasick, a generalização do KMP."
        - area: "Bioinformática"
          texto: "Localizar motivos em DNA, sítios de restrição e sequências repetidas: casamento de cadeias sobre o alfabeto \\(\\{A, C, G, T\\}\\)."
        - area: "Compiladores"
          texto: "Analisadores léxicos reconhecem palavras-chave e tokens com autômatos finitos, o mesmo modelo da seção 32.3."
    - n: 36
      tema: "Projeto 4: rotas e redes numa cidade real"
      tipo: "projeto"
      descricao: "Apresentação dos projetos finais. Cada equipe monta o grafo de ruas de um bairro de Salvador (OpenStreetMap) e resolve problemas reais com os algoritmos do bloco, comparando teoria e medições."
      entregas:
        - "Grafo de ruas extraído do OpenStreetMap (vértices = cruzamentos, arestas = trechos com comprimento), com pelo menos 10 mil vértices"
        - "Menor caminho entre dois endereços com BFS (número de quarteirões), Dijkstra com vetor e com heap, e Bellman-Ford; tempos medidos e confrontados com a teoria"
        - "Rede de menor custo ligando pontos de interesse (escolas, postos de saúde) com Kruskal ou Prim"
        - "Uma técnica de projeto aplicada: programação dinâmica (por exemplo, rota que visita pontos em ordem) ou gulosa (por exemplo, cobertura de pontos)"
        - "Apresentação de 10 minutos com mapa e demonstração ao vivo"
- bloco: 5
  rotulo: "Bloco complementar"
  opcional: true
  tag: "Opcional"
  titulo: "Ordenação avançada (opcional)"
  resumo: "Cinco módulos opcionais, fora das 36 aulas, para quem quer ir além do bloco 1: quicksort, quicksort aleatorizado, limite inferior, ordenação em tempo linear e seleção."
  aulas:
    - n: "C1"
      tema: "Quicksort"
      tipo: "aula"
      cormen: "Cormen, seções 7.1 e 7.2"
      slides: "compl1.pdf"
      objetivos:
        - "Executar Partition e provar sua corretude pelo invariante das quatro regiões"
        - "Analisar o pior caso (\\(\\Theta(n^2)\\)) e o melhor caso (\\(\\Theta(n\\lg n)\\))"
        - "Entender por que partições desbalanceadas em proporção constante ainda dão \\(n\\lg n\\)"
        - "Medir \\(\\approx 2n\\ln n\\) comparações em entradas aleatórias e \\(n^2/2\\) em entradas ordenadas"
      codigo:
        - arquivo: "compl1_quicksort.c"
          titulo: "Quicksort em C"
      experimento:
        arquivo: "compl1_experimento.c"
        pergunta: "Quantas comparações o quicksort faz em vetores aleatórios e em vetores já ordenados?"
        conclusao: "A previsão de caso médio, \\(2(n+1)H_n - 4n \\approx 1{,}39\\,n\\lg n\\), se confirma com desvio de cerca de 1%.\nE o pior caso é exatamente \\(n(n-1)/2\\), justamente na entrada mais “fácil”, o vetor ordenado. A próxima aula elimina esse risco com aleatoriedade."
      conexoes:
        - area: "Bibliotecas padrão"
          texto: "qsort (C), std::sort (introsort em C++), Arrays.sort para primitivos (quicksort de dois pivôs no Java) e sort do Go (pdqsort)."
        - area: "Bancos de dados"
          texto: "Ordenar resultados em memória (ORDER BY) e preparar joins usa quicksort ou variações; a partição também aparece na seleção do \\(k\\)-ésimo (LIMIT)."
        - area: "Segurança"
          texto: "Um adversário que conhece o pivô pode montar entradas \\(\\Theta(n^2)\\) (“McIlroy killer): por isso as bibliotecas aleatorizam ou usam introsort."
        - area: "Computação paralela"
          texto: "Depois de particionar, as duas partes são independentes; GPUs ordenam com variações paralelas da partição."
    - n: "C2"
      tema: "Quicksort aleatorizado e a análise do caso médio"
      tipo: "aula"
      cormen: "Cormen, seções 7.3 e 7.4"
      slides: "compl2.pdf"
      objetivos:
        - "Aleatorizar a escolha do pivô e entender o que isso garante"
        - "Calcular o número esperado de comparações com variáveis indicadoras"
        - "Distinguir caso médio (sobre entradas) de tempo esperado (sobre sorteios)"
        - "Medir a concentração das comparações em torno da esperança"
      codigo:
        - arquivo: "compl2_quicksort_aleatorio.c"
          titulo: "Quicksort aleatorizado em C"
      experimento:
        arquivo: "compl2_experimento.c"
        pergunta: "Com entrada já ordenada, o pivô sorteado faz o quicksort voltar a 2(n+1)H_n − 4n comparações?"
        conclusao: "Na entrada que destrói o pivô fixo (\\(n(n-1)/2\\) comparações), o pivô sorteado volta à esperança \\(2(n+1)H_n - 4n\\).\nO histograma mostra execuções concentradas: a probabilidade de algo perto do pior caso é desprezível. Aleatoriedade troca uma entrada ruim por uma sorte ruim, e sorte ruim é rara."
      conexoes:
        - area: "Segurança"
          texto: "Tabelas hash de linguagens (Python, Rust) sorteiam a semente da função hash a cada execução pelo mesmo motivo: impedir que um atacante escolha a entrada do pior caso."
        - area: "Redes"
          texto: "O Ethernet usa recuo exponencial aleatório após colisões; balanceadores de carga usam “a melhor de duas escolhas aleatórias para distribuir requisições."
        - area: "Aprendizado de máquina"
          texto: "Gradiente estocástico, random forests e dropout: a aleatoriedade torna algoritmos mais rápidos e mais robustos, com garantias em esperança."
        - area: "Sistemas distribuídos"
          texto: "Protocolos de fofoca (gossip) e eleição de líder no Raft usam tempos aleatórios para evitar empates e espalhar informação em \\(O(\\lg n)\\) rodadas."
    - n: "C3"
      tema: "O limite inferior da ordenação por comparação"
      tipo: "aula"
      cormen: "Cormen, seção 8.1"
      slides: "compl3.pdf"
      objetivos:
        - "Modelar algoritmos de ordenação por comparação como árvores de decisão"
        - "Provar que todo algoritmo desse tipo faz \\(\\Omega(n\\lg n)\\) comparações no pior caso"
        - "Usar a aproximação de Stirling para \\(\\lg(n!)\\)"
        - "Medir quão perto do limite o merge sort chega"
      codigo:
        - arquivo: "compl3_arvore_decisao.c"
          titulo: "A altura da árvore do merge sort"
      experimento:
        arquivo: "compl3_experimento.c"
        pergunta: "O pior caso do merge sort fica acima de ⌈lg n!⌉? Quão perto do limite ele chega em média?"
        conclusao: "Em todos os \\(n\\) testados, o pior caso do merge sort ficou acima de \\(\\lceil\\lg n!\\rceil\\), como o teorema exige, e para \\(n \\le 4\\) ele atinge o limite.\nPara \\(n = 2^{20}\\), o merge sort faz só 1% mais comparações que \\(\\lg n!\\). Não há como fazer muito melhor comparando; para ir além, é preciso usar a estrutura das chaves."
      conexoes:
        - area: "Teoria da informação"
          texto: "O argumento é de Shannon: uma comparação gera no máximo 1 bit. O mesmo raciocínio dá limites para busca (\\(\\lg n\\)) e para jogos como “vinte perguntas."
        - area: "Compressão"
          texto: "Nenhum compressor sem perdas reduz todos os arquivos: há \\(2^n\\) arquivos de \\(n\\) bits e menos códigos menores. É o argumento de contagem das folhas."
        - area: "Criptografia"
          texto: "Uma chave de 128 bits tem \\(2^{128}\\) possibilidades: um ataque de força bruta precisa de \\(\\Omega(2^{127})\\) tentativas em média. Limites inferiores são a base da segurança."
        - area: "Computação quântica"
          texto: "O algoritmo de Grover busca em \\(O(\\sqrt n)\\), e há prova de que nenhum algoritmo quântico faz melhor: limites inferiores também valem no modelo quântico."
    - n: "C4"
      tema: "Ordenação em tempo linear: contagem e radix"
      tipo: "aula"
      cormen: "Cormen, seções 8.2 e 8.3"
      slides: "compl4.pdf"
      objetivos:
        - "Ordenar inteiros em \\(0..k\\) por contagem em \\(\\Theta(n + k)\\)"
        - "Explicar por que a estabilidade é essencial para o radix sort"
        - "Ordenar \\(d\\) dígitos em \\(\\Theta(d(n + k))\\) e escolher a base"
        - "Medir tempo por elemento: constante no radix, \\(\\lg n\\) no qsort"
      codigo:
        - arquivo: "compl4_contagem_radix.c"
          titulo: "Contagem e radix sort em C"
      experimento:
        arquivo: "compl4_experimento.c"
        pergunta: "O tempo por elemento do radix sort fica constante enquanto o do qsort cresce como lg n?"
        conclusao: "O tempo por elemento do radix sort é praticamente constante (linear no total) e mais de 10 vezes menor que o do qsort, cujo custo por elemento cresce como \\(\\lg n\\).\nO limite \\(\\Omega(n\\lg n)\\) não se aplica porque o radix sort não compara chaves: usa os bits delas."
      conexoes:
        - area: "GPUs"
          texto: "Radix sort é o padrão para ordenar em GPU (CUB, Thrust): as contagens e somas de prefixo paralelizam muito bem."
        - area: "Bancos de dados"
          texto: "Ordenar por chaves inteiras (datas, códigos) com radix e agrupar por contagem (GROUP BY) aparecem em bancos colunares como DuckDB."
        - area: "Bioinformática"
          texto: "Arranjos de sufixos de genomas são construídos com radix sort sobre o alfabeto \\(\\{A, C, G, T\\}\\): base 4, chaves curtas."
        - area: "Processamento de imagens"
          texto: "O histograma de uma imagem é a primeira etapa da contagem; a equalização de histograma usa exatamente as somas acumuladas de \\(C\\)."
    - n: "C5"
      tema: "Bucket sort e seleção em tempo linear"
      tipo: "aula"
      cormen: "Cormen, seção 8.4 e capítulo 9"
      slides: "compl5.pdf"
      objetivos:
        - "Ordenar dados uniformes em \\([0, 1)\\) em tempo esperado linear com baldes"
        - "Achar o \\(i\\)-ésimo menor sem ordenar, em tempo esperado \\(\\Theta(n)\\)"
        - "Conhecer a seleção determinística linear (mediana das medianas)"
        - "Medir \\(\\approx 3{,}39\\,n\\) comparações para a mediana"
      codigo:
        - arquivo: "compl5_selecao.c"
          titulo: "Seleção aleatorizada em C"
      experimento:
        arquivo: "compl5_experimento.c"
        pergunta: "A seleção da mediana faz cerca de 3,39 n comparações? E o bucket sort depende da distribuição?"
        conclusao: "A seleção da mediana fica em \\(\\approx 3{,}39\\,n\\) comparações em média: linear, sem ordenar.\nO bucket sort é linear se a hipótese de uniformidade vale; com todos os dados num balde, volta a ser quadrático.\nAlgoritmos de caso médio dependem da distribuição da entrada; aleatorizados, só da sorte."
      conexoes:
        - area: "Estatística e dados"
          texto: "Mediana, quartis e percentis (p50, p99) são seleções. Ferramentas de monitoramento calculam percentis de latência sem ordenar milhões de amostras."
        - area: "Bancos de dados"
          texto: "ORDER BY ... LIMIT k e PERCENTILE_CONT usam seleção; histogramas em baldes guiam o otimizador de consultas."
        - area: "Aprendizado de máquina"
          texto: "Árvores de decisão (k-d trees) dividem pela mediana de cada coordenada; a mediana é um estimador robusto contra valores extremos."
        - area: "Tabelas hash"
          texto: "O bucket sort é uma tabela hash ordenada: a análise dos baldes (\\(E[n_i^2]\\)) é a mesma do encadeamento da aula 19."
