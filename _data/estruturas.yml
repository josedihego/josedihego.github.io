        conclusao: "As duas formas de crescimento se confirmam: \\(V^3\\) para Floyd-Warshall e \\(V^2\\lg V\\) para \\(V\\) execuções de Dijkstra, com as mesmas respostas.\nEm grafos esparsos, Dijkstra repetido vence; em grafos densos ou pequenos, a simplicidade do Floyd-Warshall compensa, e ele aceita pesos negativos."
