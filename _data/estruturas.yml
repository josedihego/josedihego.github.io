      slides: "aula29.pdf"
      objetivos:
        - "Executar a DFS e registrar tempos de descoberta e de término"
        - "Classificar arestas (árvore, retorno, avanço, cruzamento)"
        - "Ordenar topologicamente um grafo acíclico pela ordem de término"
        - "Medir \\(V + E\\) operações e o efeito do cache no tempo"
      codigo:
        - arquivo: "aula29_dfs_topologica.c"
          titulo: "DFS e ordenação topológica em C"
      experimento:
        arquivo: "aula29_experimento.c"
        pergunta: "A DFS faz exatamente V + E operações num DAG? O tempo também cresce linearmente?"
        conclusao: "A contagem é exatamente \\(V + E\\) e a ordem topológica é sempre válida. O tempo, porém, só é linear enquanto o grafo cabe no cache: depois, cada acesso aleatório custa uma ida à RAM.\nBibliotecas de grafos de alto desempenho renumeram os vértices para que vizinhos fiquem próximos na memória."
      conexoes:
        - area: "Compiladores e builds"
          texto: "make, Maven, Bazel e gerenciadores de pacotes (npm, apt) ordenam topologicamente as dependências; um ciclo é um erro de configuração."
        - area: "Planilhas"
          texto: "Ao mudar uma célula, a planilha recalcula as dependentes em ordem topológica e detecta referências circulares com a DFS."
        - area: "Sistemas operacionais"
          texto: "Detectar deadlock é achar um ciclo no grafo de espera entre processos e recursos: uma aresta de retorno na DFS."
        - area: "Gestão de projetos e dados"
          texto: "Diagramas PERT/CPM, pipelines de dados (Airflow) e redes neurais (o grafo de computação do PyTorch) são DAGs executados em ordem topológica."
