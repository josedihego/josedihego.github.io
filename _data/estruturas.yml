        - arquivo: "aula30_kruskal.c"
          titulo: "Kruskal com conjuntos disjuntos"
      experimento:
        arquivo: "aula30_experimento.c"
        pergunta: "Quantos ponteiros uma operação de conjuntos disjuntos segue, sem e com as heurísticas?"
        conclusao: "Sem heurísticas, cada operação custa \\(\\approx 2n/15\\): com 16 mil elementos, mais de 2 mil passos. Com união por posto e compressão de caminho, o custo cai para 0,6 e não muda até dois milhões de elementos.\nÉ o que torna o Kruskal \\(O(E\\lg V)\\): o gargalo passa a ser só a ordenação das arestas."
      conexoes:
        - area: "Redes de infraestrutura"
          texto: "Projetar redes elétricas, de fibra óptica ou de saneamento ligando todos os pontos com o menor custo de cabo é uma AGM (Borůvka, 1926, eletrificação da Morávia)."
        - area: "Agrupamento de dados"
          texto: "Remover as \\(k - 1\\) arestas mais pesadas da AGM separa os dados em \\(k\\) grupos: o agrupamento por ligação simples (single linkage)."
        - area: "Visão computacional"
          texto: "A segmentação de imagens de Felzenszwalb e Huttenlocher une pixels parecidos com conjuntos disjuntos, no estilo do Kruskal."
        - area: "Compiladores e redes"
          texto: "Conjuntos disjuntos resolvem unificação de tipos (inferência de tipos) e acompanham componentes conexas de redes que mudam em tempo real."
