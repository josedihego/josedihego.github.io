# Plano de aulas de Informática (Edificações, Química, Mecânica), rendered by /infobasica/
# 36 encontros de 2 h, em 3 unidades de 12; cada unidade termina com avaliação e reavaliação.
# Tudo roda no navegador. Python: _tools/infobasica/python -> assets/infobasica/python (Colab);
# Scratch: _tools/infobasica/gerar_scratch.py -> assets/infobasica/scratch. Ver _tools/infobasica/README.md.
- unidade: 1
  titulo: "Algoritmos, variáveis e decisões. Interação com Documentos"
  resumo: "Do algoritmo no papel ao primeiro programa em Python: sequência, variáveis, entrada de dados, cálculos e decisões, com cada etapa registrada no Google Documentos."
  aulas:
    - n: 1
      tema: "Apresentação da disciplina e o que é um algoritmo"
      ferramentas: [Documentos, Blockly Games]
      objetivo: "Entender o que é um algoritmo, reconhecer algoritmos no cotidiano e no curso técnico, e conhecer as ferramentas e a forma de avaliação."
      material:
        - "Apresentação da disciplina, das ferramentas e dos critérios de avaliação."
        - "Algoritmos do cotidiano: receita, troca de pneu, traço de concreto, preparo de uma solução, montagem de uma peça."
        - "Google Documentos: criação do **Diário de Bordo** da turma (um documento por estudante, compartilhado com o professor)."
        - "[Blockly Games – Labirinto](https://blockly.games/maze?lang=pt-br): primeiros comandos em sequência."
      atividade:
        tempo: "40 min"
        descricao: "**Algoritmo testado por um colega.** No Diário de Bordo, escreva o algoritmo de uma tarefa do seu curso, com 10 a 15 passos. Um colega lê e *executa* o algoritmo ao pé da letra, marcando os passos ambíguos ou faltando. Reescreva a versão final."
      exercicios:
        basico:
          - "Escreva, no Diário de Bordo, um algoritmo de até 10 passos para preparar um café."
          - "Conclua os níveis 1 a 5 do Labirinto do Blockly Games."
        intermediario:
          - "Escreva o algoritmo de uma tarefa do seu curso (medir a área de um cômodo, diluir uma solução, trocar uma ferramenta no torno)."
          - "Registre no Google Documentos o que cada bloco do Labirinto faz."
        avancado:
          - "Conclua os níveis 6 a 10 do Labirinto e explique no Google Documentos a estratégia usada nos níveis com repetição."
          - "Reescreva o algoritmo do café prevendo problemas (falta de água, falta de pó)."

    - n: 2
      tema: "Fluxogramas e pensamento computacional"
      ferramentas: [Documentos, Fluxogramas, Blockly Games]
      objetivo: "Representar algoritmos com fluxogramas (início/fim, processo, entrada/saída, decisão) e decompor problemas em passos."
      material:
        - "Símbolos de fluxograma e as quatro ideias do pensamento computacional: decomposição, padrões, abstração e algoritmo."
        - "[diagrams.net](https://app.diagrams.net/), direto no navegador, ou *Inserir → Desenho* no Google Documentos para desenhar fluxogramas."
        - "Exemplo: fluxograma da média de duas provas (entrada das notas, cálculo, saída)."
      atividade:
        tempo: "40 min"
        descricao: "**Fluxograma do orçamento de pintura.** No diagrams.net, desenhe o fluxograma que lê largura e altura de uma parede e a área de uma janela, calcula a área a pintar e a quantidade de latas (1 lata cobre 18 m²). Exporte como imagem e cole no Diário de Bordo."
      exercicios:
        basico:
          - "Desenhe o fluxograma do cálculo da área de um terreno retangular."
        intermediario:
          - "Desenhe o fluxograma que lê uma nota e informa *Aprovado* ou *Reprovado* (média 7,0)."
          - "Cole no Diário de Bordo uma captura de tela do Labirinto até o nível 10."
        avancado:
          - "Desenhe o fluxograma de um caixa de supermercado que soma 3 produtos, lê o valor pago e calcula o troco, avisando quando o pagamento não for suficiente."

    - n: 3
      tema: "Primeiros programas no Scratch: eventos e sequência"
      ferramentas: [Documentos, Scratch]
      objetivo: "Criar o primeiro programa no Scratch usando eventos, sequência, falas e perguntas."
      material:
        - "[Scratch](https://scratch.mit.edu/): conta da turma, palco, atores, blocos de *Eventos*, *Aparência* e *Sensores*."
        - "Blocos `quando bandeira verde for clicada`, `diga`, `pergunte e espere` e `resposta`."
        - "Exemplo: ator que pergunta o nome e responde com uma saudação."
      scratch: [aula03_nivel1.sb3, aula03_nivel2.sb3, aula03_nivel3.sb3]
      atividade:
        tempo: "45 min"
        descricao: "**Diálogo interativo no Scratch.** Crie uma cena com dois atores que conversam: um pergunta o nome e o curso do usuário, o outro responde usando as respostas, e os dois se movem durante a conversa. Cole o link do projeto no Diário de Bordo."
      exercicios:
        basico:
          - "Faça um ator dizer seu nome e seu curso, um de cada vez."
          - "Faça o ator andar 100 passos depois de falar."
        intermediario:
          - "Faça um ator perguntar seu nome e sua idade e responder com uma frase usando os dois dados."
          - "Crie uma animação de 5 passos (mover, girar, mudar fantasia) acionada pela tecla espaço."
        avancado:
          - "Crie uma história com 3 perguntas e respostas montadas com o bloco `junte`, mudando a posição do ator a cada fala."
          - "Escreva no Google Documentos o fluxograma equivalente ao seu programa."

    - n: 4
      tema: "Primeiro programa em Python no Google Colab"
      ferramentas: [Documentos, Python, Colab, Scratch]
      objetivo: "Usar o Google Colab, escrever e executar o primeiro programa em Python com `print`, e comparar com o mesmo programa no Scratch."
      material:
        - "[Google Colab](https://colab.research.google.com/): criar caderno, células de código e de texto, executar e salvar no Drive."
        - "Python: `print`, textos entre aspas e comentários com `#` (exemplo comentado no Colab)."
        - "Comparação lado a lado: bloco `diga` (Scratch) × `print` (Python)."
        - "Google Documentos: colar o código com fonte monoespaçada e uma captura de tela da execução no Diário de Bordo."
      python: [aula04_nivel1.ipynb, aula04_nivel2.ipynb, aula04_nivel3.ipynb]
      scratch: [aula04_nivel1.sb3, aula04_nivel2.sb3, aula04_nivel3.sb3]
      atividade:
        tempo: "30 min"
        descricao: "**Cartão de apresentação.** No Colab, imprima um cartão com bordas de `*` contendo nome, curso, turma e uma frase sobre você. Faça o mesmo no Scratch e cole as duas versões (código e captura de tela) no Diário de Bordo."
      exercicios:
        basico:
          - "Escreva um programa que imprime seu nome, turma e curso, um em cada linha."
        intermediario:
          - "Imprima um cartão de identificação com bordas feitas de `*`."
          - "Refaça o exercício anterior no Scratch e compare os dois códigos no Diário de Bordo."
        avancado:
          - "Imprima um desenho (casa ou foguete) feito com caracteres e uma legenda, usando repetição de texto como `\"*\" * 10`."

    - n: 5
      tema: "Variáveis, tipos e atribuição"
      ferramentas: [Planilhas, Documentos, Python, Python Tutor]
      objetivo: "Compreender variáveis, os tipos `int`, `float` e `str`, a atribuição e a ordem das operações."
      material:
        - "Python: variáveis de cada tipo e cálculos com elas (exemplo comentado no Colab)."
        - "[Python Tutor](https://pythontutor.com/python-compiler.html#mode=edit) para ver as variáveis mudando a cada linha."
        - "Função `type()` e conversão entre tipos."
        - "Google Documentos: tabela de variáveis (nome, tipo, valor) no Diário de Bordo."
      planilhas:
        - "Largura em `A2` (4,5) e comprimento em `B2` (3,2); em `C2`, `=A2*B2` calcula a área."
        - "Em `D2`, `=2*(A2+B2)` calcula o perímetro; mude `A2` e veja `C2` e `D2` se atualizarem sozinhos."
        - "Orçamento de piso: preço do m² em `E2` e, em `F2`, `=C2*1,1*E2` (área com 10% de perda × preço), formatado como moeda."
      python: [aula05_nivel1.ipynb, aula05_nivel2.ipynb, aula05_nivel3.ipynb]
      atividade:
        tempo: "40 min"
        descricao: "**Orçamento de piso.** Com variáveis para largura, comprimento, preço do m² e 10% de perda, calcule a área, a área com perda e o custo total. Resolva no Colab e na planilha, e monte no Google Documentos a tabela de variáveis (nome, tipo, valor)."
      exercicios:
        basico:
          - "Crie variáveis para seu nome, idade e altura e imprima as três."
        intermediario:
          - "Calcule a área e o perímetro de um retângulo de 4,5 m × 3,2 m em Python e na planilha."
          - "Calcule a média de três notas guardadas em variáveis."
        avancado:
          - "Troque o valor de duas variáveis sem perder nenhum, execute no Python Tutor e explique no Google Documentos o que aconteceu."
          - "Converta o texto `\"12.50\"` em número e calcule o dobro."

    - n: 6
      tema: "Entrada e saída de dados"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Ler dados do usuário com `input()`, convertê-los com `float()`/`int()` e formatar a saída com f-strings."
      material:
        - "Python: `input()` sempre devolve texto; `float()` e `int()` convertem para número (exemplo comentado no Colab)."
        - "Scratch: `pergunte e espere`, `resposta` e variáveis."
        - "Google Documentos: registrar exemplos de execução (entrada → saída esperada → saída obtida)."
      planilhas:
        - "Célula de entrada colorida `B1` (preço) e, em `B2`, `=B1*2` (preço de duas unidades)."
        - "Preço em `B1`, desconto (%) em `B2` e preço final em `B3`: `=B1-B1*B2/100`."
        - "Conta de energia: leitura anterior em `B1`, atual em `B2`, preço do kWh em `B3`, taxa fixa em `B4`; consumo `=B2-B1` e valor `=ARRED((B2-B1)*B3+B4; 2)`."
      python: [aula06_nivel1.ipynb, aula06_nivel2.ipynb, aula06_nivel3.ipynb]
      scratch: [aula06_nivel1.sb3, aula06_nivel2.sb3, aula06_nivel3.sb3]
      atividade:
        tempo: "40 min"
        descricao: "**Conta de energia.** Leia a leitura anterior e a atual do medidor, o preço do kWh e a taxa fixa; mostre o consumo e o valor da conta com 2 casas decimais. Registre no Google Documentos três execuções (entrada → saída esperada → saída obtida)."
      exercicios:
        basico:
          - "Leia seu nome e sua cidade e mostre uma frase com os dois."
        intermediario:
          - "Leia a temperatura em °C e mostre em °F e em K."
          - "Leia o preço de um produto e o percentual de desconto e mostre o preço final."
        avancado:
          - "Conta de energia: leia as leituras do medidor, o preço do kWh e o acréscimo da bandeira tarifária (R$ por kWh) e mostre o valor da conta com taxa fixa."

    - n: 7
      tema: "Operadores aritméticos e a biblioteca math"
      ferramentas: [Planilhas, Documentos, Python]
      objetivo: "Usar operadores (`+ - * / // % **`) e funções matemáticas (`math.sqrt`, `math.pi`, `round`) em problemas técnicos."
      material:
        - "Python: `import math`, potência `**`, divisão inteira `//` e resto `%` (exemplo comentado no Colab)."
        - "Conversão de unidades: minutos em horas e minutos; litros em m³."
        - "Google Documentos: escrever as fórmulas com o editor de equações (*Inserir → Equação*)."
      planilhas:
        - "`=17+5`, `=17/5`, `=17^2` (potência) e `=MOD(17; 5)` (resto da divisão)."
        - "Raio em `A2`; área `=ARRED(PI()*A2^2; 2)` e comprimento `=ARRED(2*PI()*A2; 2)`."
        - "Segundos em `A2`; horas `=QUOCIENTE(A2; 3600)`, minutos `=QUOCIENTE(MOD(A2; 3600); 60)` e segundos `=MOD(A2; 60)`."
      python: [aula07_nivel1.ipynb, aula07_nivel2.ipynb, aula07_nivel3.ipynb]
      atividade:
        tempo: "45 min"
        descricao: "**Caixa d'água cilíndrica.** Leia o diâmetro e a altura e mostre o volume em m³ e em litros. Depois leia a vazão de uma torneira (L/min) e mostre o tempo para encher a caixa em horas e minutos, usando `//` e `%`. Escreva as fórmulas com o editor de equações do Google Documentos."
      exercicios:
        basico:
          - "Leia dois números e mostre soma, diferença, produto, divisão, divisão inteira e resto."
        intermediario:
          - "Leia o raio e mostre a área e o comprimento de uma circunferência."
          - "Leia uma duração em segundos e mostre em horas, minutos e segundos."
        avancado:
          - "Caixa d'água cilíndrica: volume em m³ e em litros e o tempo para encher com uma vazão dada."
          - "Contexto do curso: massa de soluto para uma concentração ou velocidade de corte de uma ferramenta (escolha um)."

    - n: 8
      tema: "Expressões lógicas: relacionais, E, OU, NÃO"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Construir expressões booleanas com `== != < > <= >=` e `and`, `or`, `not`, e montar tabelas-verdade."
      material:
        - "Python: `True`/`False`, `and`, `or`, `not` e a precedência dos operadores (exemplo comentado no Colab)."
        - "Scratch: blocos hexagonais de *Operadores* (`e`, `ou`, `não`)."
        - "Google Documentos: tabelas-verdade montadas como tabela no documento."
      planilhas:
        - "Idade em `A2`; `=A2>=16` mostra VERDADEIRO ou FALSO."
        - "`=E(A2>=16; A2<18)` (voto facultativo) e `=OU(A2<16; A2>=70)`."
        - "Ano em `A2`; bissexto: `=OU(E(MOD(A2; 4)=0; MOD(A2; 100)<>0); MOD(A2; 400)=0)`."
      python: [aula08_nivel1.ipynb, aula08_nivel2.ipynb, aula08_nivel3.ipynb]
      scratch: [aula08_nivel1.sb3, aula08_nivel2.sb3, aula08_nivel3.sb3]
      atividade:
        tempo: "35 min"
        descricao: "**Ano bissexto em uma expressão.** Escreva uma única expressão lógica que diga se um ano é bissexto (divisível por 4 e não por 100, ou divisível por 400). Teste com 1900, 2000, 2024 e 2025 e registre no Google Documentos uma tabela com o valor de cada parte da expressão."
      exercicios:
        basico:
          - "Monte no Google Documentos a tabela-verdade de `E` e de `OU` para duas variáveis."
        intermediario:
          - "Leia a idade e mostre `True`/`False` para *maior de idade* e *voto facultativo*."
          - "Leia o comprimento de três segmentos e informe se eles podem formar um triângulo."
        avancado:
          - "Escreva uma única expressão que diga se um ano é bissexto e teste com 1900, 2000, 2024 e 2025."

    - n: 9
      tema: "Decisão simples e composta: if / else"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Usar `if`/`else` para tomar decisões e reproduzir a mesma lógica no Scratch e na planilha com `SE`."
      material:
        - "Python: `if`/`else`; o recuo (indentação) define o bloco (exemplo comentado no Colab)."
        - "Scratch: bloco `se ... então ... senão`."
        - "Google Documentos: fluxograma do `if/else` com *Inserir → Desenho*."
      planilhas:
        - "`=SE(MOD(A2; 2)=0; \"Par\"; \"Ímpar\")`."
        - "Média em `D2`: `=SE(D2>=7; \"Aprovado\"; \"Reprovado\")`."
        - "10 medidas em `A2:A11` e `=SE(ABS(A2-50)<=0,2; \"Aprovada\"; \"Reprovada\")`, com formatação condicional pintando de vermelho as reprovadas."
      python: [aula09_nivel1.ipynb, aula09_nivel2.ipynb, aula09_nivel3.ipynb]
      scratch: [aula09_nivel1.sb3, aula09_nivel2.sb3, aula09_nivel3.sb3]
      atividade:
        tempo: "40 min"
        descricao: "**Controle de qualidade.** Leia a medida de uma peça e informe *Aprovada* se estiver entre 49,8 mm e 50,2 mm, senão *Reprovada*. Faça em Python, no Scratch e na planilha com `SE` para 10 peças, e desenhe o fluxograma no Google Documentos."
      exercicios:
        basico:
          - "Leia um número inteiro e informe se ele é par ou ímpar (use `%`)."
        intermediario:
          - "Leia duas notas e informe *Aprovado* ou *Reprovado*."
          - "Leia o pH de uma solução e informe se ela é ácida ou básica/neutra."
        avancado:
          - "Leia a medida de uma peça e informe se está dentro da tolerância de 50 ± 0,2 mm, mostrando a diferença."
          - "Faça a mesma verificação para 10 peças na planilha."

    - n: 10
      tema: "Decisões encadeadas: if / elif / else"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Tratar várias faixas de valores com `elif` e com `SE` aninhado ou `SES` na planilha."
      material:
        - "Python: `elif` só é testado quando as condições anteriores são falsas (exemplo comentado no Colab)."
        - "Scratch: blocos `se ... senão` dentro de outros."
        - "Google Documentos: relatório curto com título, enunciado, código e testes, usando estilos de título e sumário automático."
      planilhas:
        - "pH em `A2`: `=SE(A2<7; \"Ácido\"; SE(A2=7; \"Neutro\"; \"Básico\"))`."
        - "Nota em `B2`: `=SES(B2>=9; \"A\"; B2>=7; \"B\"; B2>=5; \"C\"; VERDADEIRO; \"D\")`."
        - "Velocidade em `A2`, limite em `B2`, excesso `=(A2-B2)/B2` em `C2` e `=SES(C2<=0; \"Sem multa\"; C2<=20%; \"Leve\"; C2<=50%; \"Grave\"; VERDADEIRO; \"Gravíssima\")`."
      python: [aula10_nivel1.ipynb, aula10_nivel2.ipynb, aula10_nivel3.ipynb]
      scratch: [aula10_nivel1.sb3, aula10_nivel2.sb3, aula10_nivel3.sb3]
      atividade:
        tempo: "50 min"
        descricao: "**Classificador de multas.** Leia a velocidade medida e o limite da via e informe: sem multa, leve (até 20% acima), grave (até 50% acima) ou gravíssima. Resolva em Python e na planilha com `SES`, e escreva um relatório curto no Google Documentos com títulos e sumário automático."
      exercicios:
        basico:
          - "Leia o pH e classifique em ácido, neutro ou básico."
        intermediario:
          - "Leia uma nota de 0 a 10 e mostre o conceito A, B, C ou D em Python, no Scratch e na planilha."
        avancado:
          - "Leia a velocidade e o limite da via e classifique a multa em 4 faixas, mostrando o percentual de excesso."
          - "Escreva no Google Documentos o relatório de um dos exercícios, com sumário automático."

    - n: 11
      tema: "Avaliação da Unidade 1"
      ferramentas: [Documentos, Python]
      objetivo: "Avaliar variáveis, entrada e saída, operadores e decisões, com registro no Google Documentos."
      material:
        - "Prova prática no Colab com 3 questões, uma delas resolvida também em Google Documentos."
        - "Entrega no Classroom dos links do caderno Colab e dos arquivos produzidos."
      atividade:
        tempo: "50 min"
        descricao: "**Questão principal da prova.** Programa completo com entrada de dados, cálculo e decisão encadeada, com o raciocínio registrado no Google Documentos."
      exercicios:
        basico:
          - "Refaça, sem consultar, dois exemplos de nível 1 das aulas 5 a 10."
        intermediario:
          - "Simulado: resolva um exercício de nível 2 de cada aula da unidade."
        avancado:
          - "Simulado: programa de orçamento com entrada, cálculo e decisão encadeada, documentado no Google Documentos."

    - n: 12
      tema: "Reavaliação da Unidade 1"
      ferramentas: [Documentos, Python]
      objetivo: "Dar uma nova oportunidade a quem não atingiu a média, reavaliando variáveis, entrada e saída, operadores e decisões, com registro no Google Documentos."
      material:
        - "Correção comentada da avaliação e revisão dos pontos com mais erros (primeira parte da aula)."
        - "Nova prova prática no Colab, no mesmo formato da avaliação, para quem não atingiu a média."
        - "Quem já atingiu a média resolve uma lista de desafios da unidade."
      atividade:
        tempo: "40 min"
        descricao: "**Desafio para quem já foi aprovado:** calculadora de tarifa de estacionamento (1ª hora R$ 5, demais R$ 3, máximo R$ 20 por dia), em Python e documentada no Google Documentos. Os demais fazem a nova prova."
      exercicios:
        basico:
          - "Refaça as questões que você errou na avaliação, com a correção comentada ao lado."
        intermediario:
          - "Resolva a nova prova (quem não atingiu a média)."
        avancado:
          - "Desafio: tarifa de estacionamento (1ª hora R$ 5, demais R$ 3, máximo R$ 20 por dia), documentada no Google Documentos."

- unidade: 2
  titulo: "Lógica de repetição. Interação com planilhas e gráficos"
  resumo: "Laços `for` e `while`, acumuladores, contadores e números aleatórios, sempre conferidos e visualizados em planilhas e gráficos."
  aulas:
    - n: 13
      tema: "Introdução à repetição: for e range"
      ferramentas: [Planilhas, Python, Scratch]
      objetivo: "Repetir instruções com `for` e `range(início, fim, passo)` e relacionar com `repita` no Scratch e com séries na planilha."
      material:
        - "Python: `range(início, fim, passo)`; o fim não entra (exemplo comentado no Colab)."
        - "Scratch: blocos `repita 10 vezes` e `sempre`."
      planilhas:
        - "Digite 1 em `A1` e 2 em `A2`, selecione as duas células e arraste para baixo até 10."
        - "`=SEQUÊNCIA(21; 1; 0; 5)` gera os múltiplos de 5 de 0 a 100."
        - "Tabuada: número em `B1`, `=SEQUÊNCIA(10)` em `A3` e `=$B$1*A3` em `B3`, arrastada para baixo (o `$` fixa a célula)."
      python: [aula13_nivel1.ipynb, aula13_nivel2.ipynb, aula13_nivel3.ipynb]
      scratch: [aula13_nivel1.sb3, aula13_nivel2.sb3, aula13_nivel3.sb3]
      atividade:
        tempo: "35 min"
        descricao: "**Tabuada formatada.** Leia um número e mostre a tabuada de 1 a 10 no formato `7 x 3 = 21`. Na planilha, gere a mesma tabuada com `=SEQUÊNCIA()` e uma fórmula ao lado, e compare."
      exercicios:
        basico:
