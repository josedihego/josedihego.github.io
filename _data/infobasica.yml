# Plano de aulas de Informática (Edificações, Química, Mecânica), rendered by /infobasica/
# 36 encontros de 2 h, em 3 unidades de 12; cada unidade termina com avaliação e reavaliação.
- unidade: 1
  titulo: "Algoritmos, variáveis e decisões. Interação com Documentos"
  resumo: "Do algoritmo no papel ao primeiro programa em Python: sequência, variáveis, entrada de dados, cálculos e decisões, com cada etapa registrada no Google Documentos."
  aulas:
    - n: 1
      tema: "Apresentação da disciplina e o que é um algoritmo"
      ferramentas: [Documentos, Blockly Games]
      objetivo: "Entender o que é um algoritmo, reconhecer algoritmos no cotidiano e no curso técnico, e conhecer as ferramentas e a forma de avaliação."
      material:
        - "Apresentação da disciplina, das ferramentas e dos critérios de avaliação."
        - "Algoritmos do cotidiano: receita, troca de pneu, traço de concreto, preparo de uma solução, montagem de uma peça."
        - "Google Documentos: criação do **Diário de Bordo** da turma (um documento por estudante, compartilhado com o professor)."
        - "[Blockly Games – Labirinto](https://blockly.games/maze?lang=pt-br): primeiros comandos em sequência."
      exercicios:
        - "Escreva, no Diário de Bordo, um algoritmo de até 10 passos para preparar um café."
        - "Escreva o algoritmo de uma tarefa do seu curso (ex.: medir a área de um cômodo, diluir uma solução, trocar uma ferramenta no torno)."
        - "Conclua os níveis 1 a 5 do Labirinto do Blockly Games e registre no Google Documentos o que cada bloco faz."

    - n: 2
      tema: "Fluxogramas e pensamento computacional"
      ferramentas: [Documentos, Fluxogramas, Blockly Games]
      objetivo: "Representar algoritmos com fluxogramas (início/fim, processo, entrada/saída, decisão) e decompor problemas em passos."
      material:
        - "Símbolos de fluxograma e as quatro ideias do pensamento computacional: decomposição, padrões, abstração e algoritmo."
        - "[Flowgorithm](http://www.flowgorithm.org/) ou [diagrams.net](https://app.diagrams.net/) para desenhar e executar fluxogramas."
        - "Exemplo: fluxograma da média de duas provas (entrada das notas, cálculo, saída)."
      exercicios:
        - "Desenhe o fluxograma do cálculo da área de um terreno retangular."
        - "Desenhe o fluxograma que lê uma nota e informa *Aprovado* ou *Reprovado* (média 7,0)."
        - "Conclua os níveis 6 a 10 do Labirinto (Blockly Games) e cole uma captura de tela no Diário de Bordo."

    - n: 3
      tema: "Primeiros programas no Scratch: eventos e sequência"
      ferramentas: [Documentos, Scratch]
      objetivo: "Criar o primeiro programa no Scratch usando eventos, sequência, falas e perguntas."
      material:
        - "[Scratch](https://scratch.mit.edu/): conta da turma, palco, atores, blocos de *Eventos*, *Aparência* e *Sensores*."
        - "Blocos `quando bandeira verde for clicada`, `diga`, `pergunte e espere` e `resposta`."
        - "Exemplo: ator que pergunta o nome e responde com uma saudação."
      exercicios:
        - "Faça um ator perguntar seu nome e sua idade e responder com uma frase usando os dois dados."
        - "Crie uma pequena animação de 5 passos (mover, girar, mudar fantasia) acionada pela tecla espaço."
        - "Escreva, no Google Documentos, o fluxograma equivalente ao programa da questão 1."

    - n: 4
      tema: "Primeiro programa em Python no Google Colab"
      ferramentas: [Documentos, Python, Colab, Scratch]
      objetivo: "Usar o Google Colab, escrever e executar o primeiro programa em Python com `print`, e comparar com o mesmo programa no Scratch."
      material:
        - "[Google Colab](https://colab.research.google.com/): criar caderno, células de código e de texto, executar e salvar no Drive."
        - "Python: `print(\"Olá, mundo!\")`, comentários com `#`, mensagens de erro mais comuns."
        - "Comparação lado a lado: bloco `diga` (Scratch) × `print` (Python)."
        - "Google Documentos: colar o código com fonte monoespaçada e uma captura de tela da execução no Diário de Bordo."
      exercicios:
        - "Escreva um programa que imprime seu nome, turma e curso, um em cada linha."
        - "Imprima um cartão de identificação com bordas feitas de `*`."
        - "Refaça o exercício 1 no Scratch e compare os dois códigos no Diário de Bordo."

    - n: 5
      tema: "Variáveis, tipos e atribuição"
      ferramentas: [Planilhas, Documentos, Python, Python Tutor]
      objetivo: "Compreender variáveis, os tipos `int`, `float` e `str`, a atribuição e a ordem das operações."
      material:
        - "Python: `largura = 4.5`, `comprimento = 3.2`, `area = largura * comprimento`, `print(area)`."
        - "[Python Tutor](https://pythontutor.com/python-compiler.html#mode=edit) para ver as variáveis mudando a cada linha."
        - "Planilhas: a célula como variável. Largura em `A2`, comprimento em `B2` e, em `C2`, `=A2*B2`."
        - "Função `type()` e conversão entre tipos."
        - "Google Documentos: tabela de variáveis (nome, tipo, valor) no Diário de Bordo."
      exercicios:
        - "Calcule a área e o perímetro de um retângulo de 4,5 m × 3,2 m em Python e na planilha."
        - "Calcule a média de três notas guardadas em variáveis e imprima o resultado."
        - "Execute no Python Tutor um programa que troca o valor de duas variáveis e explique, no Google Documentos, o que aconteceu."

    - n: 6
      tema: "Entrada e saída de dados"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Ler dados do usuário com `input()`, convertê-los com `float()`/`int()` e formatar a saída com f-strings."
      material:
        - "Python: `preco = float(input(\"Preço: \"))` e `print(f\"Total: R$ {total:.2f}\")`."
        - "Scratch: `pergunte e espere`, `resposta` e variáveis."
        - "Planilhas: células de entrada destacadas por cor e célula de resultado protegida."
        - "Google Documentos: registrar exemplos de execução (entrada → saída esperada → saída obtida)."
      exercicios:
        - "Leia a temperatura em °C e mostre em °F e em K."
        - "Leia o preço de um produto e o percentual de desconto e mostre o preço final."
        - "Leia o consumo de um mês em kWh e o preço do kWh e mostre o valor da conta."

    - n: 7
      tema: "Operadores aritméticos e a biblioteca math"
      ferramentas: [Planilhas, Documentos, Python]
      objetivo: "Usar operadores (`+ - * / // % **`) e funções matemáticas (`math.sqrt`, `math.pi`, `round`) em problemas técnicos."
      material:
        - "Python: `import math`, área do círculo `math.pi * r ** 2`, divisão inteira e resto (`//` e `%`)."
        - "Conversão de unidades: minutos em horas e minutos; litros em m³."
        - "Planilhas: `=RAIZ()`, `=POTÊNCIA()`, `=PI()`, `=ARRED()`, `=QUOCIENTE()`, `=MOD()`."
        - "Google Documentos: escrever as fórmulas com o editor de equações (*Inserir → Equação*)."
      exercicios:
        - "Leia o raio e mostre a área e o comprimento de uma circunferência."
        - "Leia uma duração em segundos e mostre em horas, minutos e segundos."
        - "Leia a diagonal de uma tela em polegadas e mostre em centímetros."
        - "Contexto do curso: volume de uma caixa d'água cilíndrica, massa de soluto para uma concentração ou velocidade de corte de uma ferramenta (escolha um)."

    - n: 8
      tema: "Expressões lógicas: relacionais, E, OU, NÃO"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Construir expressões booleanas com `== != < > <= >=` e `and`, `or`, `not`, e montar tabelas-verdade."
      material:
        - "Python: `True`/`False`, `idade >= 16 and idade < 18`, a precedência dos operadores."
        - "Planilhas: `=E(A2>=16; A2<18)`, `=OU()`, `=NÃO()`."
        - "Scratch: blocos hexagonais de *Operadores* (`e`, `ou`, `não`)."
        - "Google Documentos: tabelas-verdade montadas como tabela no documento."
      exercicios:
        - "Monte no Google Documentos a tabela-verdade de `E` e de `OU` para duas variáveis."
        - "Leia o comprimento de três segmentos e informe se eles podem formar um triângulo."
        - "Leia um ano e informe `True` se ele for bissexto."

    - n: 9
      tema: "Decisão simples e composta: if / else"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Usar `if`/`else` para tomar decisões e reproduzir a mesma lógica no Scratch e na planilha com `SE`."
      material:
        - "Python: aprovado ou reprovado a partir da média; a indentação define o bloco."
        - "Scratch: bloco `se ... então ... senão`."
        - "Planilhas: `=SE(D2>=7; \"Aprovado\"; \"Reprovado\")`."
        - "Google Documentos: fluxograma do `if/else` com *Inserir → Desenho*."
      exercicios:
        - "Leia um número inteiro e informe se ele é par ou ímpar (use `%`)."
        - "Leia a idade e informe se a pessoa já pode votar."
        - "Leia o pH de uma solução e informe se ela é ácida ou básica/neutra."

    - n: 10
      tema: "Decisões encadeadas: if / elif / else"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Tratar várias faixas de valores com `elif` e com `SE` aninhado ou `SES` na planilha."
      material:
        - "Python: conceito A, B, C ou D a partir da nota."
        - "Scratch: blocos `se ... senão` dentro de outros."
        - "Planilhas: `=SES(B2>=9; \"A\"; B2>=7; \"B\"; B2>=5; \"C\"; VERDADEIRO; \"D\")`."
        - "Google Documentos: relatório curto com título, enunciado, código e testes, usando estilos de título e sumário automático."
      exercicios:
        - "Leia uma nota de 0 a 10 e mostre o conceito em Python, no Scratch e na planilha."
        - "Leia o pH e classifique em ácido, neutro ou básico."
        - "Leia a velocidade de um veículo numa via de 60 km/h e informe: sem multa, multa leve (até 20% acima) ou multa grave."
        - "Escreva no Google Documentos o relatório de um dos exercícios, com sumário automático."

    - n: 11
      tema: "Avaliação da Unidade 1"
      ferramentas: [Documentos, Python]
      objetivo: "Avaliar variáveis, entrada e saída, operadores e decisões, com registro no Google Documentos."
      material:
        - "Prova prática no Colab com 3 questões, uma delas resolvida também em Google Documentos."
        - "Entrega no Classroom dos links do caderno Colab e dos arquivos produzidos."
      exercicios:
        - "Questões da avaliação (aplicadas em sala)."
        - "Autoavaliação no Diário de Bordo: o que eu já sei, o que ainda preciso praticar."

    - n: 12
      tema: "Reavaliação da Unidade 1"
      ferramentas: [Documentos, Python]
      objetivo: "Dar uma nova oportunidade a quem não atingiu a média, reavaliando variáveis, entrada e saída, operadores e decisões, com registro no Google Documentos."
      material:
        - "Correção comentada da avaliação e revisão dos pontos com mais erros (primeira parte da aula)."
        - "Nova prova prática no Colab, no mesmo formato da avaliação, para quem não atingiu a média."
        - "Quem já atingiu a média resolve uma lista de desafios da unidade."
      exercicios:
        - "Questões da reavaliação (aplicadas em sala)."
        - "Lista de desafios para quem já foi aprovado na unidade."

- unidade: 2
  titulo: "Lógica de repetição. Interação com planilhas e gráficos"
  resumo: "Laços `for` e `while`, acumuladores, contadores e números aleatórios, sempre conferidos e visualizados em planilhas e gráficos."
  aulas:
    - n: 13
      tema: "Introdução à repetição: for e range"
      ferramentas: [Planilhas, Python, Scratch]
      objetivo: "Repetir instruções com `for` e `range(início, fim, passo)` e relacionar com `repita` no Scratch e com séries na planilha."
      material:
        - "Python: `for i in range(1, 11): print(i)` e variações com passo e passo negativo."
        - "Scratch: blocos `repita 10 vezes` e `sempre`."
        - "Planilhas: arrastar série e `=SEQUÊNCIA(10; 1; 1; 1)`."
      exercicios:
        - "Imprima os múltiplos de 5 entre 0 e 100."
        - "Imprima uma contagem regressiva de 10 até 1 e depois *Lançar!*."
        - "Imprima a tabuada de um número lido do teclado."

    - n: 14
      tema: "Acumuladores: somas e médias"
      ferramentas: [Planilhas, Python, Python Tutor]
      objetivo: "Usar uma variável acumuladora dentro do laço para calcular somas e médias."
      material:
        - "Python: `total = 0` antes do laço e `total = total + valor` dentro dele."
        - "Python Tutor para acompanhar o acumulador volta a volta."
        - "Planilhas: `=SOMA()` e `=MÉDIA()` como a versão pronta do mesmo laço."
      exercicios:
        - "Leia o gasto de cada dia da semana e mostre o total e a média diária."
        - "Calcule a soma dos números de 1 a N e compare com a fórmula `N * (N + 1) / 2`."
        - "Calcule o fatorial de N."

    - n: 15
      tema: "Contadores, maior e menor"
      ferramentas: [Planilhas, Python]
      objetivo: "Combinar laços e decisões para contar ocorrências e encontrar o maior e o menor valor."
      material:
        - "Python: contador (`qtd = qtd + 1`) dentro de um `if`; variáveis `maior` e `menor` iniciadas com o primeiro valor lido."
        - "Exemplo: temperaturas máximas de um mês."
        - "Planilhas: `=CONT.SE(B2:B31; \">30\")`, `=MÁXIMO()`, `=MÍNIMO()`."
      exercicios:
        - "Leia as temperaturas de 7 dias e mostre a maior, a menor e quantos dias passaram de 30 °C."
        - "Leia as idades de 10 pessoas e conte quantas são menores de idade."
        - "Faça a mesma análise na planilha e compare os resultados."

    - n: 16
      tema: "Repetição com condição: while"
      ferramentas: [Planilhas, Python, Scratch, Fluxogramas]
      objetivo: "Usar `while` quando o número de repetições não é conhecido e evitar laços infinitos."
      material:
        - "Python: poupança que rende 1% ao mês. Em quantos meses o valor dobra?"
        - "Validação de entrada: repetir a pergunta até o valor ser válido."
        - "Scratch: `repita até que`. Fluxograma do `while` × fluxograma do `for`."
        - "Planilhas: a mesma poupança mês a mês, uma linha por mês, e gráfico do saldo."
      exercicios:
        - "Calcule em quantos meses uma aplicação dobra de valor, dada a taxa mensal."
        - "Leia notas até que o usuário digite um valor negativo e mostre a média das notas válidas."
        - "Peça uma senha até que o usuário acerte ou erre 3 vezes."

    - n: 17
      tema: "Números aleatórios"
      ferramentas: [Planilhas, Python, Scratch]
      objetivo: "Gerar números aleatórios com o módulo `random` e usá-los em sorteios e simulações."
      material:
        - "Python: `import random`, `random.randint(a, b)`, `random.choice(lista)`."
        - "Scratch: `número aleatório entre 1 e 10`; Planilhas: `=ALEATÓRIOENTRE(1; 10)`."
        - "Frequência de resultados em muitas repetições."
        - "Planilhas: gráfico de colunas com a frequência de cada resultado."
      exercicios:
        - "Sorteie 6 números entre 1 e 60 e mostre-os."
        - "Simule 1000 lançamentos de uma moeda e mostre o percentual de caras."
        - "Faça a mesma simulação na planilha e compare."

    - n: 18
      tema: "Projeto: jogo de adivinhação"
      ferramentas: [Planilhas, Documentos, Python, Scratch]
      objetivo: "Construir um jogo completo combinando sorteio, decisões e repetição."
      material:
        - "Python: o computador sorteia um número de 1 a 100 e o jogador tenta adivinhar com dicas *maior*/*menor*."
        - "Versão Scratch com um ator que dá as dicas."
        - "Google Documentos: regras do jogo e estratégia para acertar em poucas tentativas."
        - "Planilhas: registro das partidas (tentativas por jogo) e gráfico de evolução."
      exercicios:
        - "Implemente o jogo de adivinhação e mostre o número de tentativas no final."
        - "Limite o jogo a 7 tentativas e pergunte se o jogador quer jogar de novo."
        - "Explique no Google Documentos por que 7 tentativas sempre bastam para números de 1 a 100."
        - "Registre 10 partidas na planilha e faça um gráfico do número de tentativas."

    - n: 19
      tema: "Laços com decisões: múltiplos, divisores e sequências"
      ferramentas: [Planilhas, Python, Python Tutor]
      objetivo: "Resolver problemas que combinam `for`, `%` e contadores, e usar `break`."
      material:
        - "Python: múltiplos e divisores com `%`; `break` para encerrar o laço mais cedo."
        - "Sequência de Fibonacci com duas variáveis."
        - "Planilhas: `=MOD()` e formatação condicional para destacar valores."
      exercicios:
        - "Mostre os números de 1 a 100 que são múltiplos de 3 ou de 7."
        - "Mostre os 20 primeiros termos da sequência de Fibonacci, em Python e na planilha."
        - "Leia dois números e mostre o MDC entre eles."

    - n: 20
      tema: "Menus e programas que se repetem"
      ferramentas: [Planilhas, Python, Fluxogramas]
      objetivo: "Construir programas com menu e laço principal (`while True` + `break`) e escolher opções com `if/elif` ou `match`."
      material:
        - "Python: conversor de unidades com menu que continua até o usuário escolher *Sair*."
        - "Tratamento de opção inválida."
        - "Fluxograma do laço principal de um menu."
        - "Planilhas: tabela de conversão para conferir as respostas do programa."
      exercicios:
        - "Conversor de unidades com menu (m↔cm, kg↔g, °C↔°F) que só termina quando o usuário pedir."
        - "Caixa eletrônico simples: saldo, depósito, saque (sem saldo negativo) e sair."
        - "Adicione um contador de operações realizadas, mostrado ao sair."

    - n: 21
      tema: "Gráficos: Planilhas e Python (matplotlib)"
      ferramentas: [Planilhas, Python, Colab]
      objetivo: "Gerar dados com laços e visualizá-los em gráficos no Python e na planilha."
      material:
        - "Python: `import matplotlib.pyplot as plt`, listas de x e y, `plt.plot(x, y)`, `plt.grid()`, `plt.show()`."
        - "Rótulos dos eixos e título com `plt.xlabel`, `plt.ylabel` e `plt.title`."
        - "Planilhas: tabela x/y e inserção de gráfico de linha ou dispersão."
      exercicios:
        - "Plote a reta `y = 2x + 1` para x de -10 a 10."
        - "Plote a posição de um objeto em queda livre a cada 0,1 s durante 3 s."
        - "Faça o mesmo gráfico no Sheets e compare."

    - n: 22
      tema: "Simulações passo a passo com laços"
      ferramentas: [Planilhas, Python]
      objetivo: "Simular fenômenos que mudam com o tempo, atualizando valores a cada passo de um laço, e comparar com a planilha linha a linha."
      material:
        - "Python: o valor do próximo passo calculado a partir do atual, por exemplo `temperatura = temperatura - 0.1 * (temperatura - ambiente)`."
        - "Planilhas: uma linha por passo, com a fórmula da linha 3 apontando para a linha 2 e arrastada para baixo."
        - "Relação com o curso: resfriamento de uma peça usinada, decaimento da concentração de um reagente, ganho de resistência do concreto na cura."
      exercicios:
        - "Simule o resfriamento de uma peça de 200 °C num ambiente a 25 °C e informe em quantos minutos ela fica abaixo de 40 °C."
        - "Uma solução perde 8% da concentração por hora. Mostre a concentração hora a hora até ficar abaixo de 10% da inicial."
        - "Faça a mesma simulação na planilha e gere o gráfico."

    - n: 23
      tema: "Avaliação da Unidade 2"
      ferramentas: [Planilhas, Python]
      objetivo: "Avaliar repetição, acumuladores, contadores, aleatoriedade e gráficos, em Python e em planilha."
      material:
        - "Prova prática no Colab com 3 questões, uma delas resolvida também em Planilhas."
        - "Entrega no Classroom dos links do caderno Colab e dos arquivos produzidos."
      exercicios:
        - "Questões da avaliação (aplicadas em sala)."
        - "Autoavaliação no Diário de Bordo: o que eu já sei, o que ainda preciso praticar."

    - n: 24
      tema: "Reavaliação da Unidade 2"
      ferramentas: [Planilhas, Python]
      objetivo: "Dar uma nova oportunidade a quem não atingiu a média, reavaliando repetição, acumuladores, contadores, aleatoriedade e gráficos, em Python e em planilha."
      material:
        - "Correção comentada da avaliação e revisão dos pontos com mais erros (primeira parte da aula)."
        - "Nova prova prática no Colab, no mesmo formato da avaliação, para quem não atingiu a média."
        - "Quem já atingiu a média resolve uma lista de desafios da unidade."
      exercicios:
        - "Questões da reavaliação (aplicadas em sala)."
        - "Lista de desafios para quem já foi aprovado na unidade."

- unidade: 3
  titulo: "Textos, listas e funções"
  resumo: "Strings, listas, busca e filtro, funções, dicionários, programas com menu e leitura de dados de planilhas em CSV."
  aulas:
    - n: 25
      tema: "Textos (strings)"
      ferramentas: [Planilhas, Python]
      objetivo: "Manipular textos: leitura, tamanho, maiúsculas/minúsculas, fatias e formatação."
      material:
        - "Python: `len(texto)`, `texto.upper()`, `texto.strip()`, `texto[0:3]`, `texto.replace()`."
        - "Percorrer as letras de um texto com `for letra in texto`."
        - "Planilhas: `=CONCATENAR()`, `=MAIÚSCULA()`, `=NÚM.CARACT()`, `=ESQUERDA()`."
      exercicios:
        - "Leia uma frase e conte quantas vogais ela tem."
        - "Leia uma palavra e informe se ela é um palíndromo."
        - "Leia nome e sobrenome e gere um e-mail institucional no formato `nome.sobrenome@escola.br`, em minúsculas."

    - n: 26
      tema: "Listas: criação, índices e leitura"
      ferramentas: [Planilhas, Python, Scratch, Python Tutor]
      objetivo: "Guardar vários valores numa lista, acessar por índice e preenchê-la com um laço."
      material:
        - "Python: `notas = []`, `notas.append(valor)`, `notas[0]`, `notas[-1]`, `len(notas)`."
        - "Scratch: *Criar uma lista*; Planilhas: um intervalo (`A2:A11`) como lista."
        - "Python Tutor para visualizar a lista crescendo."
      exercicios:
        - "Leia os nomes de 5 colegas, guarde numa lista e mostre-os em ordem inversa."
        - "Leia 6 temperaturas e mostre a primeira, a última e a do meio."
