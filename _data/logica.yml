      resolvida:
        id: "A3-2025.2-QI"
        rotulo: "Avaliação 3 – 2025.2, Questão I"
        titulo: "A mensagem pode ter sido escrita por alienígenas?"
        pdf: "avaliacao_3_ano_2025_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2025_2.pdf"
        solucao: "a3_2025_2_q1.c"
        codigo: "// A3-2025.2 – Questão I: A mensagem pode ter sido escrita por alienígenas?\n#include <stdio.h>                                      // printf e fgets\n\nvoid tira_enter(char s[]) {                             // troca o '\\n' que o fgets guarda por '\\0'\n    for (int i = 0; s[i] != '\\0'; i++)                  // procura o Enter\n        if (s[i] == '\\n') s[i] = '\\0';                  // achou: a string termina aqui\n}\n\nint contem(char s[], char c) {                          // 1 se o caractere c aparece em s\n    for (int i = 0; s[i] != '\\0'; i++)                  // percorre s\n        if (s[i] == c) return 1;                        // achou\n    return 0;                                           // chegou ao fim sem achar\n}\n\nint main(void) {                                        // início do programa\n    char alfabeto[100], msg[1001];                      // símbolos alienígenas e mensagem interceptada\n    printf(\"Alfabeto: \");                               // pede o alfabeto\n    fgets(alfabeto, sizeof alfabeto, stdin);            // lê a linha\n    tira_enter(alfabeto);                               // remove o Enter do fim\n    printf(\"Mensagem: \");                               // pede a mensagem\n    fgets(msg, sizeof msg, stdin);                      // lê a linha\n    tira_enter(msg);                                    // remove o Enter\n    int pode = 1;                                       // supõe que sim\n    for (int i = 0; msg[i] != '\\0'; i++)                // cada símbolo da mensagem\n        if (!contem(alfabeto, msg[i])) pode = 0;        // símbolo fora do alfabeto\n    if (pode) printf(\"A mensagem pode ter sido escrita por alienígenas\\n\"); // nenhuma regra foi violada\n    else printf(\"A mensagem não pode ter sido escrita por alienígenas\\n\"); // alguma regra foi violada\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A3-2019.1-QI"
        rotulo: "Avaliação 3 – 2019.1, Questão I"
        titulo: "Faixas de letras"
        pdf: "avaliacao_3_ano_2019_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2019_1.pdf"
        solucao: "a3_2019_1_q1.c"
        codigo: "// A3-2019.1 – Questão I: Faixas de letras\n#include <stdio.h>                                      // printf e fgets\n\nint main(void) {                                        // início do programa\n    char s[1001];                                       // texto com letras minúsculas e espaços\n    printf(\"Texto: \");                                  // pede o texto\n    fgets(s, sizeof s, stdin);                          // lê a linha\n    int tem[26] = {0};                                  // tem[k] = 1 se a letra 'a' + k aparece\n    for (int i = 0; s[i] != '\\0'; i++)                  // marca as letras presentes\n        if (s[i] >= 'a' && s[i] <= 'z') tem[s[i] - 'a'] = 1;   // ignora espaços e duplicadas\n    for (int k = 0; k < 26; k++) {                      // percorre o alfabeto\n        if (tem[k] && (k == 0 || !tem[k - 1])) {        // começo de faixa: tem a letra, mas não a anterior\n            int fim = k;                                // estende enquanto as próximas letras existirem\n            while (fim + 1 < 26 && tem[fim + 1]) fim++; // anda até o fim da faixa\n            printf(\"%c:%c \", 'a' + k, 'a' + fim);       // imprime a faixa\n        }\n    }\n    printf(\"\\n\");                                       // termina a linha\n    return 0;                                           // fim sem erro\n}"
