      resolvida:
        id: "A3-2019.1-QII"
        rotulo: "Avaliação 3 – 2019.1, Questão II"
        titulo: "Expressão em letras para número de telefone"
        pdf: "avaliacao_3_ano_2019_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2019_1.pdf"
        solucao: "a3_2019_1_q2.c"
        codigo: "// A3-2019.1 – Questão II: Expressão em letras para número de telefone\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    char s[101];                                        // expressão (A-Z, hífens, 1 e 0)\n    printf(\"Expressão: \");                              // pede a expressão\n    scanf(\"%100s\", s);                                  // lê sem espaços\n    //                    ABCDEFGHIJKLMNOPQRSTUVWXYZ\n    const char *tabela = \"22233344455566677778889999\";  // tabela[letra - 'A'] dá o dígito da tecla\n    for (int i = 0; s[i] != '\\0'; i++) {                // percorre a expressão\n        if (s[i] >= 'A' && s[i] <= 'Z') s[i] = tabela[s[i] - 'A'];   // letra vira dígito\n    }                                                   // hífen, 1 e 0 ficam como estão\n    printf(\"%s\\n\", s);                                  // 1-527-3623-527\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A4-2024.2-QI"
        rotulo: "Avaliação Final – 2024.2, Questão I"
        titulo: "Hexadecimal (string) para decimal"
        pdf: "avaliacao_4_ano_2024_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_4_ano_2024_2.pdf"
        solucao: "a4_2024_2_q1.c"
        codigo: "// A4-2024.2 – Questão I: Hexadecimal (string) para decimal\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    char hex[256];                                      // até 255 caracteres\n    printf(\"Hexadecimal: \");                            // pede o número\n    scanf(\"%255s\", hex);                                // lê a string\n    unsigned long long valor = 0;                       // maior inteiro sem sinal do C\n    for (int i = 0; hex[i] != '\\0'; i++) {              // da esquerda para a direita (método de Horner)\n        int d;                                          // valor do dígito atual\n        if (hex[i] >= '0' && hex[i] <= '9') d = hex[i] - '0';        // '7' - '0' = 7\n        else if (hex[i] >= 'A' && hex[i] <= 'F') d = hex[i] - 'A' + 10;   // 'B' - 'A' + 10 = 11\n        else { printf(\"Dígito inválido: %c\\n\", hex[i]); return 1; }  // qualquer outro caractere\n        valor = valor * 16 + d;                         // desloca uma casa hexadecimal e soma o dígito\n    }\n    printf(\"%llu\\n\", valor);                            // %llu imprime unsigned long long\n    return 0;                                           // fim sem erro\n}"
    - n: 29
      tema: "Palavras numa frase"
      tipo: "aula"
      objetivo: "Separar as palavras de uma frase com uma variável de estado (dentro/fora de palavra)."
      slides: "aula29.pdf"
      conceitos:
        - "Estado `dentro`: 1 quando o caractere anterior era letra"
        - "Começo de palavra: letra com `dentro == 0`"
        - "Fim de palavra: não-letra (ou `'\\0'`) com `dentro == 1`"
        - "É letra: `(c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')`"
      resolvida:
        id: "A4-2026.1-QI"
        rotulo: "Avaliação Final – 2026.1, Questão I"
        titulo: "Porcentagem de palavras que contêm uma letra"
        pdf: "avaliacao_4_ano_2026_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_4_ano_2026_1.pdf"
        solucao: "a4_2026_1_q1.c"
        codigo: "// A4-2026.1 – Questão I: Porcentagem de palavras que contêm uma letra\n#include <stdio.h>                                      // printf e fgets\n\nint minuscula(char c) {                                 // 'A'..'Z' vira 'a'..'z'; o resto fica igual\n    if (c >= 'A' && c <= 'Z') return c - 'A' + 'a';     // na tabela ASCII, as letras são consecutivas\n    return c;                                           // já é minúscula (ou não é letra)\n}\n\nint e_letra(char c) {                                   // 1 se c for uma letra sem acento\n    return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z');   // letras são consecutivas na tabela ASCII\n}\n\nint main(void) {                                        // início do programa\n    char letra;                                         // letra procurada\n    char texto[257];                                    // até 256 caracteres\n    printf(\"Letra: \");                                  // pede a letra\n    scanf(\" %c\", &letra);                               // o espaço antes de %c pula espaços e Enters\n    getchar();                                          // consome o Enter que sobrou\n    printf(\"Texto: \");                                  // pede o texto\n    fgets(texto, sizeof texto, stdin);                  // lê a linha inteira\n    letra = minuscula(letra);              // compara sem diferenciar maiúsculas\n    int palavras = 0, com_letra = 0;                    // contadores\n    int dentro = 0, achou = 0;                          // estou dentro de uma palavra? ela já tem a letra?\n    for (int i = 0; ; i++) {                            // percorre até o '\\0' (tratado no fim)\n        if (e_letra(texto[i])) {         // letra: faz parte de uma palavra\n            if (!dentro) { dentro = 1; achou = 0; }     // começou uma palavra nova\n            if (minuscula(texto[i]) == letra) achou = 1;   // a palavra contém a letra\n        } else {                                        // espaço, Enter ou fim: termina a palavra\n            if (dentro) {                               // havia uma palavra aberta\n                palavras++;                             // conta a palavra\n                if (achou) com_letra++;                 // e se ela tinha a letra\n                dentro = 0;                             // fecha a palavra\n            }\n            if (texto[i] == '\\0') break;                // fim do texto\n        }\n    }\n    printf(\"%d/%d = %.2f\\n\", com_letra, palavras, palavras ? (double)com_letra / palavras : 0.0); // proporção (evita divisão por zero)\n    return 0;                                           // fim sem erro\n}"
