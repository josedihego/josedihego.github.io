      questoes:
        - id: "A4-2025.1-QI"
          rotulo: "Avaliação Final – 2025.1, Questão I"
          titulo: "Alcance da lava do vulcão (mapa 8 x 8)"
          pdf: "avaliacao_4_ano_2025_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_4_ano_2025_1.pdf"
          solucao: "a4_2025_1_q1.c"
          codigo: "// A4-2025.1 – Questão I: Alcance da lava do vulcão (mapa 8 x 8)\n#include <stdio.h>                                      // printf e scanf\n#define N 8                                             // mapa da prova\n\nint main(void) {                                        // início do programa\n    char mapa[N][N + 1];                                // altitudes '1' a '9' (cada linha é uma string)\n    int forca;                                          // força da erupção (0 a 9)\n    for (int i = 0; i < N; i++) scanf(\"%s\", mapa[i]);   // lê as 8 linhas\n    scanf(\"%d\", &forca);                                // lê a força\n    if (mapa[0][0] - '0' <= forca) mapa[0][0] = '*';    // a erupção começa no canto superior esquerdo\n    int mudou = 1;                                      // repete enquanto a lava avançar\n    while (mudou) {                                     // propagação até estabilizar\n        mudou = 0;                                      // nada mudou nesta passada (ainda)\n        for (int i = 0; i < N; i++) {                   // cada posição\n            for (int j = 0; j < N; j++) {               // cada coluna\n                if (mapa[i][j] == '*' || mapa[i][j] - '0' > forca) continue;   // já invadida ou alta demais\n                int vizinho = (i > 0 && mapa[i - 1][j] == '*') || (i < N - 1 && mapa[i + 1][j] == '*') || // vizinho invadido acima ou abaixo...\n                              (j > 0 && mapa[i][j - 1] == '*') || (j < N - 1 && mapa[i][j + 1] == '*');   // acima, abaixo, esquerda, direita\n                if (vizinho) { mapa[i][j] = '*'; mudou = 1; }   // invadida a partir de um vizinho\n            }\n        }\n    }\n    for (int i = 0; i < N; i++) printf(\"%s\\n\", mapa[i]); // mapa final\n    return 0;                                           // fim sem erro\n}"
        - id: "A4-2024.2-QII"
          rotulo: "Avaliação Final – 2024.2, Questão II"
          titulo: "Plano de construção da pirâmide"
          pdf: "avaliacao_4_ano_2024_2.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_4_ano_2024_2.pdf"
          solucao: "a4_2024_2_q2.c"
          codigo: "// A4-2024.2 – Questão II: Plano de construção da pirâmide\n#include <stdio.h>                                      // printf e scanf\n#define MAX 100                                         // dimensão máxima\n\nint main(void) {                                        // início do programa\n    int n, plano[MAX][MAX];                             // dimensão e plano de construção\n    scanf(\"%d\", &n);                                    // lê a dimensão\n    for (int i = 0; i < n; i++) {                       // cada posição da base\n        for (int j = 0; j < n; j++) {                   // cada coluna\n            int borda = i;                              // distância até a borda mais próxima\n            if (j < borda) borda = j;                   // borda esquerda\n            if (n - 1 - i < borda) borda = n - 1 - i;   // borda de baixo\n            if (n - 1 - j < borda) borda = n - 1 - j;   // borda direita\n            plano[i][j] = borda + 1;                    // cada camada recua uma casa: altura = distância + 1\n        }\n    }\n    for (int i = 0; i < n; i++) {                       // imprime o plano\n        for (int j = 0; j < n; j++) printf(\"%d \", plano[i][j]); // valores separados por espaço\n        printf(\"\\n\");                                   // fim da linha\n    }\n    return 0;                                           // fim sem erro\n}"
