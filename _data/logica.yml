      resolvida:
        id: "A1-2015.2-QIII-B"
        rotulo: "Avaliação 1 – 2015.2 (versão B), Questão III"
        titulo: "Número de lâmpadas de 60 W para um cômodo"
        pdf: "avaliacao_1_ano_2015_2_B.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2015_2_B.pdf"
        solucao: "a1_2015_2_b_q3.c"
        codigo: "// A1-2015.2 (B) – Questão III: Número de lâmpadas de 60 W para um cômodo\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int classe;                                         // 1 (I), 2 (II) ou 3 (III)\n    double largura, comprimento;                        // dimensões do cômodo em metros\n    printf(\"Classe (1, 2 ou 3), largura e comprimento: \");   // pede os dados\n    scanf(\"%d %lf %lf\", &classe, &largura, &comprimento);    // lê os três valores\n    int watts_m2;                                       // potência mínima por m² da classe\n    if (classe == 1) watts_m2 = 12;                     // quarto, sala de TV\n    else if (classe == 2) watts_m2 = 15;                // sala, cozinha, varanda\n    else if (classe == 3) watts_m2 = 20;                // banheiro, escritório\n    else { printf(\"Classe inválida\\n\"); return 1; }     // qualquer outro valor é erro\n    double potencia = largura * comprimento * watts_m2; // potência total exigida\n    int lampadas = (int)(potencia / 60);                // parte inteira: 2,4 lâmpadas viram 2...\n    if (lampadas * 60 < potencia) lampadas++;           // ...e se sobrou potência, mais uma: arredonda para cima\n    printf(\"%d lâmpada(s) de 60 W\\n\", lampadas);        // resultado\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2026.2-QIb"
        rotulo: "Avaliação 1 – 2026.2, Questão I"
        titulo: "Zip – quem ganhou a partida?"
        pdf: "avaliacao_1_ano_2026_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2026_2.pdf"
        solucao: "a1_2026_2_q1b.c"
        codigo: "// A1-2026.2 – Questão I: Zip – quem ganhou a partida?\n#include <stdio.h>                                      // printf e scanf\n#include <stdlib.h>                                     // abs\n\nint main(void) {                                        // início do programa\n    int a, b, c, d;                                     // cartas de Lia (a, b) e de Mia (c, d)\n    printf(\"Cartas de Lia e de Mia: \");                 // pede as quatro cartas\n    scanf(\"%d %d %d %d\", &a, &b, &c, &d);               // lê as quatro cartas\n    int lia = a + b;                                    // pontuação básica: a soma\n    if (a == b) lia = lia * 2;                          // cartas iguais: dobra\n    else if (abs(a - b) == 1) lia = lia * 3;            // consecutivas (diferença 1): triplica\n    int mia = c + d;                                    // a mesma regra para Mia\n    if (c == d) mia = mia * 2;                          // cartas iguais\n    else if (abs(c - d) == 1) mia = mia * 3;            // consecutivas\n    if (lia > mia) printf(\"Lia\\n\");                     // maior pontuação vence\n    else if (mia > lia) printf(\"Mia\\n\");                // idem\n    else printf(\"empate\\n\");                            // iguais: aposta acumula\n    return 0;                                           // fim sem erro\n}"
