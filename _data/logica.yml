          pdf: "avaliacao_1_ano_2022_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2022_1.pdf"
          solucao: "a1_2022_1_q2.c"
          codigo: "// A1-2022.1 – Questão II: Relógio de Chronos – hora a partir dos ângulos dos ponteiros\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int ang_hora, ang_min;                              // ângulos dos ponteiros de hora e de minutos (graus)\n    printf(\"Ângulos (hora minuto): \");                  // pede os ângulos\n    scanf(\"%d %d\", &ang_hora, &ang_min);                // lê os dois inteiros\n    int horas = ang_hora / 30;                          // 360 graus / 12 horas = 30 graus por hora\n    int minutos = ang_min / 6;                          // 360 graus / 60 minutos = 6 graus por minuto\n    printf(\"%02d:%02d\\n\", horas, minutos);              // %02d completa com zero à esquerda\n    return 0;                                           // fim sem erro\n}"
        - id: "A4-2025.1-QII"
          rotulo: "Avaliação Final – 2025.1, Questão II"
          titulo: "Quantos retângulos (blocos consecutivos) somam exatamente K"
          pdf: "avaliacao_4_ano_2025_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_4_ano_2025_1.pdf"
          solucao: "a4_2025_1_q2.c"
          codigo: "// A4-2025.1 – Questão II: Quantos retângulos (blocos consecutivos) somam exatamente K\n#include <stdio.h>                                      // printf e scanf\n#define N 10                                            // quadrados na prova\n\nint main(void) {                                        // início do programa\n    int v[N], k;                                        // números dos quadrados e soma procurada\n    for (int i = 0; i < N; i++) scanf(\"%d\", &v[i]);     // lê os N números\n    scanf(\"%d\", &k);                                    // lê K\n    int quantos = 0;                                    // contador de retângulos\n    for (int ini = 0; ini < N; ini++) {                 // primeiro quadrado do retângulo\n        int soma = 0;                                   // soma de v[ini..fim]\n        for (int fim = ini; fim < N; fim++) {           // último quadrado\n            soma += v[fim];                             // inclui mais um quadrado\n            if (soma == k) quantos++;                   // achou um retângulo\n            if (soma > k) break;                        // naturais: a soma só cresce, pode parar\n        }\n    }\n    printf(\"%d retângulos\\n\", quantos);                 // resultado\n    return 0;                                           // fim sem erro\n}"
