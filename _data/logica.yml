      resolvida:
        id: "A3-2024.2-QI"
        rotulo: "Avaliação 3 – 2024.2, Questão I"
        titulo: "Max pooling com filtro F x F e passo F"
        pdf: "avaliacao_3_ano_2024_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2024_2.pdf"
        solucao: "a3_2024_2_q1.c"
        codigo: "// A3-2024.2 – Questão I: Max pooling com filtro F x F e passo F\n#include <stdio.h>                                      // printf e scanf\n#define MAX 100                                         // maior imagem aceita\n\nint main(void) {                                        // início do programa\n    int n, f, img[MAX][MAX];                            // dimensão da imagem, do filtro e a imagem\n    scanf(\"%d %d\", &n, &f);                             // lê N e F (N múltiplo de F)\n    for (int i = 0; i < n; i++)                         // lê a imagem\n        for (int j = 0; j < n; j++) scanf(\"%d\", &img[i][j]); // cada coluna\n    for (int bi = 0; bi < n; bi += f) {                 // linha de início de cada bloco (passo F)\n        for (int bj = 0; bj < n; bj += f) {             // coluna de início de cada bloco\n            int maior = img[bi][bj];                    // começa com o canto do bloco\n            for (int i = bi; i < bi + f; i++)           // percorre o bloco F x F\n                for (int j = bj; j < bj + f; j++)       // colunas do bloco\n                    if (img[i][j] > maior) maior = img[i][j];   // guarda o máximo\n            printf(\"%d \", maior);                       // um valor por bloco\n        }\n        printf(\"\\n\");                                   // fim de uma linha de blocos\n    }\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A3-2025.1-QII"
        rotulo: "Avaliação 3 – 2025.1, Questão II"
        titulo: "Imagem RGB para tons de cinza (na prova, 100 x 100 x 3)"
        pdf: "avaliacao_3_ano_2025_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2025_1.pdf"
        solucao: "a3_2025_1_q2.c"
        codigo: "// A3-2025.1 – Questão II: Imagem RGB para tons de cinza (na prova, 100 x 100 x 3)\n#include <stdio.h>                                      // printf e scanf\n#define MAX 100                                         // dimensão da prova\n\nint img[MAX][MAX][3];                                   // global: 100 x 100 x 3 inteiros não cabem bem na pilha\n\nint main(void) {                                        // início do programa\n    int linhas, colunas;                                // dimensões (100 e 100 na prova)\n    scanf(\"%d %d\", &linhas, &colunas);                  // lê as dimensões\n    for (int i = 0; i < linhas; i++)                    // cada pixel\n        for (int j = 0; j < colunas; j++)               // cada coluna\n            for (int c = 0; c < 3; c++) scanf(\"%d\", &img[i][j][c]);   // canais R, G e B\n    for (int i = 0; i < linhas; i++) {                  // imprime a imagem cinza\n        for (int j = 0; j < colunas; j++) {             // cada coluna\n            double cinza = 0.299 * img[i][j][0] + 0.587 * img[i][j][1] + 0.114 * img[i][j][2];   // luminância\n            printf(\"%d \", (int)(cinza + 0.5));          // + 0.5 e truncar = arredondar\n        }\n        printf(\"\\n\");                                   // fim da linha\n    }\n    return 0;                                           // fim sem erro\n}"
    - n: 32
      tema: "Simulação em grade"
      tipo: "aula"
      objetivo: "Simular movimentos ou propagação numa matriz de caracteres."
      slides: "aula32.pdf"
      conceitos:
        - "Cada linha da grade é uma string: `char g[N][M + 1]`"
        - "Andar: N → linha−1, S → linha+1, L → coluna+1, O → coluna−1"
        - "Antes de acessar, teste os limites: `0 <= l < N` e `0 <= c < M`"
        - "Ciclo: matriz `visitado`; voltar a uma casa visitada = laço infinito"
      resolvida:
        id: "A3-2025.2-QII"
        rotulo: "Avaliação 3 – 2025.2, Questão II"
        titulo: "Areia movediça – tempo até o tesouro ou tipo de derrota"
        pdf: "avaliacao_3_ano_2025_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2025_2.pdf"
        solucao: "a3_2025_2_q2.c"
        codigo: "// A3-2025.2 – Questão II: Areia movediça – tempo até o tesouro ou tipo de derrota\n#include <stdio.h>                                      // printf e scanf\n#define MAX 100                                         // maior arena aceita\n\nint main(void) {                                        // início do programa\n    int m;                                              // dimensão da arena\n    char mapa[MAX][MAX + 1];                            // cada linha é uma string (+1 para o '\\0')\n    int visitado[MAX][MAX] = {{0}};                     // marca as quadrículas já percorridas\n    scanf(\"%d\", &m);                                    // lê M\n    for (int i = 0; i < m; i++) scanf(\"%s\", mapa[i]);   // lê as M linhas (ex.: SSOS)\n    int l, c;                                           // posição inicial (linha, coluna)\n    scanf(\"%d %d\", &l, &c);                             // lê a posição do pouso\n    int minutos = 0;                                    // tempo decorrido\n    while (1) {                                         // anda até um dos três desfechos\n        if (l < 0 || l >= m || c < 0 || c >= m) { printf(\"Fora dos Limites\\n\"); break; }   // saiu da arena\n        if (mapa[l][c] == 'X') { printf(\"Tesouro em %d minutos\\n\", minutos); break; }      // vitória\n        if (visitado[l][c]) { printf(\"Preso na Areia\\n\"); break; }   // voltou a uma casa: ciclo para sempre\n        visitado[l][c] = 1;                             // marca a casa atual\n        char d = mapa[l][c];                            // direção do fluxo aqui\n        if (d == 'N') l--;                              // norte: sobe uma linha\n        else if (d == 'S') l++;                         // sul: desce\n        else if (d == 'L') c++;                         // leste: direita\n        else c--;                                       // oeste: esquerda\n        minutos++;                                      // uma quadrícula por minuto\n    }\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A3-2023.2-QI"
        rotulo: "Avaliação 3 – 2023.2, Questão I"
        titulo: "Gotejamento na parede com prateleiras"
        pdf: "avaliacao_3_ano_2023_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2023_2.pdf"
        solucao: "a3_2023_2_q1.c"
        codigo: "// A3-2023.2 – Questão I: Gotejamento na parede com prateleiras\n#include <stdio.h>                                      // printf e scanf\n#define MAX 100                                         // maior parede aceita\n\nint main(void) {                                        // início do programa\n    int n, m;                                           // linhas e colunas\n    char p[MAX][MAX + 1];                               // a parede: '.', '#' e 'o'\n    scanf(\"%d %d\", &n, &m);                             // lê as dimensões\n    for (int i = 0; i < n; i++) scanf(\"%s\", p[i]);      // lê cada linha\n    int mudou = 1;                                      // repete enquanto alguma casa virar 'o'\n    while (mudou) {                                     // aplica as regras até estabilizar\n        mudou = 0;                                      // nesta passada, ainda nada mudou\n        for (int i = 0; i < n; i++) {                   // cada linha\n            for (int j = 0; j < m; j++) {               // cada coluna\n                if (p[i][j] != '.') continue;           // só a parede vazia pode molhar\n                int cai = i > 0 && p[i - 1][j] == 'o';                                   // água logo acima\n                int esq = j > 0 && i + 1 < n && p[i][j - 1] == 'o' && p[i + 1][j - 1] == '#';   // escorre da esquerda sobre prateleira\n                int dir = j + 1 < m && i + 1 < n && p[i][j + 1] == 'o' && p[i + 1][j + 1] == '#'; // escorre da direita\n                if (cai || esq || dir) { p[i][j] = 'o'; mudou = 1; }   // molhou: talvez molhe vizinhos na próxima passada\n            }\n        }\n    }\n    for (int i = 0; i < n; i++) printf(\"%s\\n\", p[i]);   // padrão final\n    return 0;                                           // fim sem erro\n}"
    - n: 33
      tema: "Busca em grade de caracteres"
      tipo: "aula"
      objetivo: "Procurar padrões em linhas e colunas de uma grade."
      slides: "aula33.pdf"
      conceitos:
        - "Para cada posição inicial, compare a palavra letra a letra"
        - "Horizontal: `g[i][j + k]`; vertical: `g[i + k][j]`"
        - "Cheque antes se a palavra cabe: `j + t <= n` e `i + t <= m`"
        - "Por colunas: percorra `k` nas linhas fixando a coluna"
      resolvida:
        id: "A3-2023.1-QI"
        rotulo: "Avaliação 3 – 2023.1, Questão I"
        titulo: "Caça-palavras (horizontal e vertical) – pontuação"
        pdf: "avaliacao_3_ano_2023_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2023_1.pdf"
        solucao: "a3_2023_1_q1.c"
        codigo: "// A3-2023.1 – Questão I: Caça-palavras (horizontal e vertical) – pontuação\n#include <stdio.h>                                      // printf e scanf\n#define MAX 100                                         // maior grade aceita\n\nint main(void) {                                        // início do programa\n    int m, n;                                           // linhas e colunas da grade\n    char g[MAX][MAX + 1], palavra[MAX + 1];             // grade e palavra procurada\n    scanf(\"%d %d\", &m, &n);                             // lê as dimensões\n    for (int i = 0; i < m; i++) scanf(\"%s\", g[i]);      // lê as linhas da grade\n    scanf(\"%s\", palavra);                               // lê a palavra\n    int t = 0, achou = 0;                               // tamanho da palavra e resultado\n    while (palavra[t] != '\\0') t++;                     // conta as letras até o '\\0'\n    for (int i = 0; i < m && !achou; i++) {             // cada posição inicial\n        for (int j = 0; j < n && !achou; j++) {         // (para assim que achar)\n            int h = j + t <= n, v = i + t <= m;         // cabe na horizontal? na vertical?\n            for (int k = 0; k < t; k++) {               // compara letra a letra\n                if (h && g[i][j + k] != palavra[k]) h = 0;   // falhou na horizontal (anda pela coluna)\n                if (v && g[i + k][j] != palavra[k]) v = 0;   // falhou na vertical (anda pela linha)\n            }\n            if (h || v) achou = 1;                      // encontrou em alguma direção\n        }\n    }\n    printf(\"%d pontos\\n\", achou ? t : -5);              // tamanho da palavra ou -5\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A3-2023.1-QII"
        rotulo: "Avaliação 3 – 2023.1, Questão II"
        titulo: "Consenso de cinco fitas de DNA"
        pdf: "avaliacao_3_ano_2023_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2023_1.pdf"
        solucao: "a3_2023_1_q2.c"
        codigo: "// A3-2023.1 – Questão II: Consenso de cinco fitas de DNA\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    char f[5][9];                                       // 5 fitas de até 8 caracteres\n    for (int k = 0; k < 5; k++) scanf(\"%8s\", f[k]);     // lê as fitas\n    const char *bases = \"ACGT\";                         // as quatro enzimas\n    int t = 0;                                          // tamanho das fitas (todas iguais)\n    while (f[0][t] != '\\0') t++;                        // conta até o '\\0'\n    for (int i = 0; i < t; i++) {                       // cada posição da fita\n        int conta[4] = {0};                             // frequência de A, C, G, T nesta posição\n        for (int k = 0; k < 5; k++)                     // olha a posição i nas 5 fitas\n            for (int b = 0; b < 4; b++)                 // compara com cada uma das 4 bases\n                if (f[k][i] == bases[b]) conta[b]++;    // conta a enzima encontrada\n        int melhor = 0, empate = 0;                     // índice da mais frequente e se há empate\n        for (int b = 1; b < 4; b++) {                   // procura a maior contagem\n            if (conta[b] > conta[melhor]) { melhor = b; empate = 0; }   // nova maior: desfaz empate\n            else if (conta[b] == conta[melhor]) empate = 1;             // igual à maior: empate\n        }\n        printf(\"%c\", empate ? '?' : bases[melhor]);     // '?' quando não há consenso\n    }\n    printf(\"\\n\");                                       // fim da fita\n    return 0;                                           // fim sem erro\n}"
    - n: 34
      tema: "Tabelas de dados: linhas de matriz e vetores paralelos"
      tipo: "aula"
      objetivo: "Guardar registros (vários dados de um mesmo item) em linhas de matriz ou em vetores paralelos."
      slides: "aula34.pdf"
      conceitos:
        - "Registro: cada item é uma **linha** e cada dado, uma **coluna**: `tab[i][0]`, `tab[i][1]`"
        - "Vetores paralelos: `pressao[i]`, `glicemia[i]` e `risco[i]` falam do mesmo paciente i"
        - "Varrer a tabela: um laço nas linhas, comparando com o item novo"
        - "Lista sem repetição: procure antes de inserir em `v[total++]`"
        - "`abs` (valor absoluto) vem de `<stdlib.h>`"
      resolvida:
        id: "A4-2026.1-QII"
        rotulo: "Avaliação Final – 2026.1, Questão II"
        titulo: "Classificador por vizinhança (distância de Manhattan)"
        pdf: "avaliacao_4_ano_2026_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_4_ano_2026_1.pdf"
        solucao: "a4_2026_1_q2.c"
        codigo: "// A4-2026.1 – Questão II: Classificador por vizinhança (distância de Manhattan)\n#include <stdio.h>                                      // printf e scanf\n#include <stdlib.h>                                     // abs\n#define MAX 100                                         // a prova usa M = 10\n\nint main(void) {                                        // início do programa\n    int m, tab[MAX][3];                                 // pacientes: pressão, glicemia, risco (+1 ou -1)\n    scanf(\"%d\", &m);                                    // lê M (10 na prova)\n    for (int i = 0; i < m; i++)                         // lê a tabela M x 3\n        scanf(\"%d %d %d\", &tab[i][0], &tab[i][1], &tab[i][2]); // pressão, glicemia e risco do paciente i\n    int limiar, pressao, glicemia;                      // parâmetro e dados do novo paciente\n    scanf(\"%d %d %d\", &limiar, &pressao, &glicemia);    // lê os três valores\n    int votos = 0;                                      // soma dos riscos dos vizinhos (+1 alto, -1 baixo)\n    for (int i = 0; i < m; i++) {                       // cada paciente anterior\n        int d = abs(pressao - tab[i][0]) + abs(glicemia - tab[i][1]);   // distância de Manhattan\n        if (d < limiar) votos += tab[i][2];             // vizinho (estritamente menor): vota\n    }\n    if (votos > 0) printf(\"ALTO RISCO\\n\");              // mais vizinhos de alto risco\n    else if (votos < 0) printf(\"BAIXO RISCO\\n\");        // mais vizinhos de baixo risco\n    else printf(\"INCONCLUSIVO\\n\");                      // empate (inclusive 0 a 0)\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2014.2-QIV"
        rotulo: "Avaliação 2 – 2014.2, Questão IV"
        titulo: "Lista de presença com números repetidos (na prova, 50 números)"
        pdf: "avaliacao_2_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2014_2.pdf"
        solucao: "a2_2014_2_q4.c"
        codigo: "// A2-2014.2 – Questão IV: Lista de presença com números repetidos (na prova, 50 números)\n#include <stdio.h>                                      // printf e scanf\n#define MAX 50                                          // tamanho da lista na prova\n\nint main(void) {                                        // início do programa\n    int n, lista[MAX];                                  // quantos números e a lista lida\n    int presentes[MAX], total = 0;                      // números sem repetição e quantos são\n    scanf(\"%d\", &n);                                    // lê N (50 na prova; ler N deixa testar com o exemplo)\n    for (int i = 0; i < n; i++) scanf(\"%d\", &lista[i]); // lê a lista de presença\n    for (int i = 0; i < n; i++) {                       // cada número da lista\n        int repetido = 0;                               // já está entre os presentes?\n        for (int j = 0; j < total; j++)                 // procura nos que já foram guardados\n            if (presentes[j] == lista[i]) repetido = 1; // achou: é repetição\n        if (!repetido) presentes[total++] = lista[i];   // primeira vez: guarda na próxima posição livre\n    }\n    printf(\"%d Alunos\\n\", total);                       // quantos receberam presença\n    for (int j = 0; j < total; j++)                     // na ordem em que apareceram\n        printf(\"%d - %d\\n\", j + 1, presentes[j]);       // posição e número de registro\n    return 0;                                           // fim sem erro\n}"
