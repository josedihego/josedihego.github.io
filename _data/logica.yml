    - n: 25
      tema: "Strings: vetor de char terminado em \\0"
      tipo: "aula"
      objetivo: "Ler, percorrer e comparar caracteres de uma string sem bibliotecas extras."
      slides: "aula25.pdf"
      conceitos:
        - "`char s[100];` guarda até 99 letras + o `'\\0'` final"
        - "Uma palavra: `scanf(\"%99s\", s)`; uma linha: `fgets(s, sizeof s, stdin)`"
        - "Percorrer: `for (i = 0; s[i] != '\\0'; i++)`"
        - "Caracteres são números (ASCII): letras são consecutivas, `'a' < 'b'`"
        - "Minúscula de uma maiúscula: `c - 'A' + 'a'` (escreva sua função)"
      resolvida:
        id: "A3-2023.2-QII"
        rotulo: "Avaliação 3 – 2023.2, Questão II"
        titulo: "Palavra ordenada (letras em ordem alfabética, sem diferenciar maiúsculas)"
        pdf: "avaliacao_3_ano_2023_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2023_2.pdf"
        solucao: "a3_2023_2_q2.c"
        codigo: "// A3-2023.2 – Questão II: Palavra ordenada (letras em ordem alfabética, sem diferenciar maiúsculas)\n#include <stdio.h>                                      // printf e scanf\n\nint minuscula(char c) {                                 // 'A'..'Z' vira 'a'..'z'; o resto fica igual\n    if (c >= 'A' && c <= 'Z') return c - 'A' + 'a';     // na tabela ASCII, as letras são consecutivas\n    return c;                                           // já é minúscula (ou não é letra)\n}\n\nint main(void) {                                        // início do programa\n    char p[100];                                        // a palavra (até 99 letras + '\\0')\n    printf(\"Palavra: \");                                // pede a palavra\n    scanf(\"%99s\", p);                                   // %99s: lê uma palavra sem estourar o vetor\n    int ordenada = 1;                                   // supõe ordenada até provar o contrário\n    for (int i = 1; p[i] != '\\0'; i++) {                // compara cada letra com a anterior\n        if (minuscula(p[i - 1]) > minuscula(p[i])) ordenada = 0;   // 'r' > 'o' em \"Flro\": fora de ordem\n    }\n    if (ordenada) printf(\"%s é ordenada\\n\", p);         // resultado\n    else printf(\"%s não é ordenada\\n\", p);              // resultado\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A3-2014.2-QII"
        rotulo: "Avaliação 3 – 2014.2, Questão II"
        titulo: "Encontros consonantais numa frase"
        pdf: "avaliacao_3_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2014_2.pdf"
        solucao: "a3_2014_2_q2.c"
        codigo: "// A3-2014.2 – Questão II: Encontros consonantais numa frase\n#include <stdio.h>                                      // printf e fgets\n\nint minuscula(char c) {                                 // 'A'..'Z' vira 'a'..'z'; o resto fica igual\n    if (c >= 'A' && c <= 'Z') return c - 'A' + 'a';     // na tabela ASCII, as letras são consecutivas\n    return c;                                           // já é minúscula (ou não é letra)\n}\n\nint e_letra(char c) {                                   // 1 se c for uma letra sem acento\n    return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z');   // letras são consecutivas na tabela ASCII\n}\n\nint consoante(char c) {                                 // 1 se c for uma letra sem acento que não é vogal\n    char m = minuscula(c);                              // compara sem diferenciar maiúsculas\n    return e_letra(c) && m != 'a' && m != 'e' && m != 'i' && m != 'o' && m != 'u';// letra que não é vogal\n}\n\nint main(void) {                                        // início do programa\n    char s[257];                                        // até 256 caracteres + '\\0'\n    printf(\"Frase: \");                                  // pede a frase\n    fgets(s, sizeof s, stdin);                          // lê a linha inteira (com espaços)\n    int encontros = 0, seguidas = 0;                    // total de encontros e consoantes seguidas agora\n    for (int i = 0; s[i] != '\\0'; i++) {                // percorre a frase\n        if (consoante(s[i])) {                          // mais uma consoante no grupo atual\n            seguidas++;                                 // conta\n            if (seguidas == 2) encontros++;             // a 2ª consoante seguida forma um encontro (conta uma vez)\n        } else {                                        // vogal, espaço, acento ou pontuação\n            seguidas = 0;                               // quebra o grupo\n        }\n    }\n    printf(\"%d encontros consonantais\\n\", encontros);   // istmo (stm), Stradun (Str), Brasil (Br)\n    return 0;                                           // fim sem erro\n}"
    - n: 26
      tema: "Vetor de contagem por letra"
      tipo: "aula"
      objetivo: "Indexar um vetor de 26 posições pela letra (`c - 'A'`)."
      slides: "aula26.pdf"
      conceitos:
        - "Índice da letra: `c - 'A'` (maiúscula) ou `c - 'a'` (minúscula), de 0 a 25"
        - "Volta: `'A' + k` é a letra de índice k"
        - "Contagem: `cont[k]++`; primeira posição: guardar só se ainda for −1"
        - "Inicialize com um laço quando o valor inicial não for 0"
      resolvida:
        id: "A3-2024.2-QII"
        rotulo: "Avaliação 3 – 2024.2, Questão II"
        titulo: "Posição da primeira ocorrência de cada letra"
        pdf: "avaliacao_3_ano_2024_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2024_2.pdf"
        solucao: "a3_2024_2_q2.c"
        codigo: "// A3-2024.2 – Questão II: Posição da primeira ocorrência de cada letra\n#include <stdio.h>                                      // printf e fgets\n\nint main(void) {                                        // início do programa\n    char s[1001];                                       // a string lida\n    printf(\"Texto: \");                                  // pede o texto\n    fgets(s, sizeof s, stdin);                          // lê a linha inteira\n    int primeira[26];                                   // primeira[k]: posição da 1ª ocorrência da letra 'A' + k\n    for (int k = 0; k < 26; k++) primeira[k] = -1;      // -1 = ainda não apareceu\n    for (int i = 0; s[i] != '\\0'; i++) {                // percorre o texto\n        int k = -1;                                     // índice da letra (−1: não é letra)\n        if (s[i] >= 'A' && s[i] <= 'Z') k = s[i] - 'A'; // maiúscula: 'O' - 'A' = 14\n        if (s[i] >= 'a' && s[i] <= 'z') k = s[i] - 'a'; // minúscula: 'o' - 'a' = 14\n        if (k != -1) {                                  // só letras (sem acento)\n            if (primeira[k] == -1) primeira[k] = i;     // guarda só a primeira vez\n        }\n    }\n    for (int k = 0; k < 26; k++)                        // de A a Z, em ordem\n        if (primeira[k] != -1) printf(\"%c(%d) \", 'A' + k, primeira[k]);   // só as letras que apareceram\n    printf(\"\\n\");                                       // termina a linha\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A3-2026.1-QII"
        rotulo: "Avaliação 3 – 2026.1, Questão II"
        titulo: "Assinatura de frequência (2N3A1B aceita BANANA)"
        pdf: "avaliacao_3_ano_2026_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_3_ano_2026_1.pdf"
        solucao: "a3_2026_1_q2.c"
        codigo: "// A3-2026.1 – Questão II: Assinatura de frequência (2N3A1B aceita BANANA)\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    char formula[60], palavra[33];                      // fórmula (ex.: 2N3A1B) e palavra-passe (até 32 letras)\n    printf(\"Fórmula e palavra: \");                      // pede as duas strings\n    scanf(\"%59s %32s\", formula, palavra);               // lê as duas palavras\n    int exigido[26] = {0}, contado[26] = {0};           // quantidade exigida e encontrada de cada letra\n    for (int i = 0; formula[i] != '\\0'; i += 2)         // a fórmula vem em pares: dígito + letra\n        exigido[formula[i + 1] - 'A'] = formula[i] - '0';   // '3' - '0' = 3; 'A' - 'A' = 0\n    for (int i = 0; palavra[i] != '\\0'; i++)            // conta as letras da palavra\n        contado[palavra[i] - 'A']++;                    // a letra vira índice\n    int aceita = 1;                                     // supõe aceita\n    for (int k = 0; k < 26; k++)                        // compara letra por letra\n        if (exigido[k] != contado[k]) aceita = 0;       // letra a mais, a menos ou fora da fórmula\n    printf(aceita ? \"ACEITO\\n\" : \"RECUSADO\\n\");         // resultado\n    return 0;                                           // fim sem erro\n}"
    - n: 27
      tema: "Validação de strings"
