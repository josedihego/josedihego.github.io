# Gerado por _tools/logica/gerar.py a partir de plano.py e questoes.json – não edite à mão
- bloco: 1
  titulo: "Sequência, aritmética e decisão"
  resumo: "Entrada e saída, tipos, `/` e `%`, dígitos, bases, `if`/`else`, `switch` e bits. Termina com a Avaliação I."
  aulas:
    - n: 1
      tema: "Primeiro programa: entrada, fórmula e saída"
      tipo: "aula"
      objetivo: "Escrever um programa completo que lê dados, aplica uma fórmula da prova e imprime o resultado formatado."
      slides: "aula01.pdf"
      conceitos:
        - "Esqueleto de todo programa: `#include <stdio.h>`, `int main(void) { ... return 0; }`"
        - "`int` guarda inteiros; `double` guarda reais. Na dúvida numa fórmula, use `double`"
        - "Leitura: `%d` para `int`, `%lf` para `double`. Impressão: `%d` e `%f` (`%.2f` = 2 casas)"
        - "`scanf` precisa do `&` antes da variável: ele recebe o **endereço** onde guardar"
        - "Cada fórmula do enunciado vira uma linha `variavel = expressão;`"
      resolvida:
        id: "A1-2014.2-QI"
        rotulo: "Avaliação 1 – 2014.2, Questão I"
        titulo: "Probabilidade de dois eventos independentes"
        pdf: "avaliacao_1_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2014_2.pdf"
        solucao: "a1_2014_2_q1.c"
        codigo: "// A1-2014.2 – Questão I: Probabilidade de dois eventos independentes\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    double pa, pb;                                      // probabilidades lidas (entre 0 e 1)\n    printf(\"P(A) e P(B): \");                            // pede as duas probabilidades\n    scanf(\"%lf %lf\", &pa, &pb);                         // %lf lê um double\n    double ambos = pa * pb;                             // P(A e B) = P(A) x P(B)\n    double algum = pa + pb - ambos;                     // P(A ou B) = P(A) + P(B) - P(A e B)\n    printf(\"P(A e B) = %.4f\\n\", ambos);                 // os dois eventos acontecem\n    printf(\"P(A ou B) = %.4f\\n\", algum);                // pelo menos um acontece\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2024.2-QI"
        rotulo: "Avaliação 1 – 2024.2, Questão I"
        titulo: "Área sombreada entre o quadrado e o círculo inscrito"
        pdf: "avaliacao_1_ano_2024_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2024_2.pdf"
        solucao: "a1_2024_2_q1.c"
        codigo: "// A1-2024.2 – Questão I: Área sombreada entre o quadrado e o círculo inscrito\n#include <stdio.h>                                      // printf e scanf\n#define PI 3.14                                         // o enunciado manda usar 3.14\n\nint main(void) {                                        // início do programa\n    double r;                                           // raio do círculo\n    printf(\"r: \");                                      // pede o raio\n    scanf(\"%lf\", &r);                                   // lê o raio\n    double lado = 2 * r;                                // o círculo inscrito toca os 4 lados: lado = diâmetro\n    double quadrado = lado * lado;                      // área do quadrado = lado²\n    double circulo = PI * r * r;                        // área do círculo = π r²\n    printf(\"Área sombreada: %.2f\\n\", quadrado - circulo);   // o que sobra do quadrado\n    return 0;                                           // fim sem erro\n}"
    - n: 2
      tema: "Aritmética em C: divisão inteira, resto e conversões"
      tipo: "aula"
      objetivo: "Usar `/`, `%` e a conversão para `double` para transformar unidades sem erros de truncamento."
      slides: "aula02.pdf"
      conceitos:
        - "`7 / 2` vale `3` (divisão inteira); `7 % 2` vale `1` (resto)"
        - "Basta um operando real para a conta ser real: `7 / 2.0` vale `3.5`"
        - "Conversão de unidades: total = maior × fator + menor (ex.: minutos = h × 60 + min)"
        - "Volta: `h = total / 60` e `min = total % 60`"
        - "Cast explícito: `(double)soma / n`"
      resolvida:
        id: "A1-2014.2-QII"
        rotulo: "Avaliação 1 – 2014.2, Questão II"
        titulo: "Graus, minutos e segundos para graus decimais"
        pdf: "avaliacao_1_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2014_2.pdf"
        solucao: "a1_2014_2_q2.c"
        codigo: "// A1-2014.2 – Questão II: Graus, minutos e segundos para graus decimais\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int graus, minutos, segundos;                       // coordenada lida\n    printf(\"Graus minutos segundos: \");                 // pede os três valores\n    scanf(\"%d %d %d\", &graus, &minutos, &segundos);     // lê os três inteiros\n    double decimal = graus + minutos / 60.0 + segundos / 3600.0;   // 60.0 e 3600.0: divisão real, não inteira\n    printf(\"%.5f graus decimais\\n\", decimal);           // 5 casas, como no exemplo da prova\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2012.2-QII"
        rotulo: "Avaliação 1 – 2012.2, Questão II"
        titulo: "Duração de uma aula (hora:minuto)"
        pdf: "avaliacao_1_ano_2012_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2012_2.pdf"
        solucao: "a1_2012_2_q2.c"
        codigo: "// A1-2012.2 – Questão II: Duração de uma aula (hora:minuto)\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int h1, m1, h2, m2;                                 // entrada (h1:m1) e saída (h2:m2)\n    printf(\"Entrada (h m) e saída (h m): \");            // pede os dois horários\n    scanf(\"%d %d %d %d\", &h1, &m1, &h2, &m2);           // lê os quatro inteiros\n    int inicio = h1 * 60 + m1;                          // tudo em minutos desde 00:00\n    int fim = h2 * 60 + m2;                             // idem para a saída\n    if (fim < inicio) fim = fim + 24 * 60;              // saiu depois da meia-noite: soma um dia\n    int duracao = fim - inicio;                         // duração em minutos\n    printf(\"Duração: %d:%02d\\n\", duracao / 60, duracao % 60);   // / dá as horas, % os minutos restantes\n    return 0;                                           // fim sem erro\n}"
    - n: 3
      tema: "Extraindo dígitos com / e %"
      tipo: "aula"
      objetivo: "Separar os dígitos de um número com divisões por 10 e usar o resto para contas circulares."
      slides: "aula03.pdf"
      conceitos:
        - "`n % 10` é o último dígito; `n / 10` remove o último dígito"
        - "Dígito da posição k (da direita, começando em 0): `(n / 10^k) % 10`"
        - "O resto também serve para \"dar a volta\": posição circular = `(inicio + passos) % tamanho`"
        - "Teste com um número em que todos os dígitos são diferentes, ex.: 1234"
      resolvida:
        id: "A1-2015.2-QI"
        rotulo: "Avaliação 1 – 2015.2, Questão I"
        titulo: "Soma dos dígitos centrais de um número de 4 dígitos"
        pdf: "avaliacao_1_ano_2015_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2015_2.pdf"
        solucao: "a1_2015_2_q1.c"
        codigo: "// A1-2015.2 – Questão I: Soma dos dígitos centrais de um número de 4 dígitos\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número menor que 9999\n    printf(\"Número: \");                                 // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int segundo = (n / 100) % 10;                       // 4326 / 100 = 43; 43 % 10 = 3\n    int terceiro = (n / 10) % 10;                       // 4326 / 10 = 432; 432 % 10 = 2\n    printf(\"Soma dos dígitos centrais: %d\\n\", segundo + terceiro);   // 3 + 2 = 5\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2026.2-QIa"
        rotulo: "Avaliação 1 – 2026.2, Questão I"
        titulo: "Ponto de término na pista circular"
        pdf: "avaliacao_1_ano_2026_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2026_2.pdf"
        solucao: "a1_2026_2_q1a.c"
        codigo: "// A1-2026.2 – Questão I: Ponto de término na pista circular\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    long c, n;                                          // distância do treino e comprimento da pista (metros)\n    printf(\"C (metros do treino) e N (comprimento da pista): \");   // pede os dados\n    scanf(\"%ld %ld\", &c, &n);                           // %ld lê long (treinos longos cabem)\n    printf(\"Deixe a garrafa a %ld metros da partida\\n\", c % n);    // voltas completas não importam: só o resto\n    return 0;                                           // fim sem erro\n}"
    - n: 4
      tema: "Bases numéricas: octal e binário"
      tipo: "aula"
      objetivo: "Converter entre bases usando dígitos e potências, validando a entrada."
      slides: "aula04.pdf"
      conceitos:
        - "Na base b, o número d₂d₁d₀ vale `d2*b*b + d1*b + d0`"
        - "Octal só tem dígitos de 0 a 7: valide cada dígito antes de converter"
        - "Para obter os dígitos binários de n: `n % 2`, depois `n = n / 2`, e repita"
        - "Os dígitos saem do menos significativo para o mais significativo"
      resolvida:
        id: "A1-2012.2-QI"
        rotulo: "Avaliação 1 – 2012.2, Questão I"
        titulo: "Octal (até 3 dígitos) para decimal"
        pdf: "avaliacao_1_ano_2012_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2012_2.pdf"
        solucao: "a1_2012_2_q1.c"
        codigo: "// A1-2012.2 – Questão I: Octal (até 3 dígitos) para decimal\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número octal digitado como inteiro (ex.: 435)\n    printf(\"Número octal: \");                           // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int d2 = n / 100;                                   // dígito das centenas (4)\n    int d1 = (n / 10) % 10;                             // dígito das dezenas (3)\n    int d0 = n % 10;                                    // dígito das unidades (5)\n    if (n < 0 || n > 777 || d2 > 7 || d1 > 7 || d0 > 7) {   // em octal só existem os dígitos 0 a 7\n        printf(\"Número octal inválido\\n\");              // avisa e termina\n        return 1;                                       // fim com erro\n    }\n    int decimal = d2 * 64 + d1 * 8 + d0;                // 4*8² + 3*8¹ + 5*8⁰\n    printf(\"(%d)8 = (%d)10\\n\", n, decimal);             // mostra a conversão\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2018.2-QI"
        rotulo: "Avaliação 1 – 2018.2, Questão I"
        titulo: "Quantos dígitos 1 tem o binário de um número entre 0 e 32"
        pdf: "avaliacao_1_ano_2018_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2018_2.pdf"
        solucao: "a1_2018_2_q1.c"
        codigo: "// A1-2018.2 – Questão I: Quantos dígitos 1 tem o binário de um número entre 0 e 32\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número entre 0 e 32 (cabe em 6 bits)\n    printf(\"Número (0 a 32): \");                        // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int uns = n % 2                                     // bit de peso 1\n            + (n / 2) % 2                               // bit de peso 2\n            + (n / 4) % 2                               // bit de peso 4\n            + (n / 8) % 2                               // bit de peso 8\n            + (n / 16) % 2                              // bit de peso 16\n            + (n / 32) % 2;                             // bit de peso 32\n    printf(\"%d dígito(s) 1\\n\", uns);                    // cada bit vale 0 ou 1: somar conta os uns\n    return 0;                                           // fim sem erro\n}"
    - n: 5
