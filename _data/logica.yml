- bloco: 2
  titulo: "Repetição, funções e vetores"
  resumo: "`while` e `for`, acumuladores, laços aninhados, funções, vetores, janelas e simulação. Termina com a Avaliação II."
  aulas:
    - n: 13
      tema: "while: repetir até uma condição"
      tipo: "aula"
      objetivo: "Repetir enquanto a condição for verdadeira e contar quantas vezes repetiu."
      slides: "aula13.pdf"
      conceitos:
        - "`while (condição) { ... }` testa **antes** de cada repetição"
        - "Algo dentro do laço precisa mudar a condição, senão é laço infinito"
        - "Contador: `anos = 0` antes, `anos++` dentro"
        - "A condição do `while` é o **contrário** da condição de parada"
      resolvida:
        id: "A2-2016.1-QI"
        rotulo: "Avaliação 2 – 2016.1, Questão I"
        titulo: "Em quantos anos Zé fica maior que Chico?"
        pdf: "avaliacao_2_ano_2016_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2016_1.pdf"
        solucao: "a2_2016_1_q1.c"
        codigo: "// A2-2016.1 – Questão I: Em quantos anos Zé fica maior que Chico?\n#include <stdio.h>                                      // printf\n\nint main(void) {                                        // início do programa\n    int chico = 150, ze = 110;                          // alturas em centímetros (inteiros evitam erro de arredondamento)\n    int anos = 0;                                       // contador de anos\n    while (ze <= chico) {                               // repete ENQUANTO Zé ainda não passou Chico\n        chico += 2;                                     // Chico cresce 2 cm por ano\n        ze += 3;                                        // Zé cresce 3 cm por ano\n        anos++;                                         // passou mais um ano\n    }\n    printf(\"Zé fica maior que Chico em %d anos (%d cm x %d cm)\\n\", anos, ze, chico);   // resultado\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2024.2-QI"
        rotulo: "Avaliação 2 – 2024.2, Questão I"
        titulo: "Tempo para o material radioativo chegar à massa final"
        pdf: "avaliacao_2_ano_2024_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2024_2.pdf"
        solucao: "a2_2024_2_q1.c"
        codigo: "// A2-2024.2 – Questão I: Tempo para o material radioativo chegar à massa final\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    double massa, final;                                // massa inicial e massa final desejada\n    printf(\"Massa inicial e massa final: \");            // pede os dados\n    scanf(\"%lf %lf\", &massa, &final);                   // lê os dois valores\n    int minutos = 0;                                    // contador de minutos\n    while (massa > final) {                             // ainda acima da massa desejada\n        massa = massa * 0.9;                            // perde 10% por minuto: sobra 90%\n        minutos++;                                      // passou um minuto\n    }\n    printf(\"Tempo necessário: %d minutos (massa = %.2f)\\n\", minutos, massa);   // resultado\n    return 0;                                           // fim sem erro\n}"
    - n: 14
      tema: "for e acumuladores: somatórios"
      tipo: "aula"
      objetivo: "Calcular somas de séries com `for` e um acumulador."
      slides: "aula14.pdf"
      conceitos:
        - "`for (int k = 1; k <= n; k++)`: início, condição, passo"
        - "Acumulador: `soma = 0` antes; `soma += termo` dentro"
        - "Um termo que depende do anterior: guarde-o numa variável (ex.: triangular += k)"
        - "Frações: `1.0 / t`, nunca `1 / t`"
      resolvida:
        id: "A2-2014.2-QIII"
        rotulo: "Avaliação 2 – 2014.2, Questão III"
        titulo: "Soma dos recíprocos dos números triangulares"
        pdf: "avaliacao_2_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2014_2.pdf"
        solucao: "a2_2014_2_q3.c"
        codigo: "// A2-2014.2 – Questão III: Soma dos recíprocos dos números triangulares\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // quantidade de termos\n    printf(\"N: \");                                      // pede N\n    scanf(\"%d\", &n);                                    // lê N\n    long triangular = 0;                                // número triangular atual\n    double soma = 0;                                    // acumulador da série (começa em zero)\n    for (int k = 1; k <= n; k++) {                      // k-ésimo termo\n        triangular += k;                                // o próximo triangular é o anterior + k\n        soma += 1.0 / triangular;                       // 1.0: divisão real (1 / 3 inteiro daria 0)\n    }\n    printf(\"S = %.6f\\n\", soma);                         // 1 + 1/3 + 1/6 + ...\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2014.2-QI"
        rotulo: "Avaliação 2 – 2014.2, Questão I"
        titulo: "Raiz quadrada subtraindo ímpares consecutivos"
        pdf: "avaliacao_2_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2014_2.pdf"
        solucao: "a2_2014_2_q1.c"
        codigo: "// A2-2014.2 – Questão I: Raiz quadrada subtraindo ímpares consecutivos\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número positivo\n    printf(\"Número: \");                                 // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int resto = n;                                      // vai sendo reduzido pelos ímpares\n    int vezes = 0;                                      // quantas subtrações foram feitas\n    for (int impar = 1; resto > 0; impar += 2) {        // 1, 3, 5, ... enquanto o resultado for positivo\n        resto -= impar;                                 // subtrai o próximo ímpar\n        vezes++;                                        // conta a subtração\n    }\n    if (resto == 0) printf(\"A raiz exata de %d é %d\\n\", n, vezes);   // terminou em zero: exata\n    else printf(\"A raiz aproximada de %d é %d\\n\", n, vezes);         // passou de zero: aproximada\n    return 0;                                           // fim sem erro\n}"
    - n: 15
      tema: "Laço sobre os dígitos"
      tipo: "aula"
      objetivo: "Percorrer os dígitos de um número de tamanho qualquer com `while (n > 0)`."
      slides: "aula15.pdf"
      conceitos:
        - "`while (n > 0) { d = n % 10; ...; n = n / 10; }` visita todos os dígitos"
        - "A ordem é da direita para a esquerda (unidade primeiro)"
        - "Posição do dígito: um contador que começa em 1"
        - "Em outra base b: troque 10 por b"
      resolvida:
        id: "A1-2014.2-QIV"
        rotulo: "Avaliação 1 – 2014.2, Questão IV"
        titulo: "Validação pelo algoritmo de Luhn (até 4 dígitos)"
        pdf: "avaliacao_1_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2014_2.pdf"
        solucao: "a1_2014_2_q4.c"
        codigo: "// A1-2014.2 – Questão IV: Validação pelo algoritmo de Luhn (até 4 dígitos)\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número de até 4 dígitos\n    printf(\"Número: \");                                 // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int soma = 0;                                       // somatório de Luhn\n    int posicao = 1;                                    // 1 = unidade (o primeiro após inverter)\n    while (n > 0) {                                     // percorre os dígitos da direita para a esquerda\n        int d = n % 10;                                 // dígito atual\n        if (posicao % 2 == 0) {                         // posições pares: dobra\n            d = d * 2;                                  // multiplica por 2\n            if (d > 9) d = d - 9;                       // \"noves fora\": 12 → 3, 16 → 7\n        }\n        soma += d;                                      // acumula\n        n = n / 10;                                     // descarta o dígito já tratado\n        posicao++;                                      // próxima posição\n    }\n    if (soma % 10 == 0) printf(\"Número Válido\\n\");      // somatório múltiplo de 10\n    else printf(\"Número Inválido\\n\");                   // senão, inválido\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2018.2-QII"
        rotulo: "Avaliação 1 – 2018.2, Questão II"
        titulo: "Dígito verificador da Setelândia (base 7)"
        pdf: "avaliacao_1_ano_2018_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2018_2.pdf"
        solucao: "a1_2018_2_q2.c"
        codigo: "// A1-2018.2 – Questão II: Dígito verificador da Setelândia (base 7)\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número de 0 a 999\n    printf(\"Número (0 a 999): \");                       // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int soma = 0;                                       // soma dos algarismos na base 7\n    int resto = n;                                      // cópia que será dividida\n    while (resto > 0) {                                 // conversão para base 7, dígito a dígito\n        soma += resto % 7;                              // o resto da divisão por 7 é o próximo dígito\n        resto = resto / 7;                              // passa para a próxima posição\n    }\n    int dv = soma % 7;                                  // dígito verificador\n    printf(\"%d%d\\n\", n, dv);                            // o DV vai à direita do número original\n    return 0;                                           // fim sem erro\n}"
