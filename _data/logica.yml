      resolvida:
        id: "A2-2025.2-QI"
        rotulo: "Avaliação 2 – 2025.2, Questão I"
        titulo: "Maior e menor média de temperatura em janelas de tamanho dado"
        pdf: "avaliacao_2_ano_2025_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2025_2.pdf"
        solucao: "a2_2025_2_q1.c"
        codigo: "// A2-2025.2 – Questão I: Maior e menor média de temperatura em janelas de tamanho dado\n#include <stdio.h>                                      // printf e scanf\n#define N 12                                            // quantidade de temperaturas\n\nint main(void) {                                        // início do programa\n    int t[N];                                           // temperaturas medidas\n    int janela;                                         // tamanho do intervalo\n    for (int i = 0; i < N; i++) scanf(\"%d\", &t[i]);     // lê as 12 temperaturas\n    scanf(\"%d\", &janela);                               // lê o tamanho do intervalo\n    double maior = -500, menor = 500;                   // o enunciado garante valores entre -500 e 500\n    for (int ini = 0; ini + janela <= N; ini++) {       // cada janela começa em ini\n        int soma = 0;                                   // soma da janela atual\n        for (int k = ini; k < ini + janela; k++) soma += t[k];   // soma os 'janela' valores\n        double media = (double)soma / janela;           // (double): divisão real\n        if (media > maior) maior = media;               // nova maior média\n        if (media < menor) menor = media;               // nova menor média\n    }\n    printf(\"Maior média: %.2f\\n\", maior);               // 28.00 no exemplo\n    printf(\"Menor média: %.2f\\n\", menor);               // -5.83 no exemplo\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2024.2-QII-D"
        rotulo: "Avaliação 1 – 2024.2 (versão D), Questão II"
        titulo: "Liga do Reizinho – pontos somando min + max de cada janela"
        pdf: "avaliacao_1_ano_2024_2_D.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2024_2_D.pdf"
        solucao: "a1_2024_2_d_q2.c"
        codigo: "// A1-2024.2 (D) – Questão II: Liga do Reizinho – pontos somando min + max de cada janela\n#include <stdio.h>                                      // printf e scanf\n#define P 5                                             // partidas do campeonato atual\n#define J 3                                             // tamanho da janela\n\nint main(void) {                                        // início do programa\n    int gols[P];                                        // gols em cada partida\n    for (int i = 0; i < P; i++) scanf(\"%d\", &gols[i]);  // lê os gols\n    int total = 0;                                      // pontuação acumulada\n    for (int ini = 0; ini <= P - J; ini++) {            // P - J + 1 janelas\n        int min = gols[ini], max = gols[ini];           // começa com o primeiro jogo da janela\n        for (int k = ini + 1; k < ini + J; k++) {       // demais jogos da janela\n            if (gols[k] < min) min = gols[k];           // menor da janela\n            if (gols[k] > max) max = gols[k];           // maior da janela\n        }\n        total += min + max;                             // pontos desta janela\n    }\n    printf(\"%d pontos\\n\", total);                       // (1+3) + (1+3) + (1+4) = 13 no exemplo\n    return 0;                                           // fim sem erro\n}"
    - n: 21
