        id: "A1-2024.2-QI-D"
        rotulo: "Avaliação 1 – 2024.2 (versão D), Questão I"
        titulo: "Sequência da soma dos quadrados dos dígitos até repetir"
        pdf: "avaliacao_1_ano_2024_2_D.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2024_2_D.pdf"
        solucao: "a1_2024_2_d_q1.c"
        codigo: "// A1-2024.2 (D) – Questão I: Sequência da soma dos quadrados dos dígitos até repetir\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // primeiro número (0 a 99)\n    printf(\"Número (0 a 99): \");                        // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    int visto[200] = {0};                               // visto[x] = 1 se x já apareceu (vetor como memória)\n    int seq[200], tam = 0;                              // a sequência gerada, para imprimir no fim\n    while (!visto[n]) {                                 // para quando o número se repetir (ciclo)\n        visto[n] = 1;                                   // marca como visto\n        seq[tam++] = n;                                 // guarda na sequência\n        int soma = 0;                                   // soma dos quadrados dos dígitos\n        for (int x = n; x > 0; x /= 10) soma += (x % 10) * (x % 10);   // dígito a dígito\n        if (soma >= 100) soma /= 2;                     // regra: 100 ou mais é dividido por 2\n        n = soma;                                       // próximo termo\n    }\n    printf(\"Sequência: \");                              // imprime o resultado\n    for (int i = 0; i < tam; i++) printf(\"%d%s\", seq[i], i < tam - 1 ? \", \" : \"\\n\"); // vírgula entre os termos, quebra de linha no último\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2016.2-QII"
        rotulo: "Avaliação 2 – 2016.2, Questão II"
        titulo: "Os 20 primeiros termos da sequência de Recamán"
        pdf: "avaliacao_2_ano_2016_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2016_2.pdf"
        solucao: "a2_2016_2_q2.c"
        codigo: "// A2-2016.2 – Questão II: Os 20 primeiros termos da sequência de Recamán\n#include <stdio.h>                                      // printf\n#define TAM 20                                          // trocar aqui muda o tamanho do vetor (mínimo impacto)\n\nint main(void) {                                        // início do programa\n    int a[TAM];                                         // os termos da sequência\n    a[0] = 0;                                           // A0 = 0\n    for (int n = 1; n < TAM; n++) {                     // calcula A1, A2, ...\n        int candidato = a[n - 1] - n;                   // tenta voltar n posições\n        int repetido = 0;                               // o candidato já está na sequência?\n        for (int k = 0; k < n; k++)                     // procura entre os termos anteriores\n            if (a[k] == candidato) repetido = 1;        // achou: não pode usar\n        if (candidato > 0 && !repetido) a[n] = candidato;   // positivo e novo: usa a subtração\n        else a[n] = a[n - 1] + n;                       // senão, avança n posições\n    }\n    for (int n = 0; n < TAM; n++) printf(\"%d%s\", a[n], n < TAM - 1 ? \", \" : \"\\n\");   // mostra o vetor\n    return 0;                                           // fim sem erro\n}"
