        solucao: "a1_2017_1_q3.c"
        codigo: "// A1-2017.1 – Questão III: Gangorra – equilibrada ou pende para qual lado?\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int p1, c1, p2, c2;                                 // pesos e comprimentos dos lados 1 e 2\n    printf(\"P1 C1 P2 C2: \");                            // pede os quatro valores\n    scanf(\"%d %d %d %d\", &p1, &c1, &p2, &c2);           // lê os quatro valores\n    int lado1 = p1 * c1;                                // momento do lado 1\n    int lado2 = p2 * c2;                                // momento do lado 2\n    if (lado1 == lado2) printf(\"A gangorra fica equilibrada\\n\");   // P1 x C1 = P2 x C2\n    else if (lado1 > lado2) printf(\"A gangorra pende para o lado 1\\n\");   // lado 1 mais \"pesado\"\n    else printf(\"A gangorra pende para o lado 2\\n\");    // senão, pende para o lado 2\n    return 0;                                           // fim sem erro\n}"
    - n: 8
      tema: "switch: escolha entre muitos casos"
      tipo: "aula"
      objetivo: "Usar `switch` para mapear valores a textos e combinar com `/` e `%`."
      slides: "aula08.pdf"
      conceitos:
        - "`switch (x) { case 1: ...; break; default: ...; }` compara `x` com constantes"
        - "Sem `break`, a execução \"cai\" no próximo `case`"
        - "`default` trata todos os valores não listados"
        - "Combine: `dia / 10` dá a dezena, `dia % 10` a unidade"
      resolvida:
        id: "A1-2012.2-QIV"
        rotulo: "Avaliação 1 – 2012.2, Questão IV"
        titulo: "Data por extenso"
        pdf: "avaliacao_1_ano_2012_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2012_2.pdf"
        solucao: "a1_2012_2_q4.c"
        codigo: "// A1-2012.2 – Questão IV: Data por extenso\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int dia, mes;                                       // data lida\n    printf(\"Dia e mês: \");                              // pede a data\n    scanf(\"%d %d\", &dia, &mes);                         // lê os dois inteiros\n    if (dia < 1 || dia > 31 || mes < 1 || mes > 12) {   // validação básica\n        printf(\"Data inválida\\n\");                      // avisa\n        return 1;                                       // fim com erro\n    }\n    if (dia == 1) printf(\"primeiro\");                   // o dia 1 tem nome próprio\n    else if (dia >= 10 && dia <= 19) {                  // 10 a 19: nomes especiais\n        switch (dia) {                                  // escolhe pelo valor exato\n            case 10: printf(\"dez\"); break;              // cada caso imprime e sai do switch\n            case 11: printf(\"onze\"); break;\n            case 12: printf(\"doze\"); break;\n            case 13: printf(\"treze\"); break;\n            case 14: printf(\"quatorze\"); break;\n            case 15: printf(\"quinze\"); break;\n            case 16: printf(\"dezesseis\"); break;\n            case 17: printf(\"dezessete\"); break;\n            case 18: printf(\"dezoito\"); break;\n            default: printf(\"dezenove\"); break;         // sobrou o 19\n        }\n    } else {                                            // demais: dezena + \"e\" + unidade\n        if (dia / 10 == 2) printf(\"vinte\");             // 20 a 29\n        if (dia / 10 == 3) printf(\"trinta\");            // 30 e 31\n        if (dia >= 20 && dia % 10 != 0) printf(\" e \");  // 21, 22...: \"vinte e ...\"\n        switch (dia % 10) {                             // a unidade\n            case 1: printf(\"um\"); break;\n            case 2: printf(\"dois\"); break;\n            case 3: printf(\"três\"); break;\n            case 4: printf(\"quatro\"); break;\n            case 5: printf(\"cinco\"); break;\n            case 6: printf(\"seis\"); break;\n            case 7: printf(\"sete\"); break;\n            case 8: printf(\"oito\"); break;\n            case 9: printf(\"nove\"); break;\n        }                                               // unidade 0 (20, 30): nada a imprimir\n    }\n    printf(\" de \");                                     // ligação entre dia e mês\n    switch (mes) {                                      // nome do mês\n        case 1: printf(\"janeiro\"); break;\n        case 2: printf(\"fevereiro\"); break;\n        case 3: printf(\"março\"); break;\n        case 4: printf(\"abril\"); break;\n        case 5: printf(\"maio\"); break;\n        case 6: printf(\"junho\"); break;\n        case 7: printf(\"julho\"); break;\n        case 8: printf(\"agosto\"); break;\n        case 9: printf(\"setembro\"); break;\n        case 10: printf(\"outubro\"); break;\n        case 11: printf(\"novembro\"); break;\n        default: printf(\"dezembro\"); break;             // sobrou o 12\n    }\n    printf(\"\\n\");                                       // termina a linha\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2017.1-QII"
        rotulo: "Avaliação 1 – 2017.1, Questão II"
        titulo: "Jogo do bicho – valor do prêmio"
        pdf: "avaliacao_1_ano_2017_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2017_1.pdf"
        solucao: "a1_2017_1_q2.c"
        codigo: "// A1-2017.1 – Questão II: Jogo do bicho – valor do prêmio\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    double v;                                           // valor apostado\n    int n, m;                                           // número apostado e número sorteado\n    printf(\"Valor, número apostado e número sorteado: \");   // pede os dados\n    scanf(\"%lf %d %d\", &v, &n, &m);                     // lê os três valores\n    int dn = n % 100, dm = m % 100;                     // dois últimos dígitos (dezena e unidade)\n    if (dn == 0) dn = 100;                              // 00 pertence ao último grupo (97, 98, 99, 00)\n    if (dm == 0) dm = 100;                              // idem\n    double premio;                                      // valor a receber\n    if (n % 10000 == m % 10000) premio = v * 3000;      // milhar: quatro últimos dígitos iguais\n    else if (n % 1000 == m % 1000) premio = v * 500;    // centena: três últimos\n    else if (n % 100 == m % 100) premio = v * 50;       // dezena: dois últimos\n    else if ((dn - 1) / 4 == (dm - 1) / 4) premio = v * 16;   // mesmo grupo: 01-04 → 0, 05-08 → 1...\n    else premio = 0;                                    // nenhum critério\n    printf(\"Prêmio: R$ %.2f\\n\", premio);                // o else if garante só o maior prêmio\n    return 0;                                           // fim sem erro\n}"
    - n: 9
      tema: "Geometria com condições: pontos e regiões"
      tipo: "aula"
      objetivo: "Decidir se pontos estão dentro de regiões e calcular sobreposições com `max`/`min`."
      slides: "aula09.pdf"
      conceitos:
        - "Ponto dentro de um retângulo: `x >= xmin && x <= xmax && y >= ymin && y <= ymax`"
        - "Faça o desenho com eixos e teste os pontos da borda"
        - "Sobreposição de intervalos [a1, b1] e [a2, b2]: de `max(a1, a2)` até `min(b1, b2)`"
        - "Se `max(a1, a2) >= min(b1, b2)`, não há sobreposição"
      resolvida:
        id: "A1-2025.2-QI"
        rotulo: "Avaliação 1 – 2025.2, Questão I"
        titulo: "Beach tennis – a bola caiu dentro ou fora?"
        pdf: "avaliacao_1_ano_2025_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2025_2.pdf"
        solucao: "a1_2025_2_q1.c"
        codigo: "// A1-2025.2 – Questão I: Beach tennis – a bola caiu dentro ou fora?\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int k, x, y;                                        // tamanho da quadra e coordenada da bola\n    printf(\"k, x e y: \");                               // pede os dados\n    scanf(\"%d %d %d\", &k, &x, &y);                      // lê os três inteiros\n    // a quadra 2k x k tem o juiz no meio da linha de base: x vai de -k a k e y de 0 a k\n    if (x >= -k && x <= k && y >= 0 && y <= k) {        // em cima da linha conta como dentro (>= e <=)\n        printf(\"dentro\\n\");                             // bola válida\n    } else {                                            // qualquer coordenada fora dos limites\n        printf(\"fora\\n\");                               // bola fora\n    }\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2023.1-QI"
        rotulo: "Avaliação 1 – 2023.1, Questão I"
        titulo: "Área de reserva (sobreposição de dois terrenos)"
        pdf: "avaliacao_1_ano_2023_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2023_1.pdf"
        solucao: "a1_2023_1_q1.c"
        codigo: "// A1-2023.1 – Questão I: Área de reserva (sobreposição de dois terrenos)\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int x1, y1, v1, h1, x2, y2, v2, h2;                 // canto superior esquerdo, dimensão vertical e horizontal\n    printf(\"Terreno 1 (x y vertical horizontal) e terreno 2: \");   // pede os oito valores\n    scanf(\"%d %d %d %d %d %d %d %d\", &x1, &y1, &v1, &h1, &x2, &y2, &v2, &h2); // posição, velocidade e direção de cada carro\n    // no mapa o y cresce para baixo: o terreno 1 ocupa x de x1 a x1+h1 e y de y1 a y1+v1\n    int esq = x1 > x2 ? x1 : x2;                        // borda esquerda da sobreposição: o maior dos x\n    int dir = (x1 + h1) < (x2 + h2) ? (x1 + h1) : (x2 + h2);   // borda direita: a menor das direitas\n    int topo = y1 > y2 ? y1 : y2;                       // borda de cima: o maior dos y\n    int base = (y1 + v1) < (y2 + v2) ? (y1 + v1) : (y2 + v2);  // borda de baixo: a menor das bases\n    if (esq < dir && topo < base) {                     // largura e altura positivas: existe área\n        printf(\"%d %d %d %d\\n\", esq, topo, dir - esq, base - topo);   // x, y, horizontal, vertical\n    } else {                                            // só encostam ou nem se tocam\n        printf(\"NÃO EXISTE ÁREA SUGERIDA\\n\");           // mensagem pedida\n    }\n    return 0;                                           // fim sem erro\n}"
    - n: 10
      tema: "Modelagem: do enunciado à conta"
      tipo: "aula"
      objetivo: "Transformar uma situação do dia a dia em contas com `/` e `%` e decisões simples."
      slides: "aula10.pdf"
      conceitos:
        - "Leia o enunciado duas vezes e liste: dados, o que imprimir, restrições"
        - "Faça 2 exemplos à mão **antes** de programar"
        - "Pontos igualmente espaçados: ponto anterior = `d / p`, distância até ele = `d % p`"
        - "Escolher o mais próximo: comparar `resto` com `p - resto`"
      resolvida:
        id: "A1-2025.2-QII"
        rotulo: "Avaliação 1 – 2025.2, Questão II"
        titulo: "Luiza – em que ponto descer e quanto andar"
        pdf: "avaliacao_1_ano_2025_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2025_2.pdf"
        solucao: "a1_2025_2_q2.c"
        codigo: "// A1-2025.2 – Questão II: Luiza – em que ponto descer e quanto andar\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int m, p, d;                                        // tamanho da avenida, distância entre pontos, distância da escola\n    printf(\"M, P e D (metros): \");                      // pede os dados\n    scanf(\"%d %d %d\", &m, &p, &d);                      // lê os três inteiros\n    if (d < 0 || d > m || p <= 0 || m % p != 0) {       // dados fora do que o enunciado garante\n        printf(\"Dados inválidos\\n\");                    // avisa\n        return 1;                                       // fim com erro\n    }\n    int antes = d / p;                                  // índice do ponto anterior à escola (0 = primeiro)\n    int resto = d % p;                                  // metros entre esse ponto e a escola\n    if (resto * 2 <= p) {                               // a escola está mais perto do ponto anterior\n        printf(\"Descer no ponto %d e andar %d metros em direção ao Fim da Avenida\\n\", antes + 1, resto); // mais perto do ponto anterior: anda para a frente\n    } else {                                            // mais perto do ponto seguinte\n        printf(\"Descer no ponto %d e andar %d metros em direção ao Início da Avenida\\n\", antes + 2, p - resto); // mais perto do próximo ponto: anda de volta\n    }\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2024.1-QI"
        rotulo: "Avaliação 1 – 2024.1, Questão I"
        titulo: "Acelerador de partículas – qual sensor foi atingido?"
        pdf: "avaliacao_1_ano_2024_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2024_1.pdf"
        solucao: "a1_2024_1_q1.c"
        codigo: "// A1-2024.1 – Questão I: Acelerador de partículas – qual sensor foi atingido?\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int d;                                              // distância total percorrida (km)\n    printf(\"Distância total (km): \");                   // pede a distância\n    scanf(\"%d\", &d);                                    // lê a distância\n    // pela figura: os trechos fixos do emissor ao acelerador e da saída ao sensor somam 5 km,\n    // e cada volta completa tem 8 km; o que sobra das voltas indica a saída (1, 2 ou 3)\n    int sensor = (d - 5) % 8;                           // resto depois de tirar os trechos fixos e as voltas\n    if (sensor >= 1 && sensor <= 3) printf(\"A partícula atinge o sensor %d\\n\", sensor); // só existem os sensores 1, 2 e 3\n    else printf(\"Distância incompatível com o acelerador\\n\");   // não corresponde a nenhuma saída\n    return 0;                                           // fim sem erro\n}"
    - n: 11
      tema: "Bits: XOR, AND e deslocamento"
      tipo: "aula"
      objetivo: "Manipular os bits de um inteiro com `^`, `&` e `>>`."
      slides: "aula11.pdf"
      conceitos:
        - "`a ^ b` (XOR): bit 1 onde `a` e `b` diferem"
        - "`x & 1` é o último bit; `x >> k` desloca k casas para a direita"
        - "Bit k de x: `(x >> k) & 1`"
        - "Inverter o bit k: `x ^ (1 << k)`"
        - "Equivalente sem bits: `% 2` e `/ 2`"
      resolvida:
        id: "A1-2026.1-QII"
        rotulo: "Avaliação 1 – 2026.1, Questão II"
        titulo: "Números n-binariamente distintos"
        pdf: "avaliacao_1_ano_2026_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2026_1.pdf"
        solucao: "a1_2026_1_q2.c"
        codigo: "// A1-2026.1 – Questão II: Números n-binariamente distintos\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n, a, b;                                        // limiar n e os dois números (menores que 16)\n    printf(\"n, a e b: \");                               // pede os dados\n    scanf(\"%d %d %d\", &n, &a, &b);                      // lê os três inteiros\n    int x = a ^ b;                                      // OU exclusivo: bit 1 onde a e b diferem\n    int diferentes = (x & 1) + ((x >> 1) & 1) + ((x >> 2) & 1) + ((x >> 3) & 1);   // conta os 4 bits\n    if (diferentes >= n) printf(\"%d e %d são %d-binariamente distintos\\n\", a, b, n); // bits diferentes suficientes\n    else printf(\"%d e %d não são %d-binariamente distintos\\n\", a, b, n);   // menos bits diferentes que n\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A1-2023.2-QII"
        rotulo: "Avaliação 1 – 2023.2, Questão II"
        titulo: "Mutação por swap (inverter um bit)"
        pdf: "avaliacao_1_ano_2023_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2023_2.pdf"
        solucao: "a1_2023_2_q2.c"
        codigo: "// A1-2023.2 – Questão II: Mutação por swap (inverter um bit)\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int individuo, bit;                                 // número entre 0 e 35 e bit entre 0 e 4\n    printf(\"Indivíduo (0 a 35) e bit (0 a 4): \");       // pede os dados\n    scanf(\"%d %d\", &individuo, &bit);                   // lê os dois inteiros\n    if (individuo < 0 || individuo > 35 || bit < 0 || bit > 4) {   // fora dos limites do enunciado\n        printf(\"Valores inválidos\\n\");                  // avisa\n        return 1;                                       // fim com erro\n    }\n    int mascara = 1 << bit;                             // 1 deslocado: só o bit escolhido ligado (bit 3 → 01000)\n    int mutante = individuo ^ mascara;                  // XOR inverte exatamente esse bit\n    printf(\"Novo indivíduo: %d\\n\", mutante);            // 28 (11100) → 20 (10100)\n    return 0;                                           // fim sem erro\n}"
    - n: 12
      tema: "Avaliação I"
      tipo: "avaliacao"
      objetivo: "Prova do Bloco 1, no formato das avaliações anteriores. Abaixo, uma prova-modelo com duas questões de provas passadas."
      questoes:
        - id: "A1-2024.1-QII"
          rotulo: "Avaliação 1 – 2024.1, Questão II"
          titulo: "Cadeado de três rodas – menor número de movimentos"
          pdf: "avaliacao_1_ano_2024_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2024_1.pdf"
          solucao: "a1_2024_1_q2.c"
          codigo: "// A1-2024.1 – Questão II: Cadeado de três rodas – menor número de movimentos\n#include <stdio.h>                                      // printf e scanf\n#include <stdlib.h>                                     // abs\n\nint main(void) {                                        // início do programa\n    int atual, segredo;                                 // números de 3 dígitos\n    printf(\"Número atual e segredo: \");                 // pede os dois números\n    scanf(\"%d %d\", &atual, &segredo);                   // lê os dois inteiros\n    int total = 0;                                      // acumula os movimentos\n    int d;                                              // diferença em uma roda\n    d = abs(atual / 100 - segredo / 100);               // roda das centenas\n    total += d < 10 - d ? d : 10 - d;                   // o menor caminho: para cima (d) ou para baixo (10 - d)\n    d = abs((atual / 10) % 10 - (segredo / 10) % 10);   // roda das dezenas\n    total += d < 10 - d ? d : 10 - d;                   // mesma regra\n    d = abs(atual % 10 - segredo % 10);                 // roda das unidades\n    total += d < 10 - d ? d : 10 - d;                   // mesma regra\n    printf(\"Movimentos: %d\\n\", total);                  // 2 + 2 + 1 = 5 no exemplo\n    return 0;                                           // fim sem erro\n}"
        - id: "A1-2026.1-QI"
          rotulo: "Avaliação 1 – 2026.1, Questão I"
          titulo: "Teleférico – número mínimo de viagens"
          pdf: "avaliacao_1_ano_2026_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2026_1.pdf"
          solucao: "a1_2026_1_q1.c"
          codigo: "// A1-2026.1 – Questão I: Teleférico – número mínimo de viagens\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int capacidade, alunos;                             // pessoas por viagem (>= 2) e total de alunos\n    printf(\"Capacidade da cabine e número de alunos: \");   // pede os dados\n    scanf(\"%d %d\", &capacidade, &alunos);               // lê os dois inteiros\n    int por_viagem = capacidade - 1;                    // uma vaga é sempre do monitor\n    int viagens = (alunos + por_viagem - 1) / por_viagem;   // divisão arredondada para cima, só com inteiros\n    printf(\"Mínimo de viagens: %d\\n\", viagens);         // 20 alunos, 9 por viagem → 3\n    return 0;                                           // fim sem erro\n}"
