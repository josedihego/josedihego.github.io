      resolvida:
        id: "A1-2024.1-QI-B"
        rotulo: "Avaliação 1 – 2024.1 (versão B), Questão I"
        titulo: "Collatz – quantos números até chegar a 1"
        pdf: "avaliacao_1_ano_2024_1_B.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_1_ano_2024_1_B.pdf"
        solucao: "a1_2024_1_b_q1.c"
        codigo: "// A1-2024.1 (B) – Questão I: Collatz – quantos números até chegar a 1\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    long n;                                             // long: a sequência sobe bastante antes de descer\n    printf(\"Número: \");                                 // pede o número\n    scanf(\"%ld\", &n);                                   // lê o número\n    int termos = 1;                                     // o próprio número já conta\n    while (n != 1) {                                    // até chegar a 1\n        if (n % 2 == 0) n = n / 2;                      // par: divide por 2\n        else n = 3 * n + 1;                             // ímpar: 3n + 1\n        termos++;                                       // mais um número na sequência\n    }\n    printf(\"%d números na sequência\\n\", termos);        // 5: 5, 16, 8, 4, 2, 1 → 6\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2026.1-QI"
        rotulo: "Avaliação 2 – 2026.1, Questão I"
        titulo: "Meia-vida – quando o paciente fica intoxicado tomando de 6 em 6 horas"
        pdf: "avaliacao_2_ano_2026_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2026_1.pdf"
        solucao: "a2_2026_1_q1.c"
        codigo: "// A2-2026.1 – Questão I: Meia-vida – quando o paciente fica intoxicado tomando de 6 em 6 horas\n#include <stdio.h>                                      // printf\n#define DOSE 800.0                                      // mg por comprimido\n#define LIMITE 1520.0                                   // acima disso: superdosagem\n\nint main(void) {                                        // início do programa\n    double teor = DOSE;                                 // primeira dose na hora 0\n    int horas = 0;                                      // relógio do tratamento\n    while (teor <= LIMITE) {                            // ainda não intoxicou\n        horas += 6;                                     // passam 6 horas (uma meia-vida)\n        teor = teor / 2 + DOSE;                         // metade foi metabolizada e entra nova dose\n        printf(\"Hora %2d: %.0f mg\\n\", horas, teor);     // mostra a evolução: 1200, 1400, 1500, 1550\n    }\n    printf(\"Intoxicado em %d horas\\n\", horas);          // primeira vez acima de 1520 mg\n    return 0;                                           // fim sem erro\n}"
    - n: 17
      tema: "Laços aninhados: primos e divisores"
      tipo: "aula"
      objetivo: "Usar um laço dentro de outro para testar divisibilidade."
      slides: "aula17.pdf"
      conceitos:
        - "n é primo se nenhum d de 2 até √n divide n"
        - "Condição `d * d <= n` evita `sqrt`"
        - "Laço externo escolhe candidatos; interno testa cada um"
        - "Bandeira (flag): `primo = 1` antes, `primo = 0` ao achar divisor"
      resolvida:
        id: "A2-2014.2-QII"
        rotulo: "Avaliação 2 – 2014.2, Questão II"
        titulo: "Os N primeiros pares de primos gêmeos"
        pdf: "avaliacao_2_ano_2014_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2014_2.pdf"
        solucao: "a2_2014_2_q2.c"
        codigo: "// A2-2014.2 – Questão II: Os N primeiros pares de primos gêmeos\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // quantos pares mostrar\n    printf(\"N: \");                                      // pede N\n    scanf(\"%d\", &n);                                    // lê N\n    int achados = 0;                                    // pares já mostrados\n    for (int p = 3; achados < n; p += 2) {              // candidatos ímpares 3, 5, 7...\n        int p_primo = 1, q_primo = 1;                   // supõe que p e p + 2 são primos\n        for (int d = 3; d * d <= p + 2; d += 2) {       // testa divisores ímpares até a raiz\n            if (p % d == 0 && d < p) p_primo = 0;       // d divide p (e não é o próprio p)\n            if ((p + 2) % d == 0 && d < p + 2) q_primo = 0;   // d divide p + 2\n        }\n        if (p_primo && q_primo) {                       // os dois primos: é um par de gêmeos\n            printf(\"(%d, %d)\\n\", p, p + 2);             // mostra o par\n            achados++;                                  // conta o par\n        }\n    }\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2019.2-QIII"
        rotulo: "Avaliação 2 – 2019.2, Questão III"
        titulo: "sigma(n), a soma dos divisores, para n de 1 a N"
        pdf: "avaliacao_2_ano_2019_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2019_2.pdf"
        solucao: "a2_2019_2_q3.c"
        codigo: "// A2-2019.2 – Questão III: sigma(n), a soma dos divisores, para n de 1 a N\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // limite N\n    printf(\"N: \");                                      // pede N\n    scanf(\"%d\", &n);                                    // lê N\n    for (int k = 1; k <= n; k++) {                      // laço de fora: cada k da lista\n        int sigma = 0;                                  // soma dos divisores de k\n        for (int d = 1; d <= k; d++) {                  // laço de dentro: candidatos a divisor\n            if (k % d == 0) sigma += d;                 // d divide k: soma\n        }\n        printf(\"%d%s\", sigma, k < n ? \", \" : \"\\n\");     // vírgula entre os termos, quebra no fim\n    }\n    return 0;                                           // fim sem erro\n}"
    - n: 18
      tema: "Funções: dividir para conquistar"
      tipo: "aula"
      objetivo: "Escrever funções com parâmetros e retorno e reutilizá-las."
      slides: "aula18.pdf"
      conceitos:
        - "`int nome(int x) { ... return valor; }`"
        - "Declare a função **antes** do `main` (ou o protótipo)"
        - "Uma função = uma pergunta: `e_primo(n)` responde 1 ou 0"
        - "Variáveis dentro da função são locais"
      resolvida:
        id: "A2-2016.2-QI"
        rotulo: "Avaliação 2 – 2016.2, Questão I"
        titulo: "Primo de Chen (com funções)"
        pdf: "avaliacao_2_ano_2016_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2016_2.pdf"
        solucao: "a2_2016_2_q1.c"
        codigo: "// A2-2016.2 – Questão I: Primo de Chen (com funções)\n#include <stdio.h>                                      // printf e scanf\n\nint e_primo(int n) {                                    // devolve 1 se n for primo, 0 se não\n    if (n < 2) return 0;                                // 0 e 1 não são primos\n    for (int d = 2; d * d <= n; d++)                    // basta testar até a raiz\n        if (n % d == 0) return 0;                       // achou divisor: não é primo\n    return 1;                                           // nenhum divisor: primo\n}\n\nint e_semiprimo(int n) {                                // 1 se n for o produto de dois primos\n    for (int d = 2; d * d <= n; d++)                    // menor fator possível\n        if (n % d == 0) return e_primo(d) && e_primo(n / d);   // primeiro divisor: os dois fatores são primos?\n    return 0;                                           // sem divisores: é primo, não semiprimo\n}\n\nint main(void) {                                        // início do programa\n    int p;                                              // número lido\n    printf(\"Número: \");                                 // pede o número\n    scanf(\"%d\", &p);                                    // lê o número\n    if (!e_primo(p)) printf(\"%d não é primo\\n\", p);     // primo de Chen precisa ser primo\n    else if (e_primo(p + 2) || e_semiprimo(p + 2)) printf(\"%d é primo de Chen\\n\", p); // p + 2 primo ou semiprimo: definição de Chen\n    else printf(\"%d não é primo de Chen\\n\", p);         // p + 2 tem 3 ou mais fatores primos\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2016.1-QII"
        rotulo: "Avaliação 2 – 2016.1, Questão II"
        titulo: "Números brasileiros"
        pdf: "avaliacao_2_ano_2016_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2016_1.pdf"
        solucao: "a2_2016_1_q2.c"
        codigo: "// A2-2016.1 – Questão II: Números brasileiros\n#include <stdio.h>                                      // printf e scanf\n\nint digitos_iguais(int n, int base) {                   // 1 se n escrito na base tiver todos os dígitos iguais\n    int ultimo = n % base;                              // dígito menos significativo\n    while (n > 0) {                                     // percorre os dígitos na base\n        if (n % base != ultimo) return 0;               // achou um dígito diferente\n        n = n / base;                                   // próximo dígito\n    }\n    return 1;                                           // todos iguais\n}\n\nint main(void) {                                        // início do programa\n    int n;                                              // número lido\n    printf(\"Número: \");                                 // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    for (int b = 2; b < n - 1; b++) {                   // bases possíveis: 1 < b < n - 1\n        if (digitos_iguais(n, b)) {                     // achou uma base que funciona\n            printf(\"%d é brasileiro (base %d)\\n\", n, b);   // ex.: 7 = (111) na base 2\n            return 0;                                   // basta uma base\n        }\n    }\n    printf(\"%d não é brasileiro\\n\", n);                 // nenhuma base serviu\n    return 0;                                           // fim sem erro\n}"
    - n: 19
