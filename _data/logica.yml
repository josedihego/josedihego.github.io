      resolvida:
        id: "A2-2025.1-QII"
        rotulo: "Avaliação 2 – 2025.1, Questão II"
        titulo: "Robô-espantalho – quantas vezes parou na estação devastada"
        pdf: "avaliacao_2_ano_2025_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2025_1.pdf"
        solucao: "a2_2025_1_q2.c"
        codigo: "// A2-2025.1 – Questão II: Robô-espantalho – quantas vezes parou na estação devastada\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n, c, alvo;                                     // estações, comandos, estação mais próxima da área devastada\n    scanf(\"%d %d %d\", &n, &c, &alvo);                   // lê os três inteiros\n    int estacao = 1;                                    // o robô começa o dia na estação 1\n    int vezes = (estacao == alvo);                      // conta a estação inicial, se for o alvo\n    for (int i = 0; i < c; i++) {                       // executa os c comandos\n        int cmd;                                        // 1 = horário, -1 = anti-horário\n        scanf(\"%d\", &cmd);                              // lê o comando\n        estacao = (estacao - 1 + cmd + n) % n + 1;      // anda no círculo 1..n (o + n evita resto negativo)\n        if (estacao == alvo) vezes++;                   // parou no alvo\n    }\n    printf(\"%d\\n\", vezes);                              // 2 no exemplo\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2023.2-QI"
        rotulo: "Avaliação 2 – 2023.2, Questão I"
        titulo: "O chefe ao telefone – \"zero\" apaga o último número"
        pdf: "avaliacao_2_ano_2023_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2023_2.pdf"
        solucao: "a2_2023_2_q1.c"
        codigo: "// A2-2023.2 – Questão I: O chefe ao telefone – \"zero\" apaga o último número\n#include <stdio.h>                                      // printf e scanf\n#define MAX 1000                                        // vendas que cabem na \"pilha\"\n\nint main(void) {                                        // início do programa\n    int pilha[MAX];                                     // números ainda válidos\n    int topo = 0;                                       // quantos números estão na pilha\n    int x;                                              // número falado\n    scanf(\"%d\", &x);                                    // primeira leitura\n    while (x >= 0) {                                    // negativo encerra a lista\n        if (x == 0) {                                   // \"zero\": apaga o último número\n            if (topo > 0) topo--;                       // só se houver algum\n        } else {                                        // número de venda\n            pilha[topo++] = x;                          // empilha\n        }\n        scanf(\"%d\", &x);                                // próxima leitura\n    }\n    int soma = 0;                                       // total das vendas\n    for (int i = 0; i < topo; i++) soma += pilha[i];    // soma o que sobrou na pilha\n    printf(\"%d\\n\", soma);                               // 1 + 6 = 7 no exemplo\n    return 0;                                           // fim sem erro\n}"
    - n: 24
      tema: "Avaliação II"
      tipo: "avaliacao"
      objetivo: "Prova do Bloco 2, no formato das avaliações anteriores. Abaixo, uma prova-modelo com duas questões de provas passadas."
      questoes:
        - id: "A2-2025.1-QI"
          rotulo: "Avaliação 2 – 2025.1, Questão I"
          titulo: "Cofre – quantas vezes cada dígito passa pelo controle"
          pdf: "avaliacao_2_ano_2025_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2025_1.pdf"
          solucao: "a2_2025_1_q1.c"
          codigo: "// A2-2025.1 – Questão I: Cofre – quantas vezes cada dígito passa pelo controle\n#include <stdio.h>                                      // printf e scanf\n#define T 14                                            // tamanho da barra: troque aqui (e os valores) para outra barra\n\nint main(void) {                                        // início do programa\n    int barra[T] = {9, 4, 3, 9, 1, 2, 4, 5, 1, 1, 9, 7, 0, 5};   // números da figura da prova\n    int conta[10] = {0};                                // conta[d]: vezes que o dígito d apareceu no controle\n    int atual;                                          // posição atual (de 1 a T)\n    scanf(\"%d\", &atual);                                // a primeira é sempre 1\n    conta[barra[atual - 1]]++;                          // o número da posição inicial conta\n    int prox;                                           // próxima parada\n    scanf(\"%d\", &prox);                                 // lê a próxima posição\n    while (prox > 0) {                                  // zero ou negativo encerra\n        int passo = prox > atual ? 1 : -1;              // para a direita (+1) ou para a esquerda (-1)\n        for (int p = atual + passo; p != prox + passo; p += passo)   // cada posição percorrida, sem repetir a atual\n            conta[barra[p - 1]]++;                      // posição p da barra é o índice p - 1 do vetor\n        atual = prox;                                   // agora o controle está na nova parada\n        scanf(\"%d\", &prox);                             // próxima parada\n    }\n    for (int d = 0; d < 10; d++) printf(\"%d%s\", conta[d], d < 9 ? \" \" : \"\\n\");   // as 10 contagens\n    return 0;                                           // fim sem erro\n}"
        - id: "A2-2026.1-QII"
          rotulo: "Avaliação 2 – 2026.1, Questão II"
          titulo: "Rotina de Kaprekar até 6174"
          pdf: "avaliacao_2_ano_2026_1.pdf"
          url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2026_1.pdf"
          solucao: "a2_2026_1_q2.c"
          codigo: "// A2-2026.1 – Questão II: Rotina de Kaprekar até 6174\n#include <stdio.h>                                      // printf e scanf\n\nint main(void) {                                        // início do programa\n    int n;                                              // número de 4 dígitos (com dígitos distintos)\n    printf(\"Número de 4 dígitos: \");                    // pede o número\n    scanf(\"%d\", &n);                                    // lê o número\n    do {                                                // pelo menos uma vez (6174 → 7641 - 1467 = 6174)\n        int d[4];                                       // os quatro dígitos\n        for (int i = 0, x = n; i < 4; i++, x /= 10) d[i] = x % 10;   // separa (com zeros à esquerda)\n        for (int p = 0; p < 3; p++)                     // ordena crescente (bubble sort)\n            for (int i = 0; i < 3 - p; i++)             // bubble sort: a cada passada, o maior vai para o fim\n                if (d[i] > d[i + 1]) { int aux = d[i]; d[i] = d[i + 1]; d[i + 1] = aux; } // fora de ordem: troca os vizinhos\n        int menor = d[0] * 1000 + d[1] * 100 + d[2] * 10 + d[3];   // dígitos em ordem crescente\n        int maior = d[3] * 1000 + d[2] * 100 + d[1] * 10 + d[0];   // em ordem decrescente\n        n = maior - menor;                              // próximo número da rotina\n        printf(\"%d - %d = %d\\n\", maior, menor, n);      // mostra a transição\n    } while (n != 6174);                                // até atingir a constante\n    return 0;                                           // fim sem erro\n}"
