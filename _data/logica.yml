        rotulo: "Avaliação 2 – 2019.2, Questão I"
        titulo: "Quantas subsequências consecutivas somam exatamente X"
        pdf: "avaliacao_2_ano_2019_2.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2019_2.pdf"
        solucao: "a2_2019_2_q1.c"
        codigo: "// A2-2019.2 – Questão I: Quantas subsequências consecutivas somam exatamente X\n#include <stdio.h>                                      // printf e scanf\n#define MAX 1000                                        // tamanho máximo da sequência\n\nint main(void) {                                        // início do programa\n    int n, x;                                           // tamanho da sequência e soma procurada\n    int v[MAX];                                         // a sequência\n    scanf(\"%d\", &n);                                    // lê N\n    for (int i = 0; i < n; i++) scanf(\"%d\", &v[i]);     // lê os N números\n    scanf(\"%d\", &x);                                    // lê X\n    int quantas = 0;                                    // contador de subsequências\n    for (int ini = 0; ini < n; ini++) {                 // cada ponto de partida\n        int soma = 0;                                   // soma de v[ini..fim]\n        for (int fim = ini; fim < n; fim++) {           // estende a subsequência um elemento por vez\n            soma += v[fim];                             // aproveita a soma anterior\n            if (soma == x) quantas++;                   // achou uma\n        }\n    }\n    printf(\"%d subsequências\\n\", quantas);              // 5 no exemplo\n    return 0;                                           // fim sem erro\n}"
      proposta:
        id: "A2-2016.1-QIII"
        rotulo: "Avaliação 2 – 2016.1, Questão III"
        titulo: "Corredor de salas – máximo de vidas"
        pdf: "avaliacao_2_ano_2016_1.pdf"
        url: "https://github.com/josedihego/programacaoC/blob/main/INF027_listas_provas_PDF/avaliacao_2_ano_2016_1.pdf"
        solucao: "a2_2016_1_q3.c"
        codigo: "// A2-2016.1 – Questão III: Corredor de salas – máximo de vidas\n#include <stdio.h>                                      // printf e scanf\n#define N 10                                            // salas do corredor\n\nint main(void) {                                        // início do programa\n    int v[N];                                           // vidas ganhas em cada sala\n    for (int i = 0; i < N; i++) scanf(\"%d\", &v[i]);     // lê as 10 salas\n    int melhor = v[0];                                  // melhor soma encontrada\n    for (int ini = 0; ini < N; ini++) {                 // sala de entrada\n        int soma = 0;                                   // vidas de ini até fim\n        for (int fim = ini; fim < N; fim++) {           // sala de saída\n            soma += v[fim];                             // entra em mais uma sala\n            if (soma > melhor) melhor = soma;           // guarda o recorde\n        }\n    }\n    printf(\"Máximo: %d vidas\\n\", melhor);               // 5 - 1 + 8 = 12 no exemplo\n    return 0;                                           // fim sem erro\n}"
