<!-- Site-wide scripts (included at the end of <body>, before the theme's own scripts) -->
<script>
  // Open external links in a new tab
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (/^https?:$/.test(a.protocol) && a.hostname !== location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
  });

  var isPt = (document.documentElement.lang || '').slice(0, 2) === 'pt';

  // PT | EN switch in the masthead, only on pages that exist in both languages (hreflang alternates in <head>)
  (function () {
    var wrap = document.querySelector('.masthead__inner-wrap');
    var alt = {};
    document.querySelectorAll('link[rel="alternate"][hreflang]').forEach(function (l) { alt[l.hreflang] = l.href; });
    if (!wrap || !alt.pt || !alt.en) return;
    var langs = [
      { code: 'pt', label: 'PT', flag: '/assets/images/br-flag.svg', name: 'Português' },
      { code: 'en', label: 'EN', flag: '/assets/images/uk-flag.svg', name: 'English' }
    ];
    var box = document.createElement('div');
    box.className = 'lang-switch';
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', isPt ? 'Idioma' : 'Language');
    langs.forEach(function (l, i) {
      var current = (isPt ? 'pt' : 'en') === l.code;
      var el = document.createElement(current ? 'span' : 'a');
      if (current) { el.className = 'is-current'; el.setAttribute('aria-current', 'true'); }
      else { el.href = alt[l.code]; el.hreflang = l.code; el.lang = l.code; el.title = l.name; }
      el.innerHTML = '<span class="lang-label">' + l.label + '</span><img src="' + l.flag + '" alt="" width="20" height="14">';
      if (i) { var sep = document.createElement('span'); sep.className = 'lang-sep'; sep.textContent = '|'; box.appendChild(sep); }
      box.appendChild(el);
    });
    wrap.appendChild(box);
  })();

  // Light/dark toggle at the right end of the masthead (outside the nav, so the theme's menu sizing accounts for it)
  (function () {
    var wrap = document.querySelector('.masthead__inner-wrap');
    if (!wrap || !window.setTheme) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-toggle';
    function render() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.innerHTML = '<i class="fas ' + (dark ? 'fa-sun' : 'fa-moon') + '" aria-hidden="true"></i>';
      btn.setAttribute('aria-label', dark ? (isPt ? 'Mudar para tema claro' : 'Switch to light theme')
                                          : (isPt ? 'Mudar para tema escuro' : 'Switch to dark theme'));
      btn.title = btn.getAttribute('aria-label');
    }
    btn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      window.setTheme(dark ? 'light' : 'dark');
      render();
    });
    render();
    wrap.appendChild(btn);
  })();

  // Keyboard shortcut: "/" or Ctrl/Cmd+K opens search
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) {
      var toggle = document.querySelector('.search__toggle');
      if (toggle) { e.preventDefault(); toggle.click(); }
    }
  });
</script>
